l_russian:
 ZZZ_enhanced_religion.1.t:3 "Реформация религии «[From.Religion.GetName]»"
 ZZZ_enhanced_religion.1.desc:3 "[From.Monarch.GetTitle] [From.Monarch.GetName] было видение! Последователи богов стояли порознь, и один за другим их сметал могучий крест из дерева. Вскоре не осталось ни одного последователя богов, и [From.Monarch.GetTitle] [From.Monarch.GetName] увидел, как медленно меркнет сам Один. Вдруг вспыхнул яркий свет, и появился Тор, разбивший деревянный крест, а за его спиной стояли все сметённые, вместе уничтожая то, чему поодиночке были бессильны противостоять. Доверившись [From.Monarch.GetHerHis] видению, [From.Monarch.GetTitle] [From.Monarch.GetName] учредил новую религиозную иерархию. Кроме того, [From.Monarch.GetSheHe] поручил самым учёным из [From.Monarch.GetHerHis] богословов привести великие саги к единому стандарту, чтобы у каждой из них появилась одна окончательная редакция. Вместе эти стандартизированные саги будут известны как «Heilögu Sögurnar»."
 ZZZ_enhanced_religion.1.a:3 "Один ведёт нас!"
 ZZZ_enhanced_religion.1.aa:3 "Один ведёт нас!"
 ZZZ_enhanced_religion.1.b:3 "ЛЖЕЦ! ШАРЛАТАН!"
 ZZZ_enhanced_religion.1.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.2.desc:3 "Древней религии «[From.Religion.GetName]» угрожают чужеземные язычники! По земле расходится великое сказание, воспламеняющее крестьян. Оно известно просто как «Amžina Ugnis», или «Вечный огонь»; его часто исполняют бродячие певцы и скоморохи, и оно возвышает приверженцев религии «[From.Religion.GetName]» над последователями других верований. Мощный религиозный подъём вынудил созвать великий собор богословов. На нём несколько ключевых лидеров провели ряд реформ, среди которых была свободная, но непререкаемая иерархия и всеобщее признание «Amžina Ugnis» главным священным текстом религии «[From.Religion.GetName]»."
 ZZZ_enhanced_religion.2.a:3 "Эти мужи и жёны были ведомы богами!"
 ZZZ_enhanced_religion.2.aa:3 "Эти мужи и жёны были ведомы богами!"
 ZZZ_enhanced_religion.2.b:3 "Безмозглые глупцы!"
 ZZZ_enhanced_religion.2.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.3.desc:3 "Пришло время гонимым стать охотниками. Устав от постоянных вторжений соседей-еретиков и язычников, богословы религии «[From.Religion.GetName]» со всей страны собрались на великую ассамблею. Там они свели мифы религии «[From.Religion.GetName]» в единый эпос - «Калевалу». Работая над эпосом, богословы решили установить простую, но чёткую иерархию, чтобы заложенные на ассамблее основы не были утрачены со временем."
 ZZZ_enhanced_religion.3.a:3 "Мы уничтожим тех, кто выступает против богов!"
 ZZZ_enhanced_religion.3.aa:3 "Мы уничтожим тех, кто выступает против богов!"
 ZZZ_enhanced_religion.3.b:3 "Это погубит религию «[Root.Religion.GetName]», а не спасёт её!"
 ZZZ_enhanced_religion.3.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.4.desc:3 "Шире неба - наша вера неприступна. Так учили верующих религии «[From.Religion.GetName]», но недавно этот неоспоримый факт был поставлен под сомнение, когда силы еретиков и язычников стали посягать на их святые земли. В ответ на эти притеснения был созван великий собор богословов, и было решено нанести ответный удар. Была создана церковная иерархия, а также приказано составить полный перечень священных надписей на камнях. На основе текстов с этих камней [From.Monarch.GetTitle] [From.Monarch.GetName] заказал грандиозное строительство: на огромной горе будет высечена отредактированная версия всех одобренных надписей, и эти избранные тексты станут официальными догматами обновлённой веры «[From.Religion.GetName]». Это официальное собрание будет известно просто как «Надписи»."
 ZZZ_enhanced_religion.4.a:3 "Мы вновь неприступны!"
 ZZZ_enhanced_religion.4.aa:3 "Мы вновь неприступны!"
 ZZZ_enhanced_religion.4.b:3 "Не более чем тщеславная затея!"
 ZZZ_enhanced_religion.4.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.5.desc:3 "Весть разлетелась как лесной пожар по всем землям религии «[From.Religion.GetName]». Должен был собраться синод богословов невиданных прежде размеров. Толкователи знамений повсюду прочли одни и те же предзнаменования: если ничего не изменится, боги и круговорот вскоре будут забыты. Собравшись вместе, богословы реформировали веру «[From.Religion.GetName]», чтобы она лучше справлялась с вызовами современной эпохи. Со строгой церковной иерархией и официальным сводом священных мифов и легенд, известным просто как «Сказания», вера «[From.Religion.GetName]» успешно возродилась!"
 ZZZ_enhanced_religion.5.a:3 "Круговорот не прервётся!"
 ZZZ_enhanced_religion.5.aa:3 "Круговорот не прервётся!"
 ZZZ_enhanced_religion.5.b:3 "Это разорвёт наш круг!"
 ZZZ_enhanced_religion.5.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.6.desc:3 "Солнце пробивается сквозь тьму! Древняя религия «[From.Religion.GetName]» реформирована: её учения и пророчества были взвешены на предмет подлинности и собраны в единый том - «Книгу Солнца». Богословы религии «[From.Religion.GetName]» собрались на великое собрание и заперли двери, пока не была создана чёткая церковная иерархия. В честь реформации их веры устроено празднество."
 ZZZ_enhanced_religion.6.a:3 "Да славится солнце!"
 ZZZ_enhanced_religion.6.aa:3 "Да славится солнце!"
 ZZZ_enhanced_religion.6.b:3 "Тьма да поглотит этих еретиков!"
 ZZZ_enhanced_religion.6.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.7.desc:3 "Время идёт, и последователи религии «[From.Religion.GetName]» стали опасаться, что старые порядки угаснут, уступив место более агрессивным соседям. В ответ на эти страхи [From.Monarch.GetTitle] [From.Monarch.GetName] созвал великий конклав самых учёных богословов страны. После многих бессонных дней и ночей конклав пришёл к согласию по нескольким важным религиозным вопросам, включая стандартизацию «Mdodus» и организацию монашества."
 ZZZ_enhanced_religion.7.a:3 "Старые порядки не умрут никогда!"
 ZZZ_enhanced_religion.7.aa:3 "Старые порядки не умрут никогда!"
 ZZZ_enhanced_religion.7.b:3 "Глупцы!"
 ZZZ_enhanced_religion.7.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.8.desc:3 "Подобно фениксу из пепла, возродилась древняя и почитаемая религия греков и римлян. Впервые за столетия оспаривая у христианской церкви господство в Европе, [From.Monarch.GetTitle] [From.Monarch.GetName] сумел восстановить действующую иерархию авгуров и систематизированную систему верований, не менее детально разработанную, чем христианская и исламская. Больше не отнесённые к прошлому, приверженцы эллинской веры теперь смотрят в будущее."
 ZZZ_enhanced_religion.8.a:3 "Всемогущий Юпитер, укажи нам путь!"
 ZZZ_enhanced_religion.8.aa:3 "Всемогущий Юпитер, укажи нам путь!"
 ZZZ_enhanced_religion.8.b:3 "Неужели они хотят снова стать никому не нужными!?"
 ZZZ_enhanced_religion.8.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.9.desc:3 "Когда-то имена богов Ра и Осириса глубоко западали в сердца людей. Веками люди, страшась смерти, пытались сжечь мост между нашим миром и загробным, пока не уцелела лишь тончайшая доска. Однако под руководством [From.Monarch.GetName] кушитская вера была возрождена и вновь вышла на первый план. Мост, который едва не был потерян, снова стоит крепко."
 ZZZ_enhanced_religion.9.a:3 "Мы будем беречь этот мост вечно!"
 ZZZ_enhanced_religion.9.aa:3 "Мы будем беречь этот мост вечно!"
 ZZZ_enhanced_religion.9.b:3 "Это предательство богов!"
 ZZZ_enhanced_religion.9.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.10.desc:3 "Они пытались лишить силы талтошей, лгали нашему народу и провозглашали мнимую порочность талтошей. [Root.Monarch.GetName] знал лучше: [Root.Monarch.GetSheHe] отказался отречься от избранников богов, и под [Root.Monarch.GetHerHim] руководством талтоши вернули себе законное место во главе общества. Теперь, когда есть свод законов и обычаев, наш народ никогда больше не будет сбит с пути теми, кто выступает против избранных!"
 ZZZ_enhanced_religion.10.a:3 "Мы следуем за талтошами!"
 ZZZ_enhanced_religion.10.aa:3 "Мы следуем за талтошами!"
 ZZZ_enhanced_religion.10.b:3 "Талтошам не нужны были новые законы!"
 ZZZ_enhanced_religion.10.c:3 "Проклятые язычники!"
 ZZZ_enhanced_religion.11.desc:3 "Обрушиваясь с суровостью метели, древняя религия турумистов возродилась. Под бдительной опекой [From.Monarch.GetName] религия была преобразована в официальную турумистскую церковь во главе с архижрецом, которого избирают шаманы, отныне обязанные получать помазание и одобрение официальной церкви."
 ZZZ_enhanced_religion.11.a:3 "Задул новый ветер!"
 ZZZ_enhanced_religion.11.aa:3 "Задул новый ветер!"
 ZZZ_enhanced_religion.11.b:3 "Мы не пойдём за этим так называемым архижрецом!"
 ZZZ_enhanced_religion.11.c:3 "Проклятые язычники!"
 ZZZ_enhanced_fetishist.4.t:3 "Власть старейшин"
 ZZZ_enhanced_fetishist.4.d:3 "Мы встретили людей, которых поначалу приняли за своих. Однако вскоре мы поняли, что их обычаи отличаются от наших. Они были более организованны, а их шаманы, казалось, были обучены одинаково, в рамках структуры, из которой следует, что одни шаманы стоят выше других. Удивительно, но все шаманы этих людей принимают это и безоговорочно подчиняются старшим. Эти люди утверждают, что когда-то были очень похожи на нас, но открыли более великие истины о вселенной и благодаря этому смогли отразить тех, кто бросал вызов старым порядкам."
 ZZZ_enhanced_fetishist.4.a:3 "И что же это за великие истины?"
 ZZZ_enhanced_fetishist.5.t:3 "Мастера верховой езды"
 ZZZ_enhanced_fetishist.5.d:3 "Мы знали, что лошадь можно приручить и использовать для чего угодно, от доставки вестей до сражений, но не подозревали, что не знаем истинного мастерства, пока не увидели, как последователи Тенгри скачут близ [Root.Capital.GetCapitalName]. Они творили со своими лошадьми то, что нам казалось невозможным. Часть успеха своего народа они приписывают Тенгри, богу неба. Эти мастера верховой езды согласились научить нас лучше обращаться с нашими лошадьми, если мы согласимся воздавать хвалу Тенгри."
 ZZZ_enhanced_fetishist.5.a:3 "Да будет Тенгри благосклонен к нам."
 ZZZ_enhanced_fetishist.6.t:3 "Великие защитники"
 ZZZ_enhanced_fetishist.6.d:3 "Много сезонов мы слышали о народе, стойко защищавшем свои обычаи, отражавшем всех захватчиков и не внимавшем ни одному миссионеру. По слухам, ни одна держава не смогла сломить этих людей. Мы навели справки и сумели встретиться с некоторыми из этих легендарных людей. Они говорят о своей преданности богам, особенно Дивасу, который правит всеми остальными, и Пелькунасу, богу грома. Они показали нам свои обряды и ритуалы и призвали нас подражать им, чтобы и нам было даровано божественное покровительство Диваса."
 ZZZ_enhanced_fetishist.6.a:3 "Мы станем защитниками Пелькунаса."
 ZZZ_enhanced_fetishist.7.t:3 "Охотники"
 ZZZ_enhanced_fetishist.7.d:3 "В [Root.Capital.GetCapitalName] прибыла группа охотников, но это не обычные охотники. Они носят странные одежды и говорят на странном языке. С помощью переводчиков нам удалось выяснить, что эти охотники пришли сюда со священной экспедицией. Их народ верит, что у каждого животного есть эму - прародительница, которой нужно молиться во время охоты. Чтобы умилостивить эму, эти охотники странствуют в поисках имён новых эмму, которые не водятся на их родине и потому им неизвестны. Они умоляли нас помочь им добиться того, чтобы больше ни одно животное не убивали, не умилостивив прежде эмму."
 ZZZ_enhanced_fetishist.7.a:3 "Благородное дело."
 ZZZ_enhanced_fetishist.8.t:3 "Трёхъярусное древо"
 ZZZ_enhanced_fetishist.8.d:3 "В [Root.Capital.GetCapitalName] прибыли гости из далёкой страны. Они принесли с собой любопытную мысль: мир покоится на дереве, а именно в его середине. В верхних ветвях этого огромного «мирового древа» находятся небесные тела. Мы, люди, обитаем среди средних ветвей и ствола, а внизу, в корнях, находится подземный мир, куда уходят мёртвые. Гости весьма настойчиво отстаивали эту мысль и временами требовали, чтобы и мы признали мировое древо и место человека на нём."
 ZZZ_enhanced_fetishist.8.a:3 "Значит, мы находимся в центре?"
 ZZZ_enhanced_fetishist.9.t:3 "Зун Законодатель"
 ZZZ_enhanced_fetishist.9.d:3 "Мы встретили людей, поклоняющихся солнцу, которое они называют богом Зуном. Зун - законодатель и судья всех. Люди должны стремиться быть справедливыми и добрыми, чтобы соответствовать ожиданиям Зуна. Тех, кто совершает тяжкие преступления, могут передать на суд самому Зуну, оставив их одних в пустыне без еды и воды на неделю. Если по истечении этого срока человека находят живым, считается, что Зун признал его достойным исправления. Говорят, что никто из выживших не вернулся прежним. Их настойчивое стремление к правосудию и справедливости нашло отклик у многих наших людей."
 ZZZ_enhanced_fetishist.9.a:3 "Хвала солнцу!"
 ZZZ_enhanced_fetishist.10.t:3 "Божественное присутствие"
 ZZZ_enhanced_fetishist.10.d:3 "Недавно нас посетили чужаки из далёкой страны и принесли свои верования. Они утверждают, что для достижения истинного счастья нужно посвятить жизнь молитве, усердию и благочестию. С их помощью можно многое, в том числе изгонять демонов. Эти чужаки также говорят, что в домах нужно ставить дополнительные сиденья для богов-покровителей. Уже поступают сообщения о том, что в домах близ тех мест, где побывали чужаки, появляются лишние стулья."
 ZZZ_enhanced_fetishist.10.a:3 "Нужно изучить это подробнее."
 ZZZ_enhanced_fetishist.11.t:3 "Олимпийцы"
 ZZZ_enhanced_fetishist.11.d:3 "Странствующие учёные прибыли ко двору [Root.Monarch.GetName]. Они проводят дни в спорах со всеми подряд, и нередко эти споры ходят по кругу и заканчиваются тем, что собеседник учёного начинает отстаивать то, против чего выступал всего час назад. Эти учёные называют себя почётными потомками давней традиции, начавшейся столетия назад в небольшом месте под названием «Глиз». У них уже есть преданные последователи, которые начали подражать им в стиле и одежде, а многие даже присоединились к их религиозным обрядам, состоящим в принесении жертв множеству богов, которые, как считается, живут на огромной далёкой горе под названием «Олимп»."
 ZZZ_enhanced_fetishist.11.a:3 "Неисследованная жизнь не стоит того, чтобы жить."
 ZZZ_enhanced_fetishist.900.t:0 "Мореплаватели"
 ZZZ_enhanced_fetishist.900.d:0 "Недавно на наших берегах высадились мореплаватели из далёкой страны. Они называют себя исследователями из великого города «Кар'Хатадж» и возносят благодарность богине по имени Танит, чьи благословения, по их словам, помогли им пережить опасное путешествие по высоким и бурным морям. Очарованные рассказами этих экзотических моряков, многие из наших людей начали строить святилища и тофеты Танит и её супругу Баалу здесь, в [Root.Capital.GetCapitalName], надеясь на защиту в собственных дальних путешествиях. Несмотря на слухи о детских жертвоприношениях, культ Танит продолжает распространяться."
 ZZZ_enhanced_fetishist.900.a:0 "Мы не должны допустить разрушения [Root.Capital.GetCapitalName]."
 ZZZ_enhanced_fetishist.901.t:0 "Земля фараонов"
 ZZZ_enhanced_fetishist.901.d:0 "К нам прибыли купцы из страны под названием «Кемет». Они рассказывают о огромных гробницах-пирамидах, божественных царях, богах с головами животных и несметных богатствах, превосходящих самые смелые мечты. Услышав об этом, многие в нашей стране начали возводить святилища Ра, Анубису, Сехмет, Осирису и многим другим из этих чужих богов, надеясь на благословение, подобное тому, что получили жители Нила. Другие начали готовиться к загробной жизни, копя средства на мумификацию, а некоторые даже предложили провозгласить [Root.Monarch.GetName] фараоном, представителем Ра, чтобы обеспечить себе божественное руководство."
 ZZZ_enhanced_fetishist.901.a:0 "Да встанут боги между нами и бедой."
 ZZZ_enhanced_fetishist.902.t:0 "Друиды"
 ZZZ_enhanced_fetishist.902.d:0 "Изгнанные с родины загадочные шаманы, называющие себя «друидами», прибыли в [Root.Capital.GetCapitalName]. Их тайные обряды окутаны секретностью, и многие наши подданные захотели узнать о них больше. Те, кто искал встречи с ними, возвращаются с рассказами о странных богах, а друиды дают советы нашему двору в законотворчестве. Некоторые из наших ближайших советников призывают нас узаконить этот институт, чтобы мы могли в полной мере воспользоваться предлагаемой нам мудростью."
 ZZZ_enhanced_fetishist.902.a:0 "Мы должны обдумать их мудрость."
 ZZZ_enhanced_fetishist.903.t:0 "Аджививики"
 ZZZ_enhanced_fetishist.903.d:0 "Из далёких восточных земель прибыла группа мудрецов, принёсшая свои верования. Они утверждают, что свободной воли нет и всё было предопределено при сотворении мира: ни боги, которым мы поклоняемся, ни моральные добродетели не спасут нас от неизбежной судьбы. Многие наши жрецы осуждали их за отсутствие нравственности, но, несмотря на критику жрецов, многие в нашей стране обрели утешение в знании, что их участь решена и они свободны от бремени кармы и дхармы, и потянулись к аджививикам по пути нияти."
 ZZZ_enhanced_fetishist.903.a:0 "Раз так предопределено, мы должны задуматься о мудрости нияти."
 ZZZ_enhanced_fetishist.12.t:3 "Другие"
 ZZZ_enhanced_fetishist.12.d:3 "По мере того как мы узнавали мир, мы поняли, что существует множество народов, похожих на нас, пусть и не точных наших отражений. У них свои ритуалы, боги и верования. Во время общения с ними неизбежно происходил обмен культурой. Сегодня нередко можно увидеть, как местные семьи приносят жертву богу, известному главным образом в земле, до которой нужно добираться месяцами, а то и годами."
 ZZZ_enhanced_fetishist.12.a:3 "Мы больше похожи, чем различны."
 ZZZ_enhanced_fetishist.39.aa:3 "Пока они следуют истинным традициям."
 ZZZ_enhanced_fetishist.39.aa.tt:3 "Большое число самаритянских иммигрантов поселяется в провинции [Root.GetName]."
 ZZZ_enhanced_fetishist.39.ab:3 "Пока они истинно верующие."
 ZZZ_enhanced_fetishist.39.ab.tt:3 "Большое число караимских иммигрантов поселяется в провинции [Root.GetName]."
 ZZZ_enhanced_fetishist.39.ac:3 "Пока они знают истину."
 ZZZ_enhanced_fetishist.39.ac.tt:3 "Большое число иммигрантов религии «[jewish_immigrants_origin.Religion]» поселяется в провинции [Root.GetName]."
 ZZZ_enhanced_fetishist.49.aa:3 "Пока они признают Маздака."
 ZZZ_enhanced_fetishist.49.ab:3 "Пока они следуют верным путём."
 ZZZ_enhanced_fetishist.49.ac:3 "Пока они знают истину."
 ZZZ_enhanced_fetishist.51.t:3 "Шаманы одобряют иерархию"
 ZZZ_enhanced_fetishist.51.d:3 "Похоже, наши попытки выстроить из шаманов жизнеспособную иерархию увенчались успехом. Большинству шаманов нравится новый порядок, поскольку он стандартизирует их обряды, и теперь они могут ездить куда угодно, не опасаясь оскорбить местных жителей. Кроме того, многие находят иерархическую структуру обнадёживающей, так как она не оставляет вопросов о том, чья власть выше в спорных случаях. В целом это значительно повысило довольство не только шаманов, но и нашего народа."
 ZZZ_enhanced_fetishist.51.a:3 "Превосходно!"
 ZZZ_enhanced_fetishist.52.t:3 "Шаманы не одобряют иерархию"
 ZZZ_enhanced_fetishist.52.d:3 "Похоже, наши попытки выстроить из шаманов жизнеспособную иерархию обернулись катастрофой. Привыкшие к почти полной власти на своей территории, многие шаманы тяготятся тем, что называют «чрезмерно сковывающей системой». Бесчисленны случаи, когда шаманы просто игнорировали своих мнимых начальников и действовали по своему усмотрению. Эти недовольные шаманы также использовали своё влияние на людей, чтобы чернить [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 ZZZ_enhanced_fetishist.52.a:3 "Разве иерархия не должна была положить конец этому безобразию?"
 ZZZ_enhanced_fetishist.53.t:3 "Почитание предков"
 ZZZ_enhanced_fetishist.53.d:3 "Наш народ всегда чтил тех, кто жил до нас, и знает, что они по-прежнему наблюдают за нами, направляя тех, кто ищет их помощи. Чтобы почтить наших любимых предков, [From.Monarch.GetTitle] [From.Monarch.GetName] провёл большую церемонию в их честь. На ней присутствовали тысячи людей, и она прошла лучше, чем ожидалось. Более того, урожай в этом году необычайно хорош, и многие приписывают это благоволению предков."
 ZZZ_enhanced_fetishist.53.a:3 "Пусть они и впредь охраняют нас."
 ZZZ_enhanced_fetishist.54.t:3 "Призывы к реформам"
 ZZZ_enhanced_fetishist.54.d:3 "Многие наши подданные в [Root.GetName] узнали о реформах, предложенных, якобы, для того, чтобы привести нас в новую эпоху. Вместо того чтобы отшатнуться от этих радикальных перемен, жители [Root.GetCapitalName] с жаром подхватили эту идею, и несколько ключевых фигур выступили в поддержку реформ. Если мы хотим положить этому конец, действовать нужно скорее рано, чем поздно."
 ZZZ_enhanced_fetishist.54.a:3 "Реформы могут быть полезны."
 ZZZ_enhanced_fetishist.54.b:3 "Задушим это в зародыше."
 ZZZ_enhanced_fetishist.55.t:3 "Жертвы для Диваса"
 ZZZ_enhanced_fetishist.55.d:3 "В последнее время в [Root.GetName] дела идут не лучшим образом. Урожай скуден, а несколько видных торговых компаний потерпели неожиданные неудачи. Пока это ещё не кризис, но народ требует от нас каких-то действий. Широко распространено требование, чтобы правительство принесло богатую жертву Дивасу, главе богов. Стоит ли рискнуть вызвать гнев Диваса?"
 ZZZ_enhanced_fetishist.55.a:3 "Попробовать стоит."
 ZZZ_enhanced_fetishist.55.b:3 "Пустая трата времени и денег."
 ZZZ_enhanced_fetishist.56.t:3 "Жертва принята"
 ZZZ_enhanced_fetishist.56.d:3 "С тех пор как мы принесли жертву Дивасу, дела идут исключительно хорошо. Скудный урожай забыт на фоне великолепного, который мы только что собрали, а торговые компании не только возместили убытки, но и получили прибыль. На волне патриотизма к нашим вербовщикам хлынул поток новобранцев, жаждущих отплатить за удачу службой. Похоже, Дивас благосклонно принял наши дары и вознаградил нас."
 ZZZ_enhanced_fetishist.56.a:3 "Слава Дивасу!"
 ZZZ_enhanced_fetishist.57.t:3 "Жертва отвергнута"
 ZZZ_enhanced_fetishist.57.d:3 "Похоже, Дивас не взглянул благосклонно на нашу жертву. Урожаи по-прежнему скудны, а несколько прежде богатых торговых компаний полностью разорились. Народ не простил нам эти беды."
 ZZZ_enhanced_fetishist.57.a:3 "Может, надо было принести в жертву коров, а не коз..."
 ZZZ_enhanced_fetishist.58.t:3 "Великая оборона [Root.GetName]"
 ZZZ_enhanced_fetishist.58.d:3 "На нас напали язычники и еретики, осмелившиеся осквернить наши священные обычаи и традиции. Как гордые последователи Диваса и Пелькунаса, мы обязаны защищать [Root.GetName] до последнего человека."
 ZZZ_enhanced_fetishist.58.a:3 "Вставайте, соотечественники, и спасите [Root.GetName]!"
 ZZZ_enhanced_fetishist.59.t:3 "Ромува переселяются в [Root.GetName]"
 ZZZ_enhanced_fetishist.59.d:3 "Оказывается, небольшая община ромува в [Root.GetCapitalName], [Root.GetName], известна среди всего сообщества ромува. К нам обратилась довольно большая группа переселенцев-ромува, желающих присоединиться к своим собратьям в [Root.GetName]. В обмен на наше согласие они пообещали работать на государство, используя свои знания в области фортификации для улучшения обороноспособности провинции."
 ZZZ_enhanced_fetishist.59.a:3 "Мы приветствуем наших братьев и сестёр ромува!"
 ZZZ_enhanced_fetishist.59.b:3 "Нам не нужны такие, как они."
 ZZZ_enhanced_fetishist.60.t:3 "Неуправляемое браконьерство"
 ZZZ_enhanced_fetishist.60.desc:3 "В последнее время [Root.GetName] стала прибежищем для браконьеров и охотников на дичь. Эти люди убивают не ради пропитания, а лишь ради наживы или забавы. Огромное количество мяса, которым можно было бы накормить целые деревни, пропало зря, и люди всё сильнее недовольны продолжающимся бездействием местных властей. Если мы ничего не предпримем, мы рискуем разгневать эмму - духов-прародительниц животных и нашего собственного народа."
 ZZZ_enhanced_fetishist.60.a:3 "Послать армию, чтобы вычистить их."
 ZZZ_enhanced_fetishist.60.b:3 "Местным властям просто нужно «напомнить» об их обязанностях."
 ZZZ_enhanced_fetishist.60.c:3 "Кстати, мне нужна новая статуэтка из слоновой кости."
 ZZZ_enhanced_fetishist.60.d:3 "Так как же мне в этом поучаствовать?"
 ZZZ_enhanced_fetishist.61.t:3 "Бум популяции животных в [Root.GetName]"
 ZZZ_enhanced_fetishist.61.d:3 "В течение последних нескольких лет в [Root.GetName] наблюдается почти беспрецедентный рост числа животных. Многие считают это благодарностью эмму за то, что мы некоторое время назад избавили [From.GetName] от браконьеров. Какова бы ни была причина, огромный всплеск дал местному населению дополнительное мясо, а больше животных означает больше продуктов животного происхождения. Прибыльных продуктов."
 ZZZ_enhanced_fetishist.61.a:3 "Эмму почтили нас."
 ZZZ_enhanced_fetishist.62.t:3 "Браконьерство распространяется"
 ZZZ_enhanced_fetishist.62.desc:3 "Полагая, что всплеск браконьерства будет временным, мы решили не принимать против браконьеров никаких серьёзных мер. Однако это поветрие, похоже, не затихает: оно перекинулось на [Root.GetName], и теперь там тоже эпидемия браконьерства. Не пора ли нам наконец твёрдо заявить о себе?"
 ZZZ_enhanced_fetishist.62.a:3 "С меня хватит, шлите армию."
 ZZZ_enhanced_fetishist.62.b:3 "*Вздох*... Во что это нам обойдётся?"
 ZZZ_enhanced_fetishist.62.c:3 "Убить их всех до единого."
 ZZZ_enhanced_fetishist.62.d:3 "То есть вы говорите, что львиные головы снова в продаже?"
 ZZZ_enhanced_fetishist.62.e:3 "Или мы можем воспользоваться очевидным спросом."
 ZZZ_enhanced_fetishist.63.t:3 "Охота [Root.Heir.GetTitle] [Root.Heir.GetName]"
 ZZZ_enhanced_fetishist.63.desc:3 "Недавно [Root.Heir.GetTitle] [Root.Heir.GetName], наследник [Root.GetName], решил отправиться на большую охоту со своей свитой. Экспедиция [Root.Heir.GetTitle] чуть не закончилась бедой: [Root.Heir.GetName], преследуя добычу, оторвался от остальных и оказался на лесной поляне. В одиночестве [Root.Heir.GetName] внезапно столкнулся со львом, отдыхавшим неподалёку. Быстро сообразив, [Root.Heir.GetName]..."
 ZZZ_enhanced_fetishist.63.a:3 "Воспользовался оружием, которое [Root.Heir.GetSheHe] держал под рукой."
 ZZZ_enhanced_fetishist.63.b:3 "Использовал [Root.Heir.GetHerHis] лошадь как приманку, чтобы выиграть время и сразиться со львом."
 ZZZ_enhanced_fetishist.63.c:3 "Обнажил [Root.Heir.GetHerHis] меч и встретил его лицом к лицу."
 ZZZ_enhanced_fetishist.63.d:3 "Лично поборол льва и взял его себе как питомца."
 ZZZ_enhanced_fetishist.64.t:3 "Смерть королевского льва"
 ZZZ_enhanced_fetishist.64.d:3 "Королевский питомец-лев, когда-то усмирённый в схватке и привезённый домой как трофей, наконец умер от старости. Королевская семья скорбит об утрате необычного питомца и друга, и в Королевском саду была проведена торжественная церемония погребения льва."
 ZZZ_enhanced_fetishist.64.a:3 "Нам будет тебя не хватать..."
 ZZZ_enhanced_fetishist.65.t:3 "Переселение суоменуско в [Root.GetName]"
 ZZZ_enhanced_fetishist.65.d:3 "Видимо, прослышав об успехе нашей общины суоменуско в окрестностях [Root.GetCapitalName] в [Root.GetName], группа странников-суоменуско обратилась к нам с просьбой разрешить им поселиться в провинции [Root.GetName]. Они обещают усердно трудиться на благо нашей державы и подчиняться нашим законам."
 ZZZ_enhanced_fetishist.65.a:3 "Мы приветствуем нашу суоменуско-семью дома."
 ZZZ_enhanced_fetishist.65.b:3 "Нет-нет, пожалуй, не стоит."
 ZZZ_enhanced_fetishist.66.t:3 "Славянский танец"
 ZZZ_enhanced_fetishist.66.d:3 "Принятие славянских обычаев привело к весьма необычному и неожиданному результату. Танцы, популярные в славянских землях, стали невероятно модными и у нас, особенно среди знати и состоятельных людей. Из-за этого придворные нашего двора стали весьма востребованы не только при малых дворах нашей собственной страны, но и при дворах соседних держав. Мы смогли воспользоваться этой возможностью, чтобы завести связи и разузнать важные сведения через наш двор."
 ZZZ_enhanced_fetishist.66.a:3 "Да продолжится танец!"
 ZZZ_enhanced_fetishist.67.t:3 "Забытый праздник"
 ZZZ_enhanced_fetishist.67.d:3 "Как это случилось, мы не знаем. [Root.Ruler.GetTitle] [Root.Ruler.GetName] ясно отметил праздник в официальном королевском календаре, были проведены предварительные приготовления и составлены списки гостей. И всё же каким-то образом о нём забыли, и священный день прошёл без единого официального мероприятия со стороны правительства. Возможно, в другое время это не было бы такой проблемой, но недавно славянская делегация обвинила наше правительство в том, что оно лишь поверхностно следует их вере и не ценит их священные обряды и ритуалы. Теперь, когда [Root.Monarch.GetTitle] [Root.Monarch.GetName] забыл об этом событии, обвинения делегации выглядят обоснованными."
 ZZZ_enhanced_fetishist.67.a:3 "Это всего лишь день..."
 ZZZ_enhanced_fetishist.67.b:3 "Чепуха, нам просто нужно было больше времени на подготовку."
 ZZZ_enhanced_fetishist.68.t:3 "Славянское переселение в [Root.GetName]"
 ZZZ_enhanced_fetishist.68.d:3 "К нам недавно обратилась большая группа славянских верующих-переселенцев, желающих обосноваться в нашей стране навсегда. Случилось так, что в [Root.GetCapitalName], в провинции [Root.GetName], есть значительная славянская община. Мы легко могли бы расселить этих людей в [Root.GetName], а славяне, как известно, прекрасные солдаты. Стоит ли действовать?"
 ZZZ_enhanced_fetishist.68.a:3 "Мы покажем им их новый дом."
 ZZZ_enhanced_fetishist.68.b:3 "Они обратятся против нас."
 ZZZ_enhanced_fetishist.69.t:3 "Исключительные лошади"
 ZZZ_enhanced_fetishist.69.d:3 "Похоже, Тенгри благословил нас. Наш последний табун лошадей оказался исключительным: они гораздо сильнее, быстрее и выносливее обычных. Мы начали обучать их для нашей армии и остались чрезвычайно довольны - врагу не устоять!"
 ZZZ_enhanced_fetishist.69.a:3 "Хвала Тенгри!"
 ZZZ_enhanced_fetishist.70.t:3 "Слабые лошади"
 ZZZ_enhanced_fetishist.70.d:3 "Наш последний табун оказался ужасен: звери глупы даже для своего вида, да к тому же слабы. Наши шаманы предупредили, что это знак недовольства Тенгри и что мы должны внимательнее соблюдать подобающие ритуалы и жертвоприношения, необходимые для умилостивления Тенгри. Пока мы не вернём себе расположение Тенгри, нам предстоит мириться с низким качеством наших лошадей в обозримом будущем."
 ZZZ_enhanced_fetishist.70.a:3 "Кук сугор!"
 ZZZ_enhanced_fetishist.71.t:3 "Белый жеребец"
 ZZZ_enhanced_fetishist.71.d:3 "В этом месяце с [Root.Monarch.GetTitle] [Root.Monarch.GetName] приключилось нечто весьма необычное. Во время посещения местного коневода к [Root.Monarch.GetTitle] [Root.Monarch.GetName] подошёл крупный белый жеребец и без труда позволил себя оседлать. Коневод был поражён: по его словам, этот конь был неукротим с самого рождения и не подпускал к себе никого, не то что верхового. Обрадованный [Root.Monarch.GetTitle] [Root.Monarch.GetName] забрал жеребца домой и вскоре обнаружил, что тому нет равных в скорости и силе и что он позволяет ездить на себе только [Root.Monarch.GetTitle] [Root.Monarch.GetName] или [Root.Monarch.GetHerHis] семье."
 ZZZ_enhanced_fetishist.71.a:3 "Он будет зваться «Shadowfax»."
 ZZZ_enhanced_fetishist.71.b:3 "Мы назовём его «Atrax»."
 ZZZ_enhanced_fetishist.71.c:3 "Его зовут «Bree»."
 ZZZ_enhanced_fetishist.72.t:3 "[ZZZ_enhanced_white_stallion_name] умирает"
 ZZZ_enhanced_fetishist.72.d:3 "Прожив гораздо дольше любой другой известной лошади, [ZZZ_enhanced_white_stallion_name] заставил многих задуматься, не бессмертен ли он. Но увы, [ZZZ_enhanced_white_stallion_name] не был бессмертен и наконец умер в возрасте, который будущие поколения сочтут выдуманным. Он был погребён на кладбище, обычно предназначенном для королевской семьи, и была проведена торжественная церемония."
 ZZZ_enhanced_fetishist.72.a:3 "Мы никогда не забудем тебя, [ZZZ_enhanced_white_stallion_name]."
 ZZZ_enhanced_fetishist.73.t:3 "Переселение последователей Тенгри в [Root.GetName]"
 ZZZ_enhanced_fetishist.73.d:3 "Искусные наездники, такие же последователи Тенгри, прибыли в [Owner.Capital.GetCapitalName] и просят аудиенции у [Owner.Monarch.GetTitle] [Owner.Monarch.GetName]. Они хотят поселиться в одной из наших провинций, а именно в [Root.GetName]. В обмен на наше согласие они обещают служить нам. Позволим ли мы им переселиться?"
 ZZZ_enhanced_fetishist.73.a:3 "Мы будем скакать вместе!"
 ZZZ_enhanced_fetishist.73.b:3 "Пусть скачут в другом месте."
 ZZZ_enhanced_fetishist.74.t:3 "Суд Зуна"
 ZZZ_enhanced_fetishist.74.d:3 "Перед вами бросают на колени человека, и вы чувствуете, как жар гнева разливается по телу, пока вам зачитывают обвинения. Этот человек - влиятельный торговец, частый гость при вашем дворе и вкладчик в государственные дела. Нет сомнений, что он должен предстать перед судом Зуна, но его вклад так полезен, и без него мы наверняка потеряем часть доходов, по крайней мере в краткосрочной перспективе."
 ZZZ_enhanced_fetishist.74.a:3 "Все должны предстать перед судом Зуна."
 ZZZ_enhanced_fetishist.74.b:3 "Наверняка вы ошиблись человеком?"
 ZZZ_enhanced_fetishist.74.c:3 "Мы никогда не участвовали в его махинациях."
 ZZZ_enhanced_fetishist.75.t:3 "Вернувшийся с суда"
 ZZZ_enhanced_fetishist.75.d:3 "Когда мужчину или женщину отправляют на суд Зуна, большинство ожидает, что этого человека больше никогда не увидят. Зун суров, и поскольку такое наказание применяется редко, вернувшиеся встречаются ещё реже, однако теперь, похоже, у нас такой есть. Изгнанный в пустыню за убийство супруга, он сумел вернуться к нам. Но, как и большинство вернувшихся, он вернулся не прежним. Говорят, его характер полностью изменился, но в своём деле он стал необычайно хорош. Он предложил свои услуги нашему двору в качестве:"
 ZZZ_enhanced_fetishist.75.a:3 "казначея."
 ZZZ_enhanced_fetishist.75.b:3 "торговца."
 ZZZ_enhanced_fetishist.75.c:3 "мастера по вербовке."
 ZZZ_enhanced_fetishist.76.t:3 "Наследник предстаёт перед судом"
 ZZZ_enhanced_fetishist.76.d:3 "Мы не могли поверить в услышанное: нашего любимого наследника [Root.Heir.GetTitle] [Root.Heir.GetName] обвиняют в убийстве. По-видимому, [Root.Heir.GetSheHe] пил в таверне, и когда крестьянин отказался уступить своё место, [Root.Heir.GetTitle] [Root.Heir.GetName] в пьяной ярости убил его. Хотя теперь [Root.Heir.GetSheHe] глубоко сожалеет о содеянном, это видело множество свидетелей, и как земной представитель Зуна Законодателя мы обязаны назначить надлежащее наказание независимо от положения. За это преступление [Root.Heir.GetTitle] [Root.Heir.GetName] должен предстать перед судом Зуна: быть отведённым в пустыню без еды и воды и оставленным там, чтобы посмотреть, выживет ли он."
 ZZZ_enhanced_fetishist.76.a:3 "[Root.Heir.GetName], как ты мог?"
 ZZZ_enhanced_fetishist.76.b:3 "Не вижу здесь никакой проблемы."
 ZZZ_enhanced_fetishist.77.t:3 "Наследник возвращается"
 ZZZ_enhanced_fetishist.77.d:3 "К удивлению многих, [Root.Heir.GetTitle] [Root.Heir.GetName] пережил [Root.Heir.GetHerHis] суд. [Root.Heir.GetSheHe] вошёл в [Root.Capital.GetCapitalName] едва живой и рухнул, как только к нему подошли, но это, без сомнения, [Root.Heir.GetTitle] [Root.Heir.GetName]. Однако [Root.Heir.GetSheHe] изменился: как и большинство прошедших суд Зуна, [Root.Heir.GetTitle] [Root.Heir.GetName] вернулся другим человеком. Как бы то ни было, весть о том, что [Root.Heir.GetTitle] [Root.Heir.GetName] выжил, разнеслась по [Root.GetName] как лесной пожар, и народ теперь видит в [Root.Heir.GetTitle] [Root.Heir.GetName] помазанника самого Зуна."
 ZZZ_enhanced_fetishist.77.a:3 "[Root.Heir.GetTitle] [Root.Heir.GetName] возвращается!"
 ZZZ_enhanced_fetishist.78.t:3 "Переселение последователей Зуна в [Root.GetName]"
 ZZZ_enhanced_fetishist.78.d:3 "К нам обратились единоверцы, последователи Зуна, хотя они родом из далёкой страны. Прослышав о нашей преданности Зуну, они пришли просить убежища от язычников. В [Root.GetName] у нас уже есть значительная община последователей Зуна. Позволим ли мы этим людям поселиться там?"
 ZZZ_enhanced_fetishist.78.a:3 "Зун любит всех нас одинаково."
 ZZZ_enhanced_fetishist.78.b:3 "Мы не считаем их достойными."
 ZZZ_enhanced_fetishist.79.t:3 "Великий храм"
 ZZZ_enhanced_fetishist.79.d:3 "Мы усердно поклоняемся древним богам, следя за тем, чтобы они получали должные почести и жертвы. Но нас не оставляет чувство, что чего-то не хватает. Мы обратились к тем, кто жил до нас, и поняли, чего нам недоставало. У нас нет подобающего храма богов, во всяком случае такого, который можно было бы сравнить с храмами древних. Это нужно исправить немедленно: это будет долгий и дорогостоящий процесс, но сделать это необходимо."
 ZZZ_enhanced_fetishist.79.a:3 "Немедленно начать строительство!"
 ZZZ_enhanced_fetishist.79.a.tt:3 "§RВНИМАНИЕ: СОБОР ДОЛЖЕН НАХОДИТЬСЯ В ПРОВИНЦИИ, ЧТОБЫ ОНА ПОЛУЧИЛА СЛЕДУЮЩИЙ МОДИФИКАТОР!§!\nПосле завершения Великого храма §Y[Root.GetName]§! получит:\n"
 ZZZ_enhanced_fetishist.79.b:3 "По зрелом размышлении, нам это не по карману."
 ZZZ_enhanced_fetishist.81.t:3 "Проект Великого храма отменён"
 ZZZ_enhanced_fetishist.81.d:3 "К сожалению, по той или иной причине было решено не строить Великий храм, даже после всех затрат на него."
 ZZZ_enhanced_fetishist.81.a:3 "Жаль."
 ZZZ_enhanced_fetishist.82.t:3 "Великий храм завершён"
 ZZZ_enhanced_fetishist.82.d:3 "Потребовалось очень много времени и огромное количество денег, но Великий храм построен, и он прекрасен, он соперничает с Парфеноном и Пантеоном. Несомненно, боги довольны!"
 ZZZ_enhanced_fetishist.82.a:3 "Хвала богам!"
 ZZZ_enhanced_fetishist.83.t:3 "Проект Великого храма провалился"
 ZZZ_enhanced_fetishist.83.d:3 "К несчастью, мы потеряли контроль над городом, в котором строился Великий храм, и вместе с ним рухнули наши великие мечты."
 ZZZ_enhanced_fetishist.83.a:3 "А время и деньги, о боги..."
 ZZZ_enhanced_fetishist.84.t:3 "Гаруспиция"
 ZZZ_enhanced_fetishist.84.d:3 "Время от времени следует просить богов о благосклонности. Для этого нужно принести в жертву животное, а обученный знаток, обычно шаман, должен прочесть кости и внутренности животных. Так можно определить расположение богов. Боги обычно предпочитают более крупные жертвы, но это не значит, что они обязательно дурно взглянут на жертву поменьше. Что нам принести в жертву для гаруспиции в этом году?"
 ZZZ_enhanced_fetishist.84.a:3 "Нескольких птиц."
 ZZZ_enhanced_fetishist.84.b:3 "Нескольких коз."
 ZZZ_enhanced_fetishist.84.c:3 "Нескольких овец."
 ZZZ_enhanced_fetishist.84.d:3 "Нескольких быков."
 ZZZ_enhanced_fetishist.85.t:3 "Знамения прочитаны"
 ZZZ_enhanced_fetishist.85.d1:3 "Шаман, ответственный за чтение знамений, дрожал, когда докладывал из храма. Нервничая, он сообщил, что знамения нельзя истолковать иначе: боги недовольны, и мы лишились их благосклонности. Похоже, нас ждут тёмные времена."
 ZZZ_enhanced_fetishist.85.d2:3 "Шаман, ответственный за чтение знамений, выглядел довольным, докладывая из храма. Знамения добрые, и боги улыбаются нам. Похоже, наши начинания увенчаются успехом."
 ZZZ_enhanced_fetishist.85.d3:3 "Шаман, ответственный за чтение знамений, почти бежал из храма с докладом. Знамения были не просто добрыми, они были великолепными! «Боги заверили меня в нашем грядущем успехе!» - сказал шаман с широкой улыбкой."
 ZZZ_enhanced_fetishist.85.d4:3 "Казалось, весь храм опустел, когда толпа людей хлынула ко дворцу. К счастью, с невероятной новостью: знамения не могли быть лучше. «Об успехе даже вопроса нет, господин!» - сказал один запыхавшийся шаман, а остальные кивали в знак согласия."
 ZZZ_enhanced_fetishist.85.a:3 "Мы покинуты..."
 ZZZ_enhanced_fetishist.85.b:3 "Боги явили нам свою милость!"
 ZZZ_enhanced_fetishist.86.t:3 "Эллинское переселение в [Root.GetName]"
 ZZZ_enhanced_fetishist.86.d:3 "Нас посетил человек, представляющий группу эллинских верующих, бежавших от преследований в другой стране. Они надеются найти убежище в нашей, так как слышали, что и мы поклоняемся их пантеону богов. Мы могли бы поселить их в [Root.GetName], если пожелаем."
 ZZZ_enhanced_fetishist.86.a:3 "Конечно, они желанные гости!"
 ZZZ_enhanced_fetishist.86.b:3 "Для них у нас нет места."
 ZZZ_enhanced_fetishist.92.t:3 "Четвёртый путь"
 ZZZ_enhanced_fetishist.92.d:3 "Нас учили следовать Благородному пути, чтобы успешно перерождаться. Четвёртый путь, «Самьяк Карман», или Правильное действие, гласит, что нельзя предаваться чувственному разврату, брать то, что не принадлежит нам, причинять вред или убивать. Во многом Самьяк Карман сделал нашу державу стабильной и процветающей, но у него есть и недостатки. Чтобы не прогневить богов, монахи в провинции [no_killing_province.GetName] призывают наших подданных не вступать в армию. Поначалу их влияние было ничтожным, однако со временем слух распространился, и мы начинаем ощущать последствия."
 ZZZ_enhanced_fetishist.92.a:3 "Верность Благородному пути - достойное дело."
 ZZZ_enhanced_fetishist.92.a.tt:3 "Позволить людям, желающим следовать Благородному пути, не служить в армии."
 ZZZ_enhanced_fetishist.92.b:3 "Их долг перед нашей державой выше долга перед богами!"
 ZZZ_enhanced_fetishist.92.b.tt:3 "Принудить дезертиров вступить в армию. Они вместе со своими родичами, вероятно, окажут сопротивление."
 ZZZ_enhanced_fetishist.93.t:3 "Дух щедрости"
 ZZZ_enhanced_fetishist.93.d:3 "Чтобы расти как люди и приближаться к духовному освобождению, мы должны накапливать заслуги. Согласно нашему учению, мы делаем это через молитву, усердие и благочестие, а накопленные заслуги переходят в наши будущие воплощения. Высший признак доброго сердца - добровольная передача заслуг другим. Это доказывает, что мы совершаем молитву, усердие и благочестие не только ради собственной пользы, но и ради блага всех остальных.\n\nНаш великий правитель, [Root.Monarch.GetTitle] [Root.Monarch.GetName], устроил великую церемонию у семейного святилища рода [Root.Monarch.Dynasty.GetName]. В конце [Root.Monarch.GetSheHe] передаст заслуги, накопленные во время обряда. Кому [Root.Monarch.GetSheHe] их посвятит?"
 ZZZ_enhanced_fetishist.93.a:3 "[Root.Monarch.GetHerHisCap] предкам, чтобы облегчить их страдания в следующей жизни."
 ZZZ_enhanced_fetishist.93.a.tt:3 "Все будут помнить о великом происхождении [Root.Monarch.GetTitle] §Y[Root.Monarch.GetName]§!."
 ZZZ_enhanced_fetishist.93.b:3 "Всем живым существам, ради всеобщего блага."
 ZZZ_enhanced_fetishist.93.b.tt:3 "Все будут тронуты скромной и щедрой натурой [Root.Monarch.GetTitle] §Y[Root.Monarch.GetName]§!."
 ZZZ_enhanced_fetishist.94.t:3 "Благословенный муж"
 ZZZ_enhanced_fetishist.94.d:3 "До нас дошли рассказы о человеке низкого происхождения, обладающем умиротворяющим присутствием и даром слова, при этом, по-видимому, мудром в философии. Его соплеменники относятся к нему с величайшим почтением, словно к обученному шаману. Как ни странно, этот человек чуждается мирских благ и просит лишь о возможности проповедовать свои прозрения другим. Более того, он стал своего рода местной достопримечательностью: люди обращаются к нему за помощью во всевозможных делах, от сердечных до земледельческих и гражданских. Некоторые из знати утверждают, что со дня на день он начнёт брать деньги за свои советы, другие же считают, что ему явно предназначено нечто иное, чем провести остаток жизни в медитациях в местном храме."
 ZZZ_enhanced_fetishist.94.a:3 "Сделать его нашим доверенным советником."
 ZZZ_enhanced_fetishist.94.b:3 "Пусть остаётся в своём деревенском храме."
 ZZZ_enhanced_fetishist.95.t:3 "Священное писание"
 ZZZ_enhanced_fetishist.95.d:3 "[bon_neighbor.GetName] прислала нам гневное письмо, сообщая о беспокойном [Root.GetAdjective] монахе, торгующем книгами в её пределах и выдающем их за священные тексты. Мало того, что это очевидная подделка, так ещё и в тексте есть несколько ошибок относительно мировоззрения религии бон, а власти [bon_neighbor.GetName] обвиняют нас в попытке разжечь религиозные беспорядки на их улицах. Можно возразить, что монах просто пытался исследовать собственную философию, но, учитывая популярность его сочинений в [bon_neighbor.GetName], разумно предположить, что этот монах действительно шарлатан, использующий нашу веру ради денег...\n\nУщерб уже нанесён, и всё, что нам остаётся, - отправить войска, чтобы найти монаха и выдворить его из страны [bon_neighbor.GetName]."
 ZZZ_enhanced_fetishist.95.a:3 "Что ж, так и есть."
 ZZZ_enhanced_fetishist.96.t:3 "Переселение последователей бон в [Root.GetName]"
 ZZZ_enhanced_fetishist.96.d:3 "Остановлен караван переселенцев, направлявшийся в [Root.GetName], где группа верующих бон планировала поселиться. По-видимому, им продали поддельные документы на землю в [Root.GetName], и они думали, что их ждут в провинции. Так уж вышло, что в [Root.GetName] достаточно места, и при желании мы легко могли бы принять переселенцев."
 ZZZ_enhanced_fetishist.96.a:3 "Было бы жестоко прогонять их сейчас."
 ZZZ_enhanced_fetishist.96.b:3 "Нас не касается, что их обманули."
 ZZZ_enhanced_fetishist.97.t:3 "Иллюзия реальности"
 ZZZ_enhanced_fetishist.97.d:3 "Проповедники, недавно достигшие нашего народа, не похожи на тех, что мы видели прежде. Они говорят о мире, в котором мы живём, не как о благословении, а как о проклятии, наложенном на нас тем, кого они называют «Демиургом». Они говорят, что истинное просветление и спасение можно найти лишь за пределами материального мира, в котором мы существуем."
 ZZZ_enhanced_fetishist.97.a:3 "Божественное начало будет нашим!"
 ZZZ_enhanced_fetishist.98.t:3 "Павлин-ангел"
 ZZZ_enhanced_fetishist.98.d:3 "Небольшая группа кочевников недавно поселилась на нашей земле. Они принесли с собой своеобразные традиции и ещё более своеобразную религию. Они утверждают, что следуют первейшему из ангелов единого Бога, который владычествует над Землёй. Попытки узнать больше неожиданно были отвергнуты: похоже, эти люди не похожи на других верующих."
 ZZZ_enhanced_fetishist.98.a:3 "Как бы то ни было, мы тоже последуем за Мелек-Таусом!"
 ZZZ_enhanced_fetishist.99.t:3 "Обвинения в сатанизме"
 ZZZ_enhanced_fetishist.99.d:3 "Хотя мы следуем пути ностиков, в нашем [Root.GovernmentName] есть те, кто вместо этого следует христианству. Обычно это не создаёт проблем, более того, мы бы сказали, что наше сходство перевешивает различия. Однако группа пламенных христианских лидеров распространяет скандальный слух, будто наши обычаи - сатанизм, а мы поклоняемся тёмным силам. Это вызвало недовольство среди нашего народа. Как нам ответить?"
 ZZZ_enhanced_fetishist.99.a:3 "Начать собственную пропагандистскую кампанию."
 ZZZ_enhanced_fetishist.99.b:3 "Убрать смутьянов навсегда."
 ZZZ_enhanced_fetishist.99.c:3 "Не стоит отвечать пустозвонам."
 ZZZ_enhanced_fetishist.99.d:3 "Показать им истину на собственном примере."
 ZZZ_enhanced_fetishist.100.t:3 "Всеобщая терпимость"
 ZZZ_enhanced_fetishist.100.d:3 "Наша проповедь терпимости среди масс увенчалась большим успехом, чем обычно. Мы ясно дали понять, что происходящее в материальном мире не имеет истинного значения по сравнению с происходящим в духовном. Поэтому не следует слишком беспокоиться о том, во что верят или что делают другие. По крайней мере пока народ, похоже, поступит так, как мы ему сказали."
 ZZZ_enhanced_fetishist.100.a:3 "Любите ближних своих."
 ZZZ_enhanced_fetishist.101.t:3 "Непоколебимая решимость"
 ZZZ_enhanced_fetishist.101.d:3 "Наш образ мыслей стал популярен среди солдат нашей армии. Это имело непреднамеренный, хотя и положительный эффект: он наполнил их сильным фатализмом. Зная, что материальный мир - злое место, полное одной лишь боли, они не боятся ни смерти, ни вечности. Наши офицеры начали использовать эту новообретённую силу, но не могут решить, стоит ли сосредоточиться на общем боевом духе войск или воспользоваться случаем, чтобы усилить дисциплину."
 ZZZ_enhanced_fetishist.101.a:3 "Наши люди не дрогнут."
 ZZZ_enhanced_fetishist.101.b:3 "Наши люди будут действовать слаженно."
 ZZZ_enhanced_fetishist.101.c:3 "Мы должны суметь добиться и того, и другого."
 ZZZ_enhanced_fetishist.102.t:3 "Религия «[gnostic_missionary_origin.Religion]» распространяется в [Root.GetName]"
 ZZZ_enhanced_fetishist.102.d:3 "Похоже, миссионеры из [gnostic_missionary_origin.GovernmentName] [gnostic_missionary_origin.GetName] в последнее время необычайно активны в [Root.GetName]. Увидев, что люди разделяют многие их верования, миссионеры использовали это как основу для распространения собственного толкования вселенной. Теперь можно с уверенностью сказать, что жители [Root.GetName] больше исповедуют религию «[gnostic_missionary_origin.Religion]», чем «[Root.Owner.Religion]»."
 ZZZ_enhanced_fetishist.102.a:3 "Да будет так."
 ZZZ_enhanced_fetishist.102.b:3 "Нет-нет, пожалуй, не стоит."
 ZZZ_enhanced_fetishist.103.t:3 "Традиция объединяет нас всех"
 ZZZ_enhanced_fetishist.103.d:3 "Наш упор на традицию пришёлся по душе как местным лидерам, так и простому населению. Править [Root.GetName] никогда не было так легко."
 ZZZ_enhanced_fetishist.103.a:3 "Традиция!"
 ZZZ_enhanced_fetishist.104.t:3 "Уникальные торговые возможности"
 ZZZ_enhanced_fetishist.104.d:3 "Наша вера принесла неожиданные плюсы для нашей торговой политики. Общины езидов существуют повсюду и всегда охотно торгуют с теми, кто разделяет их мировоззрение. Наши купцы превратили это предпочтение в серьёзный торговый бум за последние годы, и теперь его плоды действительно ощущаются."
 ZZZ_enhanced_fetishist.104.a:3 "Превосходно!"
 ZZZ_enhanced_fetishist.104.a:3 "Может, мы могли бы использовать своё положение иначе?"
 ZZZ_enhanced_fetishist.105.t:3 "Религиозная напряжённость"
 ZZZ_enhanced_fetishist.105.d:3 "Езиды всегда были тесно сплочённой общиной, и наше присоединение к ней не всегда приветствовалось теми, кто уже её исповедует. Многие езиды постоянно твердят, что мы не настоящие езиды и никогда ими не станем. Обычно дело ограничивается словами, однако езидские религиозные лидеры [Root.GetName] довели свой народ до исступления, заявляя, что наши якобы «ложные верования» развращают их молодёжь и будут делать это и впредь, если они не предпримут действий. Если мы не будем действовать решительно, из-за этой паники в [Root.GetName] почти наверняка вспыхнет мятеж."
 ZZZ_enhanced_fetishist.105.a:3 "Сгладить обстановку."
 ZZZ_enhanced_fetishist.105.a:3 "Мы покажем им, что такое ложные верования!"
 ZZZ_enhanced_fetishist.106.t:3 "Миграция религии «[yazidi_migrant_origin.Religion]» в [Root.GetName]"
 ZZZ_enhanced_fetishist.106.d:3 "Большая группа последователей религии «[yazidi_migrant_origin.Religion]» обратилась к [Root.Owner.GetTitle] [Root.Owner.Ruler] с просьбой переселиться в [Root.GetName], где они смогут жить в мире. Чтобы облегчить переселение и обеспечить его гладкое течение, езиды предложили на время свои услуги в нашей администрации. Поскольку несколько их членов ранее работали администраторами, было бы глупо отказываться от такой возможности, не взвесив предварительно преимущества."
 ZZZ_enhanced_fetishist.106.a:3 "Что ж, пусть заходят."
 ZZZ_enhanced_fetishist.106.a:3 "Наши собственные администраторы нас вполне устраивают, спасибо."
 ZZZ_enhanced_fetishist.19.t:0 "Культ фракийского всадника"
