l_russian:
 CK3_NAME:3 "Crusader Universalis"
 CK3_DESC:3 "Карта Европы изменилась с XI века. Честолюбивый игрок, то ли дар Божий, то ли порождение дьявола, направил дела Европы к одной цели. Но сможет ли этот честолюбивый игрок управлять развитием целой планеты ещё четыре столетия, не утратив своих сверхъестественных качеств?"
 CK3A_NAME:3 "Давным-давно"
 CK3A_DESC:3 "Долгие столетия мир оставался неизменным. Даже самые буйные поджигатели войны сидели тихо, и никто не пытался убить соседа. Но эта пора застоя, несомненно, дар дьявола, должна закончиться. Сегодня, 11 ноября 1444 года от Рождества Христова, началось Возрождение - новое движение, которое разрушит вечный статус-кво."
