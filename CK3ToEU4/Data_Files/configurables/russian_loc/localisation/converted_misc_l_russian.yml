l_russian:
 wonder_cathedral:0 "Великий собор"
 desc_wonder_cathedral:0 "Свидетельство благочестия своего строителя, этот храм устремляется в небо."
 wonder_mosque:0 "Великая мечеть"
 desc_wonder_mosque:0 "Это здание - свидетельство благочестия своего строителя."
 wonder_synagogue:0 "Великая синагога"
 desc_wonder_synagogue:0 "Каждый, кто ступит в это здание, вспомнит о ценности религиозной общины."
 wonder_temple_pagan:0 "Великий храм"
 desc_wonder_temple_pagan:0 "Говорят, что место, где стоит храм, - самая священная земля во всём государстве."
 wonder_temple_buddhist:0 "Великий храм"
 desc_wonder_temple_buddhist:0 "Говорят, что место, где стоит храм, - самая священная земля во всём государстве."
 wonder_temple_hindu:0 "Великий храм"
 desc_wonder_temple_hindu:0 "Говорят, что место, где стоит храм, - самая священная земля во всём государстве."
 wonder_statue_ruler:0 "Статуя правителя"
 desc_wonder_statue_ruler:0 "Правитель обессмертил себя в этой величественной статуе."
 wonder_statue_horse:0 "Статуя Блестящего Копыта"
 desc_wonder_statue_horse:0 "Некоторые просто не могут смириться с тем, что их лучший друг когда-нибудь покинет этот мир. Теперь им не придётся."
 wonder_fortress:0 "Великая крепость"
 desc_wonder_fortress:0 "Крепость - надёжное убежище, второй дом для многих воинов."
 wonder_underground_city:0 "Великий подземный город"
 desc_wonder_underground_city:0 "Частично высеченные в самой скале, на которой он стоит, подземные ходы тянутся так далеко, что это известно лишь их владельцу."
 wonder_wall:0 "Великие стены"
 desc_wonder_wall:0 "Мегапроект - строительство громадных городских стен."
 wonder_harbor:0 "Великая гавань"
 desc_wonder_harbor:0 "Оживлённая великолепная гавань приносит в округу и торговлю, и туристов."
 wonder_lighthouse:0 "Великий маяк"
 desc_wonder_lighthouse:0 "Высокий и заметный издалека ориентир, помогающий морякам и ночью направляющий корабли в порт."
 wonder_amphitheater:0 "Великий амфитеатр"
 desc_wonder_amphitheater:0 "Воплощение высокой культуры, амфитеатр - уникальная достопримечательность государства."
 wonder_palace:0 "Королевский дворец"
 desc_wonder_palace:0 "Царственный символ славного рода своего строителя, этот дворец не имеет себе равных."
 wonder_garden:0 "Великолепный сад"
 desc_wonder_garden:0 "Сад - чудо и науки, и красоты."
 wonder_forest:0 "Королевский лес"
 desc_wonder_forest:0 "Это не просто охотничьи угодья: некоторые части провинции живут с поразительной независимостью."
 wonder_university:0 "Великий университет"
 desc_wonder_university:0 "Высокий оплот учёности, известный по всему государству."
 wonder_library:0 "Великая библиотека"
 desc_wonder_library:0 "Книги бесценны, ибо на их страницах записаны знания о прошлом и о новом. Этот маяк знаний вместит тысячи книг и будет оборудован читальными залами."
 wonder_mausoleum:0 "Великий мавзолей"
 desc_wonder_mausoleum:0 "Для некоторых правителей простой гробницы недостаточно."
 wonder_pyramid:0 "Великая пирамида"
 desc_wonder_pyramid:0 "«Постройте выше!» - по преданию, последние слова её архитектора."
 wonder_pagan_stones:0 "Великий каменный круг"
 desc_wonder_pagan_stones:0 "Огромные стоячие камни образуют большой круг с проходом на восток, где встаёт солнце."
 wonder_pyramid_giza:0 "Великая пирамида Хуфу"
 desc_wonder_pyramid_giza:0 "Эти странные пирамиды стояли здесь всегда."
 wonder_amphitheater_colosseum:0 "Колизей"
 desc_wonder_amphitheater_colosseum:0 "За века амфитеатр служил для многого: от гладиаторских боёв и травли зверей до торговых рядов для городских купцов."
 wonder_cathedral_hagia_sophia:0 "Святая София"
 desc_wonder_cathedral_hagia_sophia:0 "Один из красивейших соборов в этой части карты."
 wonder_pagan_stones_stonehenge:0 "Стоунхендж"
 desc_wonder_pagan_stones_stonehenge:0 "Одни считают, что камни поставили боги. Другие называют это языческим суеверием, но всё равно не решаются подойти к ним."
 wonder_mausoleum_halicarnassus:0 "Галикарнасский мавзолей"
 desc_wonder_mausoleum_halicarnassus:0 "Гигантская надземная гробница, возведённая Мавсолом, сатрапом Персидской империи, для себя и Артемисии II Карийской."
 wonder_temple_solomon:0 "Храм Соломона"
 desc_wonder_temple_solomon:0 "Холм, глубоко священный для иудеев, ибо, как говорят, на нём стоял древний Храм Соломона."
 wonder_lighthouse_alexandria:0 "Александрийский маяк"
 desc_wonder_lighthouse_alexandria:0 "Долгое время самое высокое здание в мире, маяк - впечатляющее сооружение, видимое издалека и при этом исправно служащее своей цели: направлять корабли в порт."
 wonder_temple_hindu_konark:0 "Храм Солнца в Конарке"
 desc_wonder_temple_hindu_konark:0 "Храм Солнца в Конарке. Этот храм построен в виде гигантской украшенной колесницы, посвящённой богу Солнца Сурье."
 wonder_apostolic_palace:0 "Апостольский дворец"
 desc_wonder_apostolic_palace:0 "Дворец самого Папы, расположенный в сердце Рима."
 wonder_house_of_wisdom:0 "Дом мудрости"
 desc_wonder_house_of_wisdom:0 "Великий университет, хранящий значительную часть знаний мира."
 wonder_underground_city_petra:0 "Петра"
 desc_wonder_underground_city_petra:0 "Великий пустынный город Петра существует уже сотни лет."
