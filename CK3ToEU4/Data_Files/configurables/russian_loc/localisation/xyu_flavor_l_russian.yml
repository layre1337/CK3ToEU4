l_russian:
 plati_flavor_ckeu.EVTNAME1: "Прибытие христианской миссии"
 plati_flavor_ckeu.EVTDESC1: "Прибыла ещё одна группа ревностных оборванцев - последователей Христа, как они себя называют. Они пришли проповедовать слово своего Бога и «нести свет» в наши земли. Смиренно просят позволить им основать миссию и продолжить проповеди на нашей территории."
 plati_flavor_ckeu.EVTOPTA1: "Что ж, пусть приходят."
 plati_flavor_ckeu.EVTOPTB1: "Им здесь не рады."
 plati_flavor_ckeu.EVTNAME2: "Христианские миссионеры набирают силу"
 plati_flavor_ckeu.EVTDESC2: "Как и ожидалось, проповедники усердно рассказывали нашему народу о своей вере, и одна из наших провинций, похоже, привечает их религию."
 plati_flavor_ckeu.EVTOPTA2: "Пусть продолжают."
 plati_flavor_ckeu.EVTOPTB2: "Изгнать их из державы."
 plati_flavor_ckeu.EVTOPTC2: "Предать их всех мечу!"
 plati_flavor_ckeu.EVTNAME3: "Христианская миссия приносит знания"
 plati_flavor_ckeu.EVTDESC3: "Новоприбывшие богословы привезли множество свитков и книг в знак благодарности за наше благосклонное дозволение проповедовать в наших землях. Как ни удивительно, некоторые из этих текстов весьма любопытны и содержат немало полезных технических знаний."
 plati_flavor_ckeu.EVTOPTA3: "Люблю хорошее чтение."
 plati_flavor_ckeu.EVTOPTB3: "Эти учёные мужи нужны мне при дворе."
 plati_flavor_ckeu.EVTNAME4: "Религиозные столкновения среди купцов"
 plati_flavor_ckeu.EVTDESC4: "Отношения с язычниками всегда были напряжёнными. Обращение всей Европы - дело благородное, но порой торговля с язычниками оказывается полезнее борьбы с ними. Так или иначе, ревностная ненависть не угасает, и чужеземным купцам, не почитающим Христа, из-за этого часто приходится туго. Время от времени этим купцам встречаются тёмные личности, весьма охочие до их богатств... разумеется, во имя Христа."
 plati_flavor_ckeu.EVTOPTA4: "Хех, не мне их останавливать."
 plati_flavor_ckeu.EVTOPTB4: "Конфисковать всё, что везут эти язычники!"
 plati_flavor_ckeu.EVTOPTC4: "Положить этому конец."
 plati_flavor_ckeu.EVTNAME5: "Языческое влияние"
 plati_flavor_ckeu.EVTDESC5: "Дух язычества по-прежнему силён в Европе - ни дипломатические, ни насильственные попытки христианизации не принесли религиозного единства на континенте. Религиозное давление, идущее в обе стороны, постоянно сказывается на умах христиан. Разочарованные учением Церкви, недовольные порчей духовенства или просто находящие привлекательными языческие доктрины, вроде многоженства или поощрения личного богатства, слабые духом отворачиваются от Христа. Так происходит и в стране [Root.GetName]."
 plati_flavor_ckeu.EVTOPTA5: "Позор! Никакой терпимости к язычеству!"
 plati_flavor_ckeu.EVTOPTB5: "Однажды они поймут свою ошибку."
 plati_flavor_ckeu.EVTNAME6: "Космополитичная знать"
 plati_flavor_ckeu.EVTDESC6: "Дипломатические браки и династические связи были основой средневековой политики. Союзы и заговоры строились на этом священном перед Богом союзе, но в последнее время некоторые дворяне стали более «широко мыслить» на этот счёт. Когда языческое королевство распространяет своё влияние, а именно [plati_pagan_marriage_country.GetName], амбициозные христианские дворяне нередко стремятся к власти даже с язычниками - будь то торговые договоры или дипломатические браки. Наша страна не исключение."
 plati_flavor_ckeu.EVTOPTA6: "Закрыть глаза."
 plati_flavor_ckeu.EVTOPTB6: "Осудить дворянский род."
 plati_flavor_ckeu.EVTOPTC6: "Дать этим варварам понять, где их место."
 plati_flavor_ckeu.EVTNAME7: "Андалусская колониальная политика"
 plati_flavor_ckeu.EVTDESC7: "Столкнувшись с беспрецедентными возможностями Нового Света, [Root.GetAdjective] [Root.GovernmentName] получил на выбор несколько способов организации колонизации. Уже влиятельные священные ордена стали важной объединяющей силой в Магрибе, особенно в пустошах, населённых берберами, и их деятельность за морем была бы неоценимой. Назначение эмиров вице-королями казалось самым надёжным вариантом, но зимми, лишённые полноты власти в [Root.GetName], могли бы получить шанс на управление в Новом Свете - служа нашим интересам и возвышаясь как государственные мужи. Последний вариант наверняка вызовет критику ортодоксальных мусульман. В любом случае колонии будут считаться частью державы [Root.GetName]."
 plati_flavor_ckeu.EVTOPTA7: "Религиозные ордена хорошо служили нам и будут служить в Новом Свете."
 plati_flavor_ckeu.EVTOPTB7: "Мы должны довериться опыту эмиров."
 plati_flavor_ckeu.EVTOPTC7: "Зимми получат право управлять колониями."
 plati_flavor_ckeu.EVTNAME8: "Туземцы сопротивляются обращению"
 plati_flavor_ckeu.EVTDESC8: "В наших медленно растущих колониях живут те, в чьих жилах течёт туземная кровь. Будь то недавно ассимилированные племена или их потомки, многие из них либо продолжают следовать языческим верованиям, либо, попав под влияние зимми, принимают учение христианства. Наши губернаторы выражают беспокойство и просят поддержать их в этом смятении."
 plati_flavor_ckeu.EVTOPTA8: "Оставить туземцев в покое."
 plati_flavor_ckeu.EVTOPTB8: "Наш долг - явить им Истину."
 plati_flavor_ckeu.EVTOPTC8: "Доказать наше превосходство новыми завоеваниями."
 plati_flavor_ckeu.EVTNAME9: "Протестанты ищут убежища в стране [Root.GetName]"
 plati_flavor_ckeu.EVTDESC9: "Огонь Реформации охватывает Европу, и вместе с ним так же ярко пылают ненависть и насилие. Единство католиков всегда было под угрозой, но теперь они могут оказаться разделены как никогда. Пока одни ищут компромисса, страны вроде [plati_protestant_refugee_country.GetName] раздираются междоусобицей католиков и протестантов. Последние бежали с родины в надежде найти приют там, где их потерпят и будут уважать их права - в стране [Root.GetName]. Большая группа беженцев прибыла и молит позволить им поселиться в [plati_protestant_refugee_province.GetCapitalName]."
 plati_flavor_ckeu.EVTOPTA9: "Мы примем их с распростёртыми объятиями."
 plati_flavor_ckeu.EVTOPTB9: "Прогнать их."
 plati_flavor_ckeu.EVTNAME10: "Папа недоволен соседями-язычниками"
 plati_flavor_ckeu.EVTDESC10: "Папа [PAP.Monarch.GetName] выражает глубокое неудовольствие державой [Root.GetName] и нашей терпимостью к соседним язычникам, а именно к [plati_nearby_pagan_pope_target.GetName]. Папа настоятельно призывает нас взяться за оружие и объявить войну нашим соседям-язычникам, которые заставляют каждого добропорядочного христианина на границе сомневаться в своей вере. Отказ наверняка разгневает Папу, зато мы избежим войны с [plati_nearby_pagan_pope_target.GetName]."
 plati_flavor_ckeu.EVTOPTA10: "Это не его дело."
 plati_flavor_ckeu.EVTOPTB10: "Так угодно Богу!"
 plati_flavor_ckeu.EVTNAME11: "Растущая религиозная напряжённость"
 plati_flavor_ckeu.EVTDESC11: "Ходят слухи, что соседняя католическая держава собирает войска и освящает клинки, готовясь к очередному крестовому походу - против нас! Возможно, нападение и не неизбежно, но лучше быть готовыми к грядущему конфликту."
 plati_flavor_ckeu.EVTOPTA11: "Как они смеют!"
 plati_flavor_ckeu.EVTNAME12: "Католический богослов ищет убежища"
 plati_flavor_ckeu.EVTDESC12: "По одному ему известным причинам человек, сведущий в трудах о Боге и божественном, был изгнан с родины и ищет здесь пристанища. Он предлагает свои услуги богослова и не намерен проповедовать среди последователей религии [Root.Religion.GetName]. Тем не менее наше духовенство может быть недовольно таким человеком при дворе."
 plati_flavor_ckeu.EVTOPTA12: "Он может оставаться сколько угодно."
 plati_flavor_ckeu.EVTOPTB12: "В стране [Root.GetName] и так достаточно чудаков."
 plati_flavor_ckeu.EVTNAME13: "Язычники среди нас!"
 plati_flavor_ckeu.EVTDESC13: "В уединённом месте обнаружено тайное сборище - группа крестьян в странных лохмотьях плясала, пела и что-то праздновала у костра. Многие встревоженные люди уверены, что они тайные последователи язычества религии [plati_pagan_cult_exile_country.Religion.GetName]. Без сомнения, под влиянием державы [plati_pagan_cult_exile_country.GetName]. Как следует поступить?"
 plati_flavor_ckeu.EVTOPTA13: "Казнить язычников."
 plati_flavor_ckeu.EVTOPTB13: "Их забавные обычаи нас не касаются."
 plati_flavor_ckeu.EVTOPTC13: "Убедить их отречься от своей веры."
 plati_flavor_ckeu.EVTNAME14: "Язычники в Священной лиге"
 plati_flavor_ckeu.EVTDESC14: "То, что поначалу казалось умеренной религиозной распрей, в итоге переросло в один из кровавейших конфликтов в истории Европы того времени. Поскольку причины слишком часто были политическими и экономическими, а не религиозными, было естественно, что нехристиане примут в нём участие ради собственных нужд. Мусульмане видели в этом возможность изменить баланс сил в свою пользу, а язычники - беспрецедентный шанс повлиять на будущее континента. В конце концов воинственные королевства вроде [Root.GetName] могли хотя бы поживиться грабежами и набегами. По крайней мере, пока участие в этом кровавом конфликте не взяло свою тяжкую дань."
 plati_flavor_ckeu.EVTOPTA14: "У нас есть свои причины поддерживать католиков."
 plati_flavor_ckeu.EVTOPTB14: "Пока мы сражаемся с католиками, я доволен."
 plati_flavor_ckeu.EVTNAME15: "Содержание священных мест"
 plati_flavor_ckeu.EVTDESC15: "У европейских язычников, особенно у приверженцев веры [Root.Religion.GetName], многие места поклонения и обрядов находятся в глухих лесах, уединённых рощах и других уголках природы. Хотя они не требуют постоянного ухода, время берёт своё и с ними, и необходимо что-то предпринять, чтобы они оставались в порядке и доступными, дабы угодить Богам и Предкам. Как велит традиция, пришло время сделать это."
 plati_flavor_ckeu.EVTOPTA15: "Разумеется."
 plati_flavor_ckeu.EVTOPTB15: "Они священны и так."
 plati_flavor_ckeu.EVTOPTC15: "Мы украсим их!"
 plati_flavor_ckeu.EVTNAME16: "Обессмертить предка"
 plati_flavor_ckeu.EVTDESC16: "Культ предков - основа веры [Root.Religion.GetName], и знатное происхождение часто ценится выше богатства и титулов. Наша династия, пусть и значимая, могла бы многое выиграть, «возвысив» одного из предков и воплотив его жизнь и деяния в произведении искусства или литературы эпического масштаба. Однако это потребует денежных вложений."
 plati_flavor_ckeu.EVTOPTA16: "Мы воздадим ему почести."
 plati_flavor_ckeu.EVTOPTB16: "Он и так живёт в нашей памяти."
 plati_flavor_ckeu.EVTNAME19: "Великий [Root.GetAdjective] пир [GetYear] года"
 plati_flavor_ckeu.EVTDESC19: "Для народа [Root.Culture.GetName] испокон веков принято собираться на ежегодное празднество - будь то летнее или зимнее солнцестояние, почитание предков или поклонение божествам. Всё это достойно торжества и должно разделяться с общиной. Устройство больших празднеств в честь дорогого и священного для нас сплачивает всех. Многие убеждены, что нам следует устроить поистине грандиозный пир, который пройдёт в этом году в [Root.Capital.GetName]."
 plati_flavor_ckeu.EVTOPTA19: "Попируем вместе!"
 plati_flavor_ckeu.EVTOPTB19: "Не время для празднеств."
 plati_flavor_ckeu.19.e.tt: "Будет устроен грандиозный пир."
 plati_flavor_ckeu.EVTNAME20: "Дипломатическая возможность"
 plati_flavor_ckeu.EVTDESC20: "Послы, чиновники и просто гости из чужих стран прибыли присоединиться к нашему торжеству. Хотя из одного лишь кутежа прочный союз не выкуешь, мы должны обратить необычайное обилие иностранцев себе на пользу."
 plati_flavor_ckeu.EVTOPTA20: "Покажем всем наше гостеприимство!"
 plati_flavor_ckeu.EVTOPTB20: "Чем больше друзей, тем лучше!"
 plati_flavor_ckeu.EVTOPTC20: "Лучше укрепим уже существующие связи."
 plati_flavor_ckeu.EVTNAME21: "Пирующие воины"
 plati_flavor_ckeu.EVTDESC21: "Мужчины собираются в высоких залах, восхваляя нашу могучую армию, что защитит их семьи и сразит наших врагов. [Root.GetName] может гордиться сильным войском, и этот пир - прекрасная возможность выразить благодарность, а именно..."
 plati_flavor_ckeu.EVTOPTA21: "[Root.Monarch.GetTitle] благоволит флоту!"
 plati_flavor_ckeu.EVTOPTB21: "[Root.GetName] нужны сильные воины!"
 plati_flavor_ckeu.EVTOPTC21: "Выпьем за могучих [Root.GetAdjective] вождей!"
 plati_flavor_ckeu.EVTNAME22: "О сословиях и людях"
 plati_flavor_ckeu.EVTDESC22: "Знатные, выбившиеся из низов или жрецы - все приглашены на торжество. Дворяне хранят память о сказаниях своих предков, купцы делятся рассказами о чужих землях, а духовенство оберегает наши традиции и обряды. И всё же в этом году хвалу получают..."
 plati_flavor_ckeu.EVTOPTA22: "[Root.GetName] рухнула бы без дворянства!"
 plati_flavor_ckeu.EVTOPTB22: "Всё благодаря мудрым советам жрецов религии [Root.Religion.GetName]!"
 plati_flavor_ckeu.EVTOPTC22: "Мудрые торговцы - причина нашего процветания!"
 plati_flavor_ckeu.EVTNAME23: "Пиршественное великолепие"
 plati_flavor_ckeu.EVTDESC23: "Пир этого года стал самым большим за последнее десятилетие. Все достойные люди прибыли в [Root.Capital.GetName], чтобы выпить за своего правителя. Многие были накормлены, ещё больше хорошо провели время. В разгар торжества [Root.Monarch.GetName] оказывается в центре внимания, а собравшиеся жаждут произнести тост."
 plati_flavor_ckeu.EVTOPTA23: "Да процветает [Root.GetName]!"
 plati_flavor_ckeu.EVTOPTB23: "Да процветает [Root.Monarch.GetName]!"
 plati_flavor_ckeu.EVTOPTC23: "Да процветает религия [Root.Religion.GetName]!"
 plati_flavor_ckeu.EVTNAME24: "Катастрофический пир!"
 plati_flavor_ckeu.EVTDESC24: "Начиналось всё ровно, и никто толком не скажет, когда всё пошло прахом. Ясен лишь итог - разбитые столы и носы, пролитые кружки и проклятия, а также сильное напряжение в воздухе. Вместо единства пир принёс раздор и волнения. И вся вина ложится на..."
 plati_flavor_ckeu.EVTOPTA24: "[Root.Monarch.GetTitle] [Root.Monarch.GetName]..."
 plati_flavor_ckeu.EVTOPTB24: "Этих интриганов-дворян!"
 plati_flavor_ckeu.EVTOPTC24: "Этих высокомерных жрецов!"
 plati_flavor_ckeu.EVTOPTD24: "Купцов и их жадность!"
 plati_flavor_ckeu.EVTOPTE24: "Всех нас."
 plati_flavor_ckeu.EVTNAME25: "Пираты Балтийского моря"
 plati_flavor_ckeu.EVTOPTA25: "Пиратская жизнь - для меня!"
 plati_flavor_ckeu.EVTOPTB25: "Разбой того не стоит."
 plati_flavor_ckeu.EVTNAME27: "Установка рунного камня"
 plati_flavor_ckeu.EVTDESC27: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] решил воздвигнуть рунный камень. Какую надпись на нём высечь?"
 plati_flavor_ckeu.EVTOPTA27: "«В память о...»"
 plati_flavor_ckeu.EVTOPTB27: "«[Root.Monarch.GetName] Великий...»"
 plati_flavor_ckeu.EVTNAME28: "Религия [Root.Religion.GetName] и кровавые жертвы"
 plati_flavor_ckeu.EVTDESC28: "Кровавые жертвоприношения были широко распространены среди европейских язычников - жизни животных или людей отдавались божеству в знак умилостивления или поклонения. Порой это не превращается ни во что большее, чем затейливый способ приготовить семейный ужин, но иногда устраиваются особые празднества, где животных и даже людей ритуально убивают, у скандинавских народов часто через повешение. Невзирая на наше отношение к этому, многие верующие в державе [Root.GetName] открыто совершают подобные обряды. Хотя традиция принимает разные формы в разных местах, наши христианские соседи испытывают лишь отвращение к этому «варварскому» обычаю."
 plati_flavor_ckeu.EVTOPTA28: "Всё ради благосклонности Богов!"
 plati_flavor_ckeu.EVTOPTB28: "Ограничить обычай одними животными."
 plati_flavor_ckeu.EVTOPTC28: "Запретить этот обычай!"
 plati_flavor_ckeu.EVTNAME29: "Популярный жрец"
 plati_flavor_ckeu.EVTDESC29: "Люди рассказывают об учёном и харизматичном жреце из [plati_shaman_province.GetName]. Он и толкует доктрину достаточно понятно для простого человека, и изобретательно развлекает народ на празднествах и обрядах - без сомнения, такой человек пригодится."
 plati_flavor_ckeu.EVTOPTA29: "Привести его ко двору."
 plati_flavor_ckeu.EVTOPTB29: "Его место среди своих."
 plati_flavor_ckeu.EVTNAME30: "Языческий синкретизм"
 plati_flavor_ckeu.EVTDESC30: "Сосуществование религии [plati_syncretic_province.Religion.GetName] и веры [Root.Religion.GetName] во многом оказалось проще, чем мы поначалу опасались. Уже немало примеров тому, как божества [Root.Religion.GetName] входят в число богов [plati_syncretic_province.Religion.GetName], а боги и обычаи [plati_syncretic_province.Religion.GetName] входят в жизнь последователей [Root.Religion.GetName]. Более того, в какой-то мере то же самое началось и со многими другими религиями в дальних уголках нашей империи: множество малых и великих богов вливается в общий пантеон [plati_syncretic_province.Religion.GetName]-[Root.Religion.GetName]."
 plati_flavor_ckeu.EVTOPTA30: "Великолепно!"
 plati_flavor_ckeu.EVTOPTB30: "Наши традиции должны остаться чистыми!"
 plati_flavor_ckeu.EVTNAME31: "Непризнанная культура требует признания"
 plati_flavor_ckeu.EVTDESC31: "Жители [plati_dissatisfied_relig_province.GetName] исповедуют религию [plati_dissatisfied_relig_province.Religion.GetName], и, будучи чуждой нам культурой, они естественным образом выработали традицию иных божеств в своём пантеоне. Население культуры [plati_dissatisfied_relig_province.Culture.GetName] требует признания - слияния наших традиций [Root.Religion.GetName] с широким кругом их собственных особых верований [plati_dissatisfied_relig_province.Religion.GetName]. Если мы согласимся, эти люди, несомненно, будут благодарны за оказанное уважение, но наше жречество придёт в ярость от столь резких перемен в доктрине."
 plati_flavor_ckeu.EVTOPTA31: "Мы примем их Богов."
 plati_flavor_ckeu.EVTOPTB31: "Возмутительные требования!"
 plati_flavor_ckeu.EVTNAME32: "Почитание: [Root.Monarch.GetTitle]"
 plati_flavor_ckeu.EVTDESC32: "Благодаря популярности [Root.Monarch.GetName] многие верующие убеждены, что стабильность и мир в державе обязаны правлению [Root.Monarch.GetHerHis]. Более того, считается, что [Root.Monarch.GetTitle] [Root.Monarch.GetName] был послан в [Root.GetName] самими Богами, божественно освятившими [Root.Monarch.GetHerHis] правление. Иными словами, нашего правителя почитают как полубога!"
 plati_flavor_ckeu.EVTOPTA32: "Люди верят во что хотят."
 plati_flavor_ckeu.EVTOPTB32: "Положить этому конец!"
 plati_flavor_ckeu.EVTNAME33: "Дурные знамения"
 plati_flavor_ckeu.EVTDESC33: "Тщательно истолковав знаки во время обрядов, наши прорицатели пришли к единому мнению: [Root.GetName] ждут тёмные времена. Дурные знамения предвещают поражения в битвах, крах экономики и повальную болезнь, что поглотит страну."
 plati_flavor_ckeu.EVTOPTA33: "Боги разгневаны!"
 plati_flavor_ckeu.EVTOPTB33: "Быть может, вы неверно истолковали знаки?"
 plati_flavor_ckeu.EVTNAME34: "Добрые знамения"
 plati_flavor_ckeu.EVTDESC34: "Тщательно истолковав знаки во время обрядов, наши прорицатели пришли к единому мнению: [Root.GetName] ждёт светлое будущее. Добрые знамения предвещают победы над врагами, невиданное богатство и всеобщее благополучие страны."
 plati_flavor_ckeu.EVTOPTA34: "Боги благоволят нам!"
 plati_flavor_ckeu.EVTNAME35: "Третий Храм наконец достроен!"
 plati_flavor_ckeu.EVTDESC35: "Наконец-то в державе [Root.GetName] завершено строительство преемника Храма Соломона и Второго Храма! Эпоха Мессии почти наступила!"
 plati_flavor_ckeu.EVTOPTA35: "Славно!"
 plati_flavor_ckeu.EVTNAME36: "Еврейская родина?"
 plati_flavor_ckeu.EVTDESC36: "Среди евреев диаспоры расходится весть о возвышении [Root.GovernmentName] [Root.GetName]. К нашим границам начал стекаться медленный, но всё более устойчивый ручеёк переселенцев, надеющихся жить и служить в государстве, где их не запрут в гетто и не будут стеснять законы и предрассудки."
 plati_flavor_ckeu.EVTOPTA36: "Добро пожаловать домой."
 plati_flavor_ckeu.EVTNAME37: "Осквернение субботы"
 plati_flavor_ckeu.EVTDESC37: "На седьмой день после того, как Эгзиабхер сотворил мир, Он почил. В Его честь мы чтим седьмой день недели как святой. В субботу, от заката предыдущего дня и до появления звёзд, мы не работаем, не пишем и не готовим. Мы даже не разжигаем огня. Осквернение субботы - преступление против законов Божьих.\n\nДо нас дошёл слух, что один из наших самых доверенных советников, [Root.Adm_Advisor.GetName], часто работает в субботу. Хотя наиболее рьяные возмутители требуют побить [Root.Adm_Advisor.GetSheHe] камнями за [Root.Adm_Advisor.GetHerHis] грешные деяния, мы не хотим создавать опасный прецедент. В конце концов, [Root.Adm_Advisor.GetName] не единственный при дворе, кто нарушает субботу, хотя [Root.Adm_Advisor.GetSheHe] делает это чаще всех и менее всех таится. Простое увольнение [Root.Adm_Advisor.GetHerHim] наверняка успокоит большинство, хотя опыт [Root.Adm_Advisor.GetHerHis] сделает это большой потерей..."
 plati_flavor_ckeu.EVTOPTA37: "Мы не можем позволить, чтобы столь дурной нравственный образ представлял наше правительство."
 plati_flavor_ckeu.EVTOPTB37: "[Root.Adm_Advisor.GetName] слишком важен для нашего [Root.GovernmentName]. [Root.Adm_Advisor.GetSheHeCap] останется."
 plati_flavor_ckeu.EVTNAME38: "Христианское влияние"
 plati_flavor_ckeu.EVTDESC38: "С самого зарождения христианства евреи снова и снова изменяли своей вере и принимали обращение, объявляя Иисуса из Назарета предсказанным Мессией. Хотя часто это происходило из-за притеснений и насилия со стороны различных владык, порой на такой шаг толкали богословские доводы и харизматичные миссионеры. Скорее всего, под влиянием державы [plati_jew_christian_country.GetName] и её проповедников жители [plati_jew_converted_province.GetCapitalName] открыто отреклись от религии [Root.Religion.GetName] и приняли веру [plati_jew_christian_country.Religion.GetName]."
 plati_flavor_ckeu.EVTOPTA38: "Ну ладно."
 plati_flavor_ckeu.EVTNAME39: "Финансирование новой ешивы"
 plati_flavor_ckeu.EVTDESC39: "Ешива - еврейское учебное заведение, где изучают традиционные религиозные тексты, прежде всего Талмуд и Тору, и галаху (еврейский закон). Обучение обычно проходит в форме ежедневных шиурим (лекций или занятий), а также в парах, называемых хавруса (арамейское слово, означающее «дружба» или «товарищество»). Традиционно каждый городской раввин имел право содержать некоторое число учеников, обучающихся полный или неполный день, в бейт-мидраше (учебном зале) города, обычно примыкавшем к синагоге. Их содержание покрывалось общинным налогом. Но теперь, когда у веры [Root.Religion.GetName] наконец появилось собственное государство, духовенство мягко попросило [Root.Monarch.GetTitle] о финансировании такого заведения."
 plati_flavor_ckeu.EVTOPTA39: "Разумеется."
 plati_flavor_ckeu.EVTOPTB39: "У нашей казны другие приоритеты."
 plati_flavor_ckeu.EVTNAME40: "Ренессанс и язычество"
 plati_flavor_ckeu.EVTDESC40: "Идеалы Ренессанса наконец полностью восприняты в [Root.GovernmentName] [Root.GetName]. После веков христианского господства над наукой и философией вновь вспыхнул интерес к римским и греческим мыслителям древности. Вместе с ним вновь проснулся интерес к языческой мысли, некогда господствовавшей в Европе. Художники Ренессанса восхищаются античностью, а учёные мужи спорят о классической греческой философии. Самые смелые выступают против якобы архаичных взглядов христианства на науку, образование и даже общественные нормы. Многие из них находятся под влиянием уцелевших по сей день в Европе языческих королевств. Но, возможно, это творческое любопытство - лишь поверхность более глубокой тяги нашей культуры к верованиям старины? Не пора ли вновь принять наше языческое наследие?"
 plati_flavor_ckeu.EVTOPTA40: "Ограничим движение искусствами и науками."
 plati_flavor_ckeu.EVTOPTB40: "Pax Deorum!"
 plati_flavor_ckeu.EVTNAME41: "Ренессанс и язычество"
 plati_flavor_ckeu.EVTDESC41: "Ренессанс - движение, в основном построенное на увлечении античностью и дохристианским Римом, - принял несколько иную форму в языческом мире. Вместо художественного противостояния с Церковью это было время национальных мифов, героических эпосов, языческой литературы и искусства, и всё это горячо поощрялось и поддерживалось жречеством. Богословы глубже погружались в тайны оккультного, мистического и шаманского. Многие христианские таланты, преследуемые консервативной церковью, находили убежище в языческих королевствах, создавая монументальную архитектуру, чарующие картины и поразительные изобретения. Сказания о могучих героях, хитрых обманщиках и гневных Богах расцвели как никогда. Священные рощи, святые места и даже небольшие рунные камни постепенно вырастали в Изысканные храмы, Прочные монументы и Великие достопримечательности. Для [Root.GetName] это определённо походило на золотой век культуры."
 plati_flavor_ckeu.EVTOPTA41: "Любопытно."
 plati_flavor_ckeu.EVTNAME42: "Кодификация языческих мифов"
 plati_flavor_ckeu.EVTDESC42: "Многие древние традиции и верования были утрачены из-за устной традиции, которой следовали древние народы. Долгое время мифы и легенды религии [Root.Religion.GetName] тоже передавались и преподавались устно и редко запечатлевались на бумаге. Снорри Стурлусон описал события в «Прозаической Эдде» спустя века после их действительных дат - в основном по сведениям, переданным со слов скальдов и бардов, часть которых считается недостоверной. Однако с рождением книгопечатания многие страны, включая [Root.GetName], начали масштабную культурную кампанию с единственной целью - свести воедино сотни, если не тысячи сказаний, историй, песен, обычаев и каждую крупицу фольклора, какую удавалось найти. Некоторые верования пережили «негибкость» и увидели рождение невиданных ранее «фундаменталистов», отдающих предпочтение одним книгам и сказаниям как священным текстам - без сомнения, под влиянием авраамических религий. Однако это движение не стало повсеместным, и космополитичный взгляд, который язычники часто разделяли в своих традициях, сохранился. Но если будущий Владыка или [Root.Monarch.GetTitle] решит навязать свою религию другим, эти тексты наверняка ему помогут."
 plati_flavor_ckeu.EVTOPTA42: "Интересно."
 plati_flavor_ckeu.EVTNAME43: "Зороастрийская диаспора"
 plati_flavor_ckeu.EVTDESC43: "Среди разных общин изгнанных зороастрийцев разнеслась весть о нашем почитании веры [Root.Religion.GetName]. Особую славу снискали храмы огня в [Root.GetCapitalName], и теперь в этот край начало прибывать множество зороастрийцев, чтобы начать новую жизнь в надежде на более гостеприимную землю. Устойчивый поток учёных, купцов и других ценных мужчин и женщин, несомненно, поможет краю расти."
 plati_flavor_ckeu.EVTOPTA43: "Превосходно."
 plati_flavor_ckeu.EVTOPTB43: "Лучшие присоединятся к нашему двору."
 plati_flavor_ckeu.EVTNAME44: "Слияние обрядов"
 plati_flavor_ckeu.EVTDESC44: "Включение культурных и местных обрядов весьма распространено, и в исторически зороастрийских общинах передаются такие традиции, как лечение травами, свадебные церемонии и тому подобное. Традиционно зороастрийские обряды включали и шаманские элементы, например мистические способы путешествия духа в незримый мир и употребление креплёного вина, хаомы, манга и других ритуальных средств. В державе [Root.GetName] исповедуются и другие веры, помимо [Root.Religion.GetName]. Жречество спорит между собой о том, что важнее - синкретизм или чистота веры."
 plati_flavor_ckeu.EVTOPTA44: "Мир в чистоте."
 plati_flavor_ckeu.EVTOPTB44: "Чистота в мире."
 plati_flavor_ckeu.EVTNAME45: "Достижение гнозиса"
 plati_flavor_ckeu.EVTDESC45: "Через знание божественная искра, покоящаяся во всех людях, может быть освобождена и возвращена к своему небесному источнику в мире духов. Наша гностическая традиция обретения мудрости привела к притоку многих великих умов."
 plati_flavor_ckeu.EVTOPTA45: "Интересно."
 plati_flavor_ckeu.EVTNAME46: "Отречение от мирского"
 plati_flavor_ckeu.EVTDESC46: "Постоянно растущая доля земель, которой напрямую владеет [Root.GovernmentName], вызвала большое беспокойство среди последователей [Root.Religion.GetName]. Вместо того чтобы освободиться от мирских владений и воссоединиться с творцом, наш [Root.Monarch.GetTitle], похоже, весьма дорожит бренным миром."
 plati_flavor_ckeu.EVTOPTA46: "Отречься от бренного!"
 plati_flavor_ckeu.EVTOPTB46: "Они преувеличивают..."
 plati_flavor_ckeu.EVTNAME47: "Воссоединение с Творцом"
 plati_flavor_ckeu.EVTDESC47: "Многие верующие [Root.Religion.GetName] проявили больше рвения, чем обычно: вместо достижения освобождения через гнозис они решили, что быстрейший и вернейший путь к воссоединению с Творцом - покинуть материальное тело и владения. Наши солдаты готовы сражаться яростнее в идущей войне в надежде достичь освобождения. Приток ревностных воинов означает и то, что работники мало заинтересованы в дальнейшем приумножении своего богатства."
 plati_flavor_ckeu.EVTOPTA47: "Поддержать движение."
 plati_flavor_ckeu.EVTOPTB47: "Остановить движение."
 plati_flavor_ckeu.EVTNAME48: "Традиции [Root.Religion.GetName]"
 plati_flavor_ckeu.EVTDESC48: "Традиции [Root.Religion.GetName] всё ещё живы в памяти народа [Root.GetName]. Теперь, когда о тезисах Лютера узнали повсюду, всё больше влиятельных людей открыто объявляют себя протестантами, а не приверженцами [Root.Religion.GetName]. Нам предстоит решить: сохранить особую идентичность [Root.Religion.GetName] или присоединиться к более широкой протестантской Реформации."
 plati_flavor_ckeu.EVTOPTA48: "Мы присоединимся к Реформации!"
 plati_flavor_ckeu.EVTOPTB48: "Мы сохраним нашу особую веру [Root.Religion.GetName]."
 plati_flavor_ckeu.EVTNAME49: "Конфликт езидов и [plati_yazidi_muslim_neighbor.Religion.GetName]"
 plati_flavor_ckeu.EVTDESC49: "Мусульмане и исламисты считают езидизм «поклонением дьяволу». Езидов преследуют окружающие мусульмане со времён Средневековья - соседние арабские и курдские племена и княжества. [plati_yazidi_muslim_neighbor.Monarch.GetTitle] державы [plati_yazidi_muslim_neighbor.GetName] проявляет особенно жестокое рвение, нападая на пограничные деревни и караваны. Вряд ли вражда с [plati_yazidi_muslim_neighbor.GetName] скоро закончится..."
 plati_flavor_ckeu.EVTOPTA49: "Тревожно."
 plati_flavor_ckeu.EVTNAME50: "Правитель считается воплощением"
 plati_flavor_ckeu.EVTDESC50: "Считается, что наш [Root.Monarch.GetTitle] - одно из священных воплощений Семи Ангелов. Уже любимый, а теперь и почитаемый, [Root.Monarch.GetName] несёт тяжкое бремя ожиданий и надежд. Какой бы путь мы ни избрали, ясно одно: Малак-Тавус воистину благословил [Root.GetName]."
 plati_flavor_ckeu.EVTOPTA50: "Я несу мир."
 plati_flavor_ckeu.EVTOPTB50: "Я принесу процветание."
 plati_flavor_ckeu.EVTOPTC50: "Я одержу победы."
