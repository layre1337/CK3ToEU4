l_russian:
 incident_fraticelli_pope:3 "Папа и император"
 incident_fraticelli_pope_member_alert:3 "Теперь, когда Италия вновь стала оплотом имперской власти, Папа Римский ходатайствует о принятии в число имперских князей Священной Римской империи. Если Папа признает власть императора, это будет иметь серьёзные последствия для мира фратичелли. Хотя верные фратичелли внутри империи могут укрепиться в вере благодаря законности, которую придаёт папское членство, те, кто находится за её пределами, вряд ли благосклонно воспримут такое решение и могут впасть в ересь."
 incident_fraticelli_pope_emperor_alert:3 "Теперь, когда Италия вновь стала оплотом имперской власти, Папа Римский ходатайствует о принятии в число имперских князей Священной Римской империи. Если Папа признает власть императора, это будет иметь серьёзные последствия для мира фратичелли. Хотя верные фратичелли внутри империи могут укрепиться в вере благодаря законности, которую придаёт папское членство, те, кто находится за её пределами, вряд ли благосклонно воспримут такое решение и могут впасть в ересь."
 incident_pope.1.t:3 "Священная империя?"
 incident_pope.1.d:3 "Италия, переставшая быть «Королевством теней», благодаря неустанным усилиям императора вновь вошла в состав Священной Римской империи. Папской области предстоит решить: признать верховенство императора или остаться нагой и беззащитной на пороге империи.\n\nПризнание власти императора будет иметь серьёзные последствия для христианского мира. Хотя истинные христиане внутри империи могут укрепиться в вере благодаря законности, которую придаёт папское членство, те, кто находится за её пределами, вряд ли благосклонно воспримут такое решение и могут впасть в ересь."
 incident_pope.1.a:3 "Мы вступим в империю."
 incident_pope.1.b:3 "Святой Престол должен оставаться независимым."
 pope_incident_tt:3 "Император решит, принимать ли Папскую область в Священную Римскую империю.\n§YЭто будет иметь последствия для всего христианского мира.§!"
 pope_incident_tt2:3 "§YЭто будет иметь последствия для всего христианского мира.§!\n§YИстинные христиане за пределами империи получат штрафы к престижу.§!"
 incident_pope.2.t:3 "Священная империя?"
 incident_pope.2.d:3 "Италия, переставшая быть «Королевством теней», благодаря неустанным усилиям императора вновь вошла в состав Священной Римской империи. Папа Римский предпочёл признать верховенство империи, нежели остаться нагим и беззащитным на её пороге.\n\nЕсли позволить Папе стать имперским князем, это будет иметь серьёзные последствия для христианского мира. Хотя истинные христиане внутри империи могут укрепиться в вере благодаря законности, которую придаёт папское членство, те, кто находится за её пределами, вряд ли благосклонно воспримут такое решение и могут впасть в ересь."
 incident_pope.2.a:3 "Папа вступит в империю."
 incident_pope.2.b:3 "Святой Престол должен остаться независимым."
 incident_pope.3.t:3 "Нечестивая империя"
 incident_pope.3.d:3 "Имперский рейхстаг принял ужасный и нетерпимый эдикт: империя более не будет исповедовать истинную христианскую веру. Все наши усилия по восстановлению достоинства Святой Матери-Церкви оказались тщетны, и потому нам следует всерьёз задуматься о том, чтобы покинуть этот осквернённый институт."
 incident_pope.3.a:3 "Покинем это обиталище греха."
 incident_pope.3.b:3 "Мы должны остаться ради блага Христианского мира."
