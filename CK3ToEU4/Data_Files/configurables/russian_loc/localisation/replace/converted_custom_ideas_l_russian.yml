l_russian:
 european_tribal_ideas:3 "Идеи европейских племён"
 european_tribal_ideas_start:3 "Традиции европейских племён"
 european_tribal_ideas_bonus:3 "Амбиции европейских племён"
 deep_roots:3 "Глубокие корни"
 deep_roots_desc:3 "Эти земли принадлежали нам столько, сколько мы себя помним. Наши матери и отцы трудились, сражались и умирали на этой почве. Наши корни уходят глубоко, и мы отдадим жизнь, защищая свой дом."
 warriors_grit:3 "Стойкость воина"
 warriors_grit_desc:3 "Пусть у других народов есть преимущество в технологиях и золоте, но один наш воин стоит десятерых их воинов. Сильные, упорные и непоколебимые - о их стойкости слагают рассказы и в ближних, и в дальних землях."
 the_way_of_old:3 "Путь предков"
 the_way_of_old_desc:3 "Рассказы о храбрости и могуществе предков передаются из поколения в поколение. И молодые, и закалённые в боях воины находят в этих сказаниях мудрость и несут её с собой на поле битвы."
 ruthless_raiders:3 "Безжалостные налётчики"
 ruthless_raiders_desc:3 "Наш климат суров, а почвы скудны. Зато наши топоры остры, как бритва, а наш народ отважнее большинства. Чего мы хотим, то берём. Тем, кто посмеет встать на нашем пути, пощады не будет."
 ancestral_pride:3 "Гордость за предков"
 ancestral_pride_desc:3 "Наш народ всегда гордился своим прошлым. Это помогало нам сохранять твёрдость духа в неурожайные годы и долгие войны."
 arctolatry:3 "Арктолатрия"
 arctolatry_desc:3 "С древнейших времён мы практикуем арктолатрию - поклонение медведям. Наши воины изучают, как сражаются медведи, и приносят их свирепость на поле боя."
 side_by_side:3 "Плечом к плечу"
 side_by_side_desc:3 "Мы знаем, что сила не в числе, а в узах, которые нас связывают. На поле боя мы бесстрашны, ведь знаем, что братья по оружию прикроют нам спину."
 hero_of_the_legends:3 "Герой из легенд"
 hero_of_the_legends_desc:3 "С малых лет мы росли на материнском молоке и древних легендах. Самая известная из них повествует о могучем герое, который однажды приведёт наш народ к величию. Его приход близок - мы чувствуем это в крови."

 jomsvikings_ideas:3 "Идеи йомсвикингов"
 jomsvikings_ideas_start:3 "Традиции йомсвикингов"
 jomsvikings_ideas_bonus:3 "Амбиции йомсвикингов"
 jomsviking_code:3 "Кодекс йомсвикингов"
 jomsviking_code_desc:3 "Йомсвикинги очень тщательно отбирали тех, кого принимали в орден. Вступить могли только мужи, доказавшие свою доблесть. Чтобы быть принятым, кандидат должен был совершить подвиг, требующий силы. Став членом ордена, он подчинялся строгому своду правил, а военная дисциплина поддерживалась суровыми мерами."
 legend_of_jomsborg:3 "Легенда о Йомсборге"
 legend_of_jomsborg_desc:3 "Йомсборг издавна был легендарным местом, о котором мечтали все северяне. Неприступная крепость с защищённой гаванью, способной вместить огромный флот из сотен кораблей."
 glory_of_the_allfather:3 "Во славу Всеотца"
 glory_of_the_allfather_desc:3 "Йомсвикинги были преданы богу войны северян - Одину. Северяне из ордена не боялись смерти, и их величайшим желанием было умереть славной смертью на поле боя."
 name_of_thor:3 "Именем Тора"
 name_of_thor_desc:3 "Тор был богом защиты и силы, и орден поклонялся ему тоже. Свирепые воины Йомсборга будут сражаться, пока способны взмахнуть топором и раскроить череп поклоняющемуся кресту."
 adopt_feudal_system:3 "Принять феодальную систему"
 adopt_feudal_system_desc:3 "Возникнув как орден, посвящённый поклонению северным богам, йомсвикинги никогда не годились на роль настоящего государства. Теперь Вождь провёл реформы и ввёл феодальную систему: самым преданным членам ордена выданы уделы в награду за долгую службу."
 implement_hogting:3 "Ввести Хёгтинг"
 implement_hogting_desc:3 "Тинг был местным собранием, где разрешались споры и принимались политические решения. По мере роста йомсвикингов их влияние в отдалённых краях ослабевало. Чтобы удерживать местное население под контролем, они сделали тинг центральным органом власти, а Вождь стал Законоговорителем."
 valhalla_awaits:3 "Вальхалла ждёт"
 valhalla_awaits_desc:3 "Как последователи асов, северяне верили, что с приближением Рагнарёка их позовут на пир в Вальхаллу, чтобы вновь сражаться бок о бок с богами. Поэтому война и битвы были центральной частью их жизни, и они постоянно готовились к своему славному дню на поле боя."

 hashshashin_ideas:3 "Идеи хашашинов"
 hashshashin_ideas_start:3 "Традиции хашашинов"
 hashshashin_ideas_bonus:3 "Амбиции хашашинов"
 hashshashins_creed:3 "Кредо хашашинов"
 hashshashins_creed_desc:3 "Хашашины были замкнутым орденом убийц на Ближнем Востоке. Окружённые превосходящими силами политических и религиозных врагов, они в совершенстве владели тайными операциями - убийствами и шпионажем."
 avoid_bloodshed:3 "Избегать кровопролития"
 avoid_bloodshed_desc:3 "Хашашины предпочитали достигать целей без лишнего кровопролития. Когда было возможно, они обходились без массовых убийств, устраняя ключевые фигуры. Враги ордена знали об этом, и их часто удавалось склонить сперва попробовать дипломатию."
 ismailis_dar_al_hijra:3 "Исмаилиты Дар аль-хиджра"
 ismailis_dar_al_hijra_desc:3 "Наши крепости стали известны как убежище для людей нашей веры. Исмаилиты со всей округи бежали под защиту ордена в поисках безопасности."
 mountain_fortresses: "Горные крепости"
 mountain_fortresses_desc:3 "Знаменитые крепости хашашинов были спрятаны в горах, и осадить их было очень трудно. Даже если чужая держава завоёвывала провинцию, хашашины оставались в своих крепостях и сохраняли контроль из тени."
 dagger_and_a_note:3 "Кинжал и записка"
 dagger_and_a_note_desc:3 "Орден часто вёл дипломатию так: давал цели понять, что ей может быть причинён вред, если она не сделает мудрый выбор. Излюбленным способом было напугать вражеского полководца ночью, оставив кинжал и записку, и убедиться, что он проснётся перед самым уходом убийцы. Так полководец понимал, что орден с той же лёгкостью мог избавиться от смутьяна."
 murder_in_the_open:3 "Убийство на виду"
 murder_in_the_open_desc:3 "Страх был для хашашинов желанным орудием: убивая ключевых людей, они управляли местным населением врагов и не давали ему осмелиться на сопротивление. Проще всего это было сделать, совершив убийство в людном месте, например на рынке."
 revive_jihad_hassan:3 "Возродить джихад Хасана"
 revive_jihad_hassan_desc:3 "Хасан ибн Саббах, основатель хашашинов, считал, что они ведут джихад и защищают своих братьев. Мы должны возродить эту мысль, чтобы молодые люди стекались в наши армии на защиту ислама."

 knights_templar_ideas:3 "Идеи тамплиеров"
 knights_templar_ideas_start:3 "Традиции тамплиеров"
 knights_templar_ideas_bonus:3 "Амбиции тамплиеров"
 latin_rule:3 "Латинский устав"
 latin_rule_desc:3 "Латинский устав - документ из 72 статей, определяющих идеальное поведение рыцаря-тамплиера. Он охватывает всё: от религиозных аспектов, таких как пост, до самого дресс-кода ордена."
 letters_of_credit:3 "Кредитные письма"
 letters_of_credit_desc:3 "Путь паломника поистине тяжёл: разбойники и бандиты охотятся за ценностями беззащитных христиан. Орден призван защищать паломников, и одно из средств - принимать на хранение их ценности, выдавая взамен кредитное письмо. Так они становятся гораздо менее желанной целью на дорогах."
 assault_troops_of_the_crusades:3 "Штурмовые войска крестовых походов"
 assault_troops_of_the_crusades_desc:3 "Рыцари ордена всегда были на передовой крестовых походов и первыми бросались на врага. В одной легендарной битве 500 рыцарей-тамплиеров прорвали строй 26-тысячной армии Саладина."
 bank_of_europe:3 "Банк Европы"
 bank_of_europe_desc:3 "Наше несметное богатство сделало нас ростовщиками большинства королевских домов Европы. Мы поистине банк Европы!"
 the_templar_enterprise:3 "Предприятие тамплиеров"
 the_templar_enterprise_desc:3 "Ордену принадлежат земли и поместья и в Европе, и на Ближнем Востоке. Мы производим шерсть, ткани, вино и еду для всего мира. Теперь трудно куда-либо отправиться и не столкнуться с чем-нибудь, «сделанным в землях тамплиеров». Появились всевозможные шутки о том, что мы владеем всем миром, и тому подобная чепуха."
 the_supporting_infrastructure:3 "Вспомогательная инфраструктура"
 the_supporting_infrastructure_desc:3 "Всё начиналось как военный орден, но огромные богатства, собранные для содержания военной иерархии, потребовали от нас создать вспомогательную инфраструктуру для управления казной."
 crusader_traditions:3 "Традиции крестоносцев"
 crusader_traditions_desc:3 "Орден имеет давнюю традицию участия во всех крестовых походах, и это дало нам большое число ветеранов, видевших ужасы войны. Они по-прежнему готовы служить, и нам следует использовать их с толком."

 jewish_ideas:3 "Израильские идеи"
 jewish_ideas_start:3 "Израильские традиции"
 jewish_ideas_bonus:3 "Израильские амбиции"
 end_of_diaspora:3 "Конец диаспоры"
 end_of_diaspora_desc:3 "Долгое время народ Израиля жил рассеянным по Европе и Ближнему Востоку, но теперь, когда у нас есть собственное государство, этому наконец пришёл конец!"
 national_myths_restored:3 "Национальные мифы восстановлены"
 national_myths_restored_desc:3 "Теперь, объединившись, мы снова можем оглянуться на мифы, определяющие нашу культуру, и особенно возродить образ царя-воина Давида, чтобы укрепить нашу армию!"
 return_home:3 "Возвращение домой"
 return_home_desc:3 "Теперь, когда у еврейского народа есть то, что он может назвать домом, многие возвращаются в Иерусалим, и наша экономика и производство процветают с ростом населения."
 jewish_trade_tradition:3 "Еврейская торговая традиция"
 jewish_trade_tradition_desc:3 "У нас давняя традиция торговли по всему миру, от Шанхая до Рейкьявика. Радханиты - яркий пример этой славной традиции."
 jewish_banking:3 "Еврейское банковское дело"
 jewish_banking_desc:3 "Евреи издавна были ростовщиками в Европе, и нет смысла прекращать это теперь. Нам следует создать в нашем государстве настоящий банк."
 people_of_exile:3 "Народ изгнания"
 people_of_exile_desc:3 "Благодаря нашей истории мы привыкли к странствиям, и нашему народу довольно легко обживать новые земли."
 the_chosen_people:3 "Избранный народ"
 the_chosen_people_desc:3 "Евреи - избранный народ Божий, и по Его воле мы больше никогда не потеряем Израиль из-за наших старых врагов."

 karling_ideas:3 "Идеи Каролингов"
 karling_ideas_start:3 "Традиции Каролингов"
 karling_ideas_bonus:3 "Амбиции Каролингов"
 kings_of_europe:3 "Короли Европы"
 kings_of_europe_desc:3 "Каролингов часто называют отцами Европы, и на протяжении 100 лет они правили Западной и Центральной Европой."
 carolingian_grand_strategy:3 "Великая стратегия Каролингов"
 carolingian_grand_strategy_desc:3 "Карл Великий и его отец Пипин были известны стратегиями, рассчитанными на десятилетия, - отсюда и пошёл термин «великая стратегия»."
 military_obligations:3 "Военные повинности"
 military_obligations_desc:3 "Карл Великий возложил военные повинности на подданных своего государства, особенно на знать. Чем богаче вы были, тем больше воинов должны были выставлять для походов короля."
 retinue_regnum_francorum:3 "Дружина Regnum Francorum"
 retinue_regnum_francorum_desc:3 "Дружина Карла Великого, основа армии Франкии, была высококвалифицированным профессиональным войском, построенным по образцу старой римской военной школы."
 legacy_of_the_romans:3 "Наследие римлян"
 legacy_of_the_romans_desc:3 "Каролинги считали себя законными преемниками императоров Западной Римской империи."
 carolingian_renaissance:3 "Каролингское возрождение"
 carolingian_renaissance_desc:3 "Во время правления Карла Великого началась эпоха, известная как Каролингское возрождение, когда были возрождены забытые идеи и традиции Римской империи."
 tradition_of_war:3 "Традиция войны"
 tradition_of_war_desc:3 "Каролинги известны своими масштабными походами и военными успехами. Это род, выкованный в огне войны, и такое прошлое нелегко забыть."

 vajrayana_buddhism:3 "Единые верования"
 vajrayana_buddhism_desc:3 "Наш народ един в собственном уникальном взгляде на мир. Он направляет само наше управление и повседневную жизнь по привычным и ожидаемым образцам - от последнего крепостного до высшего ламы."
 way_of_virtue:3 "Путь добродетели"
 way_of_virtue_desc:3 "Всеобщее сострадание - основа духовной ориентации."
 potala_palace:3 "Дворец Потала"
 potala_palace_desc:3 "Строительство дворца Потала началось в 1645 году под руководством Лозанг Гьяцо. Возвышаясь на тысячу футов над дном долины в Лхасе, со стенами толщиной шестнадцать футов у основания, этот укреплённый дворец занимает внушительное положение. В его тринадцати этажах расположен центр управления, где более 1000 комнат, 10 000 святилищ и 200 000 статуй."
 way_of_ancients:3 "Путь древних"
 way_of_ancients_desc:3 "Ньингма, также известная как школа древних переводов, - старейшая школа мысли в Тибете, включающая мистицизм и местных божеств, общих с добуддийской религией бон. Исторически традиция ньингма уникальна среди школ тем, что её сторонники никогда не обладали политической властью, а потому её последователи по большей части были далеки от политических интриг Тибета и сосредоточились на аскезе, целибате и мистицизме. Тем не менее их присутствие воспитывает дисциплину в нашем обществе и поддерживает связь с нашими корнями."
 pale_earth:3 "Школа Бледной земли"
 pale_earth_desc:3 "Бледная земля, или школа сакья, получила название от необычного серого пейзажа холмов Понпори на юге Тибета близ Шигадзе, где в 1073 году Кхён Кончог Гьялпо (1034-1102) построил монастырь Сакья, первый монастырь этой традиции. Традиция сакья была основана в конце XI века Дрогми, знаменитым учёным и переводчиком, изучавшим науки в университете Викрамашила в Индии. Эта школа известна своей учёностью и тягой к наукам, а её колледжи взращивают самые пытливые умы Тибета."

 brotherhood_of_the_holy_sepulchre_ideas:3 "Идеи Братства"
 brotherhood_of_the_holy_sepulchre_ideas_start:3 "Традиции Братства"
 brotherhood_of_the_holy_sepulchre_ideas_bonus:3 "Амбиции Братства"
 ZZZ_the_brotherhood_long_game:3 "Умение восстанавливаться"
 ZZZ_the_brotherhood_long_game_desc:3 "Важно не то, что мы всегда побеждаем. Ни одна сила в мире, как бы могущественна она ни была, не остаётся непобеждённой. Важно уметь подняться после того, как тебя сбили с ног. Нас сбивали не раз, но по-настоящему не сломили никогда. Мы всегда восстанавливаемся и всегда возвращаемся."
 ZZZ_the_indefatiguable_brotherhood:3 "Неутомимое Братство"
 ZZZ_the_indefatiguable_brotherhood_desc:3 "С основания нашего ордена в 313 году наша миссия - защита всех Святых мест, находящихся под нашей юрисдикцией. Даже когда нас вынуждали бежать, мы всегда возвращались, готовые вновь исполнять свой священный долг. В этом мире нет силы, способной помешать нам выполнить своё предназначение."
 ZZZ_legacy_of_the_byzantines:3 "Наследие византийцев"
 ZZZ_legacy_of_the_byzantines_desc:3 "Наша история неразрывно связана с историей Римской империи и её государства-преемника, Византийской империи. В нашей истории было немало императоров, которые поддерживали нас и давали всё необходимое для выживания. Эта история подарила нашему государству давнюю традицию, которая, судя по всему, не прервётся в ближайшее время."
 ZZZ_brotherhood_conversion:3 "Миссия обращения"
 ZZZ_brotherhood_conversion_desc:3 "С самого начала нам поручено нести миру весть об Иисусе. Мы никогда не прекращали этого и не прекратим, пока жив хоть один член нашего ордена."
 ZZZ_universal_brotherhood:3 "Всеобщее братство"
 ZZZ_universal_brotherhood_desc:3 "Неважно, кто ты, важно, что ты делаешь. Наша политика - нести свет Иисуса массам, но мы никогда не считали разумным принуждать других менять образ жизни за пределами религии. Мы стремимся к той же всеобщей любви и пониманию, что и наш Господь."
 ZZZ_caravans_of_the_brotherhood:3 "Караваны Святых мест"
 ZZZ_caravans_of_the_brotherhood_desc:3 "Наша задача - обеспечить паломникам, совершающим зачастую опасный путь к Святым местам под нашей опекой, возможность идти без страха. Хотя мы этого не планировали, охраняемыми дорогами паломников стали пользоваться и торговые караваны, охотно платящие небольшую пошлину за безопасный проезд. Эти деньги, в свою очередь, идут на защиту ещё большего числа паломнических путей. Эта система выгодна всем!"
 ZZZ_churches_of_the_holy_sepulchre:3 "Великолепное строительство"
 ZZZ_churches_of_the_holy_sepulchre_desc:3 "Мы строили всё: от великолепных соборов до маленьких местных церквей. Затем нам приходилось строить их заново, когда их разрушали. Мы никогда не прекращали строить, чинить и восстанавливать. У нашего государства долгая история великолепного строительства - почему бы ей прерываться?"

 chosen_of_ashoka_ideas:3 "Идеи Ашоки"
 chosen_of_ashoka_ideas_start:3 "Традиции Ашоки"
 chosen_of_ashoka_ideas_bonus:3 "Амбиции Ашоки"
 ZZZ_major_edict_1:3 "Большой эдикт I"
 ZZZ_major_edict_1_desc:3 "Избыток церемоний противоречит стабильному и устойчивому обществу. Поэтому мы возродим древний эдикт империи Маурьев, запрещающий праздничные собрания. Кроме того, в соответствии с уважением нашего ордена к природе, мы запретим все жертвоприношения животных на наших землях. Всё это поможет нам построить более стабильное общество."
 ZZZ_major_edict_2:3 "Большой эдикт II"
 ZZZ_major_edict_2_desc:3 "Наш орден чтит память Ашоки и империи Маурьев. Недавно мы возродили второй Большой эдикт империи Маурьев, предписывающий обязательную заботу о больных людях и животных, строительство дорог и посадку деревьев. Наш орден принесёт процветание нашему государству!"
 ZZZ_protectors_of_india:3 "Стойкие защитники"
 ZZZ_protectors_of_india_desc:3 "Священная миссия нашего ордена гласит, что мы должны стоять насмерть против всех, кто принесёт смерть и разрушение на наши земли. Мы должны стоять твёрдо и защищать эти земли от любого, кто пожелает им зла, чего бы это ни стоило."
 ZZZ_major_edict_5:3 "Большой эдикт V"
 ZZZ_major_edict_5_desc:3 "Следуя эдиктам Ашоки, наш орден решил издать собственный Большой эдикт V, учредив своих махаматт, чьей задачей будет распространение нашей веры."
 ZZZ_major_edict_6:3 "Большой эдикт VI"
 ZZZ_major_edict_6_desc:3 "Чтобы обеспечить бесперебойную работу государства, наш орден вновь ввёл Большой эдикт VI империи Маурьев. Он гарантирует, что административные и деловые дела империи решаются быстро и эффективно. Кроме того, любые донесения махаматт могут быть доставлены прямо главе нашего ордена, если сочтены достаточно важными."
 ZZZ_major_edict_7:3 "Большой эдикт VII"
 ZZZ_major_edict_7_desc:3 "Наш орден решил восстановить Большой эдикт VII великой империи Маурьев при Ашоке. Мы призываем к согласию между всеми народами независимо от секты или культуры."
 ZZZ_men_to_protect_india:3 "Те, кто защищает невинных"
 ZZZ_men_to_protect_india_desc:3 "Долг каждого здорового мужчины нашей веры - явиться на службу в трудный час. Наш орден продолжает исполнять священный долг защиты невинных, и для этого мы набираем из населения тех, кто знает свой долг."

 children_of_dralha_ideas:3 "Идеи Детей Дралхи"
 children_of_dralha_ideas_start:3 "Традиции Детей Дралхи"
 children_of_dralha_ideas_bonus:3 "Амбиции Детей Дралхи"
 ZZZ_defend_the_motherland:3 "Защита родины"
 ZZZ_defend_the_motherland_desc:3 "Наш орден несёт священный долг защищать родину от иноземных захватчиков, чего бы это ни стоило лично нам. Мы укрепим оборону и не пропустим ни одного врага."
 ZZZ_resist_the_invader:3 "Сопротивление захватчику"
 ZZZ_resist_the_invader_desc:3 "Когда придёт враг - а это не «если», а «когда» - мы должны быть готовы. Каждый гражданин нашего государства должен быть готов драться за наше дело не на жизнь, а на смерть. Наш орден никогда не перестанет защищать правое и справедливое, и мы не падём."
 ZZZ_bon_prayer:3 "Молитва"
 ZZZ_bon_prayer_desc:3 "Молитва - один из трёх важнейших аспектов нашей веры. Члены нашего ордена посвящают молитве большую часть жизни, и мы призываем граждан поступать так же. Молитва очищает душу и раскрывает в людях лучшее."
 ZZZ_bon_diligence:3 "Усердие"
 ZZZ_bon_diligence_desc:3 "Усердие - один из трёх важнейших аспектов нашей веры. Наш орден высоко ценит усердие и следит за тем, чтобы проявившие его продвигались по службе. Хотя усердие обязательно лишь для членов ордена, мы стали хорошим примером для граждан, которые равняются на нас. Теперь и они делают упор на усердии и получили в награду невероятную производительность. Правителям других государств остаётся лишь с завистью смотреть на усердие наших граждан."
 ZZZ_bon_devotion:3 "Преданность"
 ZZZ_bon_devotion_desc:3 "Преданность - один из трёх важнейших аспектов нашей веры. Наш орден уделяет преданности особое внимание и ожидает, что каждый его член будет по-настоящему предан ордену и вере."
 ZZZ_bon_temple_castles:3 "Укреплённые монастыри"
 ZZZ_bon_temple_castles_desc:3 "Наш орден давно понял, что разделять монастыри и оборонительные укрепления - довольно глупая затея. Нет причин, по которым монастырь нельзя укрепить для отражения захватчиков, оставив его спокойным местом молитвы. Поэтому наши монастыри не только практичны, но и велики и искусно построены, на зависть всем. Двойное назначение также снижает расходы, ведь мы возводим и содержим лишь одно сооружение."
 ZZZ_monk_and_leader:3 "Воины-монахи"
 ZZZ_monk_and_leader_desc:3 "Наш орден в основном состоит из воинов-монахов, тех, кто принимает монашеские обеты, но при этом постоянно тренируется для боя. Эти люди - способные предводители, сведущие в теологии, философии и стратегии. Лучшего резерва кандидатов, чтобы привести наше государство к величию, и желать нельзя."

 cult_of_huitzilopochtli_ideas:3 "Идеи Уицилопочтли"
 cult_of_huitzilopochtli_ideas_start:3 "Традиции Уицилопочтли"
 cult_of_huitzilopochtli_ideas_bonus:3 "Амбиции Уицилопочтли"
 ZZZ_legacy_of_flowers:3 "Наследие цветочных войн"
 ZZZ_legacy_of_flowers_desc:3 "Раньше наш народ вёл войны с единственной целью - захватить врагов для принесения в жертву богам. Будущих жертв нужно было брать живыми, а значит, наши воины должны были проявлять высокую сдержанность, иначе рисковали навлечь гнев богов. Наш культ превратил эту сдержанность в важный урок. Каждый наш член дисциплинирован и способен выполнить любой приказ, каким бы трудным он ни был."
 ZZZ_will_of_the_gods:3 "Воля богов"
 ZZZ_will_of_the_gods_desc:3 "Такова воля богов, чтобы мы продолжали расширяться. Если мы хотим, чтобы боги были довольны, мы должны питать их кровью жертв. Теперь мы знаем, что кормить их нужно не так часто, как считалось раньше, но кормить их нужно кровью наших врагов. Чтобы добыть кровь врагов, мы должны идти на войну и брать их силой - сами они себя в жертву точно не предложат."
 ZZZ_permanent_godly_expansion:3 "Мандат богов"
 ZZZ_permanent_godly_expansion_desc:3 "Боги дали нам мандат продолжать экспансию на земли язычников. Мы знаем истину о богах, и скоро её узнают и все остальные."
 ZZZ_content_gods:3 "Насыщенные боги"
 ZZZ_content_gods_desc:3 "Наши жертвы поддерживают довольство богов и их расположение к нам. Наши воины сражаются с радостью, зная, что боги даруют им желанную победу."
 ZZZ_from_across_the_sea:3 "Из-за моря"
 ZZZ_from_across_the_sea_desc:3 "Мы родом не из этой земли. Император из-за моря послал нас сюда, чтобы покорить её во имя богов. Мы добились ошеломляющего успеха, и наш орден немало помог в подчинении этих дикарей. Однако мы не забыли своих корней и по-прежнему строим корабли, способные совершить долгое и опасное плавание обратно на родину."
 ZZZ_take_to_the_seas_again:3 "Вновь в море"
 ZZZ_take_to_the_seas_again_desc:3 "Наши предки приплыли к этим берегам издалека, чтобы утолить жажду богов, требовавших завоеваний. Этот зов слышен снова, ибо мы открываем земли в других далёких краях. И вновь нас призывают на корабли, чтобы отправиться к новым землям."
 ZZZ_aztec_trade_home:3 "Трансатлантическая торговля"
 ZZZ_aztec_trade_home_desc:3 "Как воплощение воли богов, наш культ находится на окраине мира науа. Тем не менее мы никогда не теряли связь с родиной, и торговля с ней оказалась необходимой для нашего дальнейшего успеха в этом Новом Свете - Европе, Африке и Азии."

 chosen_of_perkunas_ideas:3 "Идеи Избранных"
 chosen_of_perkunas_ideas_start:3 "Традиции Избранных"
 chosen_of_perkunas_ideas_bonus:3 "Амбиции Избранных"
 ZZZ_defenders_of_the_old_ways:3 "Защитники старых обычаев"
 ZZZ_defenders_of_the_old_ways_desc:3 "Наш священный долг - не допустить, чтобы иноземные державы захватили хоть пядь земли верных. Мы должны стоять твёрдо и не дрогнуть, защищая свой народ и уничтожая врагов прежде, чем они уничтожат нас."
 ZZZ_guard_the_coasts:3 "Защита побережья"
 ZZZ_guard_the_coasts_desc:3 "Мандат нашего ордена не ограничивается землями, что мы держим, - он распространяется и на наши берега. Никакие стены в мире не остановят решительный флот. Единственное решение - деревянная стена из наших собственных кораблей."
 ZZZ_builders_of_perkunas:3 "Строители Перкунаса"
 ZZZ_builders_of_perkunas_desc:3 "У нашего народа давняя история строительства. Правда, многое из построенного служило защите от иноземных захватчиков, но наш орден знает, что эти навыки можно применить и для другого. Великие храмы, большие торговые рынки, замки - всё это и многое другое можно возвести, используя навыки, накопленные за века."
 ZZZ_never_surrender:3 "Избранный народ"
 ZZZ_never_surrender_desc:3 "Наш народ избран богами, чтобы хранить верность старым обычаям. Наш орден неустанно трудится, чтобы это предназначение было исполнено. Даже если врагу удастся временно оттеснить нас, мы никогда не прекратим борьбу за возвращение того, что принадлежит нам!"
 ZZZ_stop_foreign_spies:3 "Тесные общины"
 ZZZ_stop_foreign_spies_desc:3 "Известно, что и наш орден, и наши подданные тесно связаны между собой. Даже в больших городах большинство людей знают друг друга. Чужаков узнают сразу, как бы хорошо они ни говорили на нашем языке. Эта сплочённость также резко снижает шансы предательства, ведь любое необычное поведение быстро замечают. Из-за этого проникнуть в наше государство невероятно трудно, а в наш орден - ещё труднее."
 ZZZ_the_chosen:3 "Избранные Перкунаса"
 ZZZ_the_chosen_desc:3 "Название нашего ордена не для красного словца. Каждый наш член был лично призван Перкунасом и готов умереть за него, если потребуется. Мы - избранный народ, который вечно будет защищать свою веру и обычаи."
 ZZZ_keep_out_the_invaders:3 "Оборона упреждающим ударом"
 ZZZ_keep_out_the_invaders_desc:3 "Наше государство вызывает зависть врагов. Наш орден трудится не покладая рук, защищая нашу землю и народ от жадных рук этих соседей. Пройдя через многие испытания, мы овладели искусством упреждающего удара. Враг не может сражаться, если он мёртв, не успев ничего сделать. Наши полководцы стали мастерами таких первых столкновений, обеспечивая неизменную безопасность нашего государства."

 followers_of_arjuna_ideas:3 "Идеи Арджуны"
 followers_of_arjuna_ideas_start:3 "Традиции Арджуны"
 followers_of_arjuna_ideas_bonus:3 "Амбиции Арджуны"
 ZZZ_dhananjaya:3 "Дхананджая"
 ZZZ_dhananjaya_desc:3 "Дхананджая, «Приносящий богатство», - одно из многих имён Арджуны. Наш орден стремится сравняться с ним в величии, а потому мы старались создать процветающее и хорошо управляемое государство."
 ZZZ_jishnu:3 "Джишну"
 ZZZ_jishnu_desc:3 "Джишну, «Торжествующий», - одно из многих имён Арджуны. У нашего ордена нет такого безупречного послужного списка, как у Арджуны, но мы старались возвращаться с триумфом чаще, чем нет."
 ZZZ_truth_of_arjuna:3 "Так заведено"
 ZZZ_truth_of_arjuna_desc:3 "Наше место во вселенной определяется в миг рождения, и долг каждого - принять эту судьбу и усердно исполнять роль, для которой он рождён."
 ZZZ_indian_trade:3 "Индийская торговля"
 ZZZ_indian_trade_desc:3 "Товарам, производимым в нашем государстве, завидуют страны всего мира. Наш орден понял этот спрос и поощряет местных торговцев отправляться за границу, чтобы привлечь больше торговли. С большими деньгами мы сможем сделать гораздо больше!"
 ZZZ_grand_temples:3 "Великие храмы"
 ZZZ_grand_temples_desc:3 "Часть наших обязанностей как военного ордена - охранять священные храмы нашей веры. Но то, что мы охраняем старые храмы, не значит, что мы не видим нужды в новых. Благодаря новым технологиям мы теперь можем строить более крупные и величественные храмы. Это также даст нашим строителям опыт, который они смогут применить в других проектах."
 order_of_saint_addai_ideas:3 "Идеи святого Аддая"
 order_of_saint_addai_ideas_start:3 "Традиции святого Аддая"
 order_of_saint_addai_ideas_bonus:3 "Амбиции святого Аддая"
 ZZZ_christians_of_the_east:3 "Христиане Востока"
 ZZZ_christians_of_the_east_desc:3 "Наш народ с давних пор хранит свет Христов на Востоке. Это нелёгкая задача, ведь нас часто окружает множество местных язычников. Однако мы научились обходить эту трудность и смягчать её, насколько возможно."
 ZZZ_kings_khans_emperors:3 "Дворы королей, ханов и императоров"
 ZZZ_kings_khans_emperors_desc:3 "Наших учёных почитают по всему миру. На протяжении многих лет наши люди украшали собой залы множества знатных особ, будь то графы, герцоги, короли, ханы или императоры. Мы относимся ко всем им с величайшим уважением, и они отвечают нам тем же."
 ZZZ_fight_until_the_end:3 "Сражаться до конца"
 ZZZ_fight_until_the_end_desc:3 "История наша была не самой счастливой. Когда-то наш народ был почти истреблён, развеян по ветру и едва держался за жизнь. Но из этого испытания мы вынесли лишь новую силу. Нас не уничтожить, и мы будем сражаться до последнего мужчины, женщины и ребёнка."
 ZZZ_underdog_nestorians:3 "Вечные аутсайдеры"
 ZZZ_underdog_nestorians_desc:3 "Хотя нас знают за упорство, это не всегда приводило к славе победителей. Кто-то мог бы обижаться на такое постоянное недооценивание, но мы обнаружили, что оно может быть весьма полезным. Иностранные державы, следуя привычному ходу мысли, на удивление охотно игнорируют наши успехи или считают их временными и случайными. Мы не стремимся их разубеждать, по крайней мере пока их земли не станут нашими."
 ZZZ_military_opportunities:3 "Военные возможности"
 ZZZ_military_opportunities_desc:3 "Общение со столькими разными народами и с Востока, и с Запада дало нам необычайный опыт сражений в самых разных условиях и с самыми разными родами войск. Мы научились не закрывать себе путей и быть как можно более гибкими."
 ZZZ_all_for_the_struggle:3 "Общая борьба"
 ZZZ_all_for_the_struggle_desc:3 "Когда страдает наше государство, страдает и наш народ. Мы обязаны защищать народ, но и народ обязан поддерживать нас. Люди знают: когда приходит война, они должны спрашивать себя, что могут сделать для страны."
 ZZZ_ideas_of_nations:3 "Технологии мира"
 ZZZ_ideas_of_nations_desc:3 "Мы повидали чудеса света. От Ирландии до Катая мы видели технологии множества стран и осознали, как важно никогда не отставать. Мы всегда должны искать следующее достижение, которое выведет нас вперёд среди равных. Мы не должны почивать на лаврах и считать, что изучили всё, ведь вселенная и её тайны бесконечны."
 army_of_light_ideas:3 "Идеи Света"
 army_of_light_ideas_start:3 "Традиции Света"
 army_of_light_ideas_bonus:3 "Амбиции Света"
 ZZZ_ride_of_the_light_brigade:3 "Всадники Света"
 ZZZ_ride_of_the_light_brigade_desc:3 "Многие рекруты нашего ордена происходят от степных кочевников, прекрасно знающих повадки лошадей. Благодаря им мы довели нашу кавалерию до уровня одной из лучших в мире. Наши Бригады Света врежутся во вражеские ряды и развеют их по ветру!"
 ZZZ_inquisition_of_light:3 "Инквизиция Света"
 ZZZ_inquisition_of_light_desc:3 "Наш орден гордится тем, что следует заветам своей веры. Куда бы мы ни пришли, мы несём с собой истину Света, чтобы поделиться ею с народом. Но порой народ отказывается внимать разуму и принять Свет. Чтобы бороться с этим, мы создали особую инквизиторскую силу, чья задача - следить, чтобы наши подданные шли путём Света."
 ZZZ_light_tithe:3 "Десятина Света"
 ZZZ_light_tithe_desc:3 "Долг каждого из наших граждан - жертвовать часть своих доходов нашему ордену, чтобы мы могли и дальше нести свет язычникам и еретикам всего мира. Этот долг не добровольный."
 ZZZ_light_always_shines:3 "Неугасимый Свет"
 ZZZ_light_always_shines_desc:3 "Наш орден не падёт никогда. Мы всегда будем нести свет нуждающимся. Мы не дрогнем и не подведём в своём священном долге."
 ZZZ_message_of_light:3 "Весть Света"
 ZZZ_message_of_light_desc:3 "Куда бы мы ни пришли, мы распространяем весть Света. В каждую страну мира отправляются наши дипломаты и неустанно трудятся, неся нашу весть и прославляя добродетели нашего ордена."
 ZZZ_into_the_fold_of_light:3 "Община Света"
 ZZZ_into_the_fold_of_light_desc:3 "Мы смотрим на своих подданных как на собственных детей, детей Света. Мы относимся ко всем одинаково и держим всех под одинаковым контролем."
 ZZZ_into_the_light:3 "В свет огня"
 ZZZ_into_the_light_desc:3 "Мы идём в свет. Мы не вздрагиваем и не колеблемся. Когда вспыхивают дула и воздух затягивает дымом, а путь нам освещают лишь вспышки выстрелов, мы вверяем себя свету и не отворачиваемся. Мы стоим в свете огня и идём сквозь бой, чтобы дожить до следующего сражения."
 bektashi_order_ideas:3 "Идеи бекташей"
 bektashi_order_ideas_start:3 "Традиции бекташей"
 bektashi_order_ideas_bonus:3 "Амбиции бекташей"
 ZZZ_wahdat_al_wujud:3 "Вахдат аль-вуджуд"
 ZZZ_wahdat_al_wujud_desc:3 "Мы верим в вахдат аль-вуджуд, «единство бытия». Все вещи в мире - это и Он, и не Он. Вуджуд - непостижимая и недоступная основа всего сущего. Лишь Бог есть истинный вуджуд, а всё остальное пребывает в небытии; так же и один лишь Вуджуд беспределен, тогда как всё прочее ограничено. Вуджуд - абсолютная, бесконечная, неограниченная реальность Бога, тогда как всё остальное остаётся относительным, конечным и ограниченным."
 ZZZ_bektashi_graves_of_the_sanints:3 "Могилы святых"
 ZZZ_bektashi_graves_of_the_sanints_desc:3 "Наш священный долг - поддерживать и охранять места погребения исламских святых, украсивших мир своим благочестием. Многие приходят со всего исламского мира, чтобы посетить эти места и почтить память святых. Побочным следствием стало расширение наших торговых возможностей, и хотя мы никогда не опустимся до того, чтобы наживаться на святых, мы не видим причин отвергать этот дар."
 ZZZ_dervish_alms:3 "Подаяния дервишей"
 ZZZ_dervish_alms_desc:3 "От тех, кто становится дервишем, ожидают обета бедности. Они отдают деньги нуждающимся и просят милостыню на улицах не для себя, а для тех, кому она нужнее. Будучи центральной частью нашего ордена, дервиши принесли с собой строгость и смирение."
 ZZZ_bektashi_initiation:3 "Насип"
 ZZZ_bektashi_initiation_desc:3 "Чтобы вступить в орден бекташей, нужно пройти посвящение (насип). Начинают с ашика - непосвящённого, проявившего интерес к ордену. После насипа человек становится мюхибом и может принять дальнейшие обеты, чтобы стать дервишем. Следующая ступень - баба (отец), способный давать духовное наставление. Выше бабы стоит халифе-баба, или деде (дед). Традиционно было двенадцать деде, старшим из которых был дедебаба (прадед). Дедебаба считался высшей властью в ордене бекташей."
 ZZZ_spiritual_outreach:3 "Духовное служение"
 ZZZ_spiritual_outreach_desc:3 "Наш путь требует тесного сотрудничества с другими. Действительно, перенимая обычаи и верования других, мы добились большого успеха в обращении нашего народа в свою веру. Это принесло и пользу в виде доброй репутации за рубежом: несмотря на нашу готовность сражаться за веру, когда это необходимо, мы показали себя понимающими и готовыми к сотрудничеству даже с теми народами, чьи верования сильно отличаются от наших."
 ZZZ_bektashi_heterodoxy:3 "Гетеродоксия"
 ZZZ_bektashi_heterodoxy_desc:3 "Мы не ограничиваем себя лишь обрядами и верованиями предков. Мы охотно принимаем местные традиции и обычаи и приспосабливаемся к ним. Порой приходится кое-что подправить, чтобы они не нарушали шариат, но это редко становится проблемой."
 ZZZ_bektashi_need_for_speed:3 "Быстрая защита"
 ZZZ_bektashi_need_for_speed_desc:3 "Порой нам приходится сражаться за свои убеждения, когда им угрожают чужеземные державы. В такие минуты решает скорость. Каждый потерянный миг - это ещё один потерянный клочок земли и ещё один убитый благочестивый последователь нашей веры. Со времён крестовых походов и до наших дней мы выдерживали испытание защитой своего народа. Не остановят нас и теперь."
 bulls_of_rishabha_ideas:3 "Идеи Быков"
 bulls_of_rishabha_ideas_start:3 "Традиции Быков"
 bulls_of_rishabha_ideas_bonus:3 "Амбиции Быков"
 ZZZ_jain_varna:3 "Варна"
 ZZZ_jain_varna_desc:3 "Именно Ришабха, первый тиртханкара, миллионы лет назад установил общественные классы варн, основанные на ремесле. Варны помогают нашему народу жить в безопасности, счастье и довольстве, ибо каждый знает своё место в мире. Независимо от расы, сословия и веры, у каждого есть своя варна, и каждый действует в её рамках, даже когда думает, что это не так."
 ZZZ_jain_asi:3 "Аси"
 ZZZ_jain_asi_desc:3 "Первое из шести главных занятий, аси - воинское ремесло. Хотя мы не любим убивать любое живое существо, мы признаём, что порой необходимо защищать себя. Те, кто лучше всех сведущ в этом, следуют искусству аси."
 ZZZ_jain_masi:3 "Маси"
 ZZZ_jain_masi_desc:3 "Второе из шести главных занятий, маси - искусство письма. Наш орден высоко ценит письменность и грамотность, и мы стараемся открывать школы по всем подвластным землям. Чтение и письмо несут гармонию и выражают страсть так, как иначе не выразить. Идеи и изобретения передаются из поколения в поколение и не теряются. Маси, возможно, одно из благороднейших занятий."
 ZZZ_jain_krishi:3 "Кришш"
 ZZZ_jain_krishi_desc:3 "Третье из шести главных занятий, кришш - земледелие. Это важное занятие на удивление часто упускают из виду другие народы, глядящие свысока на трудолюбивых земледельцев, дающих им пропитание. Наш орден знает лучше: именно благородный земледелец кормит государство, и без него все остальные занятия, сколь бы велики они ни были, перестали бы существовать."
 ZZZ_jain_vidya:3 "Видья"
 ZZZ_jain_vidya_desc:3 "Четвёртое из шести главных занятий, видья - знание. Мало что в этом мире важнее стремления к новым знаниям. Накопление знаний приносит пользу всем: новые приёмы земледелия помогают крестьянам, новые строительные методы помогают почти всем общинам, новые открытия в математике и науках углубляют наше понимание мира. Наш орден всячески поощряет благородное стремление к знаниям."
 ZZZ_jain_vanijya:3 "Ванидья"
 ZZZ_jain_vanijya_desc:3 "Пятое из шести главных занятий, ванидья - торговля и коммерция. Где есть люди, там неизбежна торговля, и наш орден поощряет занятия торговлей и коммерцией. Успешная и умело управляемая торговля приносит пользу всем сторонам и способствует согласию между всеми."
 ZZZ_jain_shilp:3 "Шилп"
 ZZZ_jain_shilp_desc:3 "Шестое из шести главных занятий, шилп - ремёсла. Мастера, занимающиеся шилпом, дают миру и то, что нам нужно, и то, чего нам хочется. Портные шьют нам одежду, сапожники делают обувь, защищающую наши ноги, скульпторы создают произведения искусства на радость всем. Наш орден позаботился о том, чтобы наше государство стало известным центром искусств, ибо мы понимаем, как важны ремесленники для человечества."
 ZZZ_cheap_gurus:3 "Аскеты и гуру"
 ZZZ_cheap_gurus_desc:3 "Наш орден, как яркий образец веры, естественным образом привлекает множество учёных аскетов и гуру. Эти мужчины и женщины не только прекрасно образованы, но и просят за свои услуги сущие гроши."
 ZZZ_vijaya:3 "Виджая"
 ZZZ_vijaya_desc:3 "Виджая, «Непобедимый», - одно из многих прозвищ Арджуны. Наши воины по отдельности не непобедимы, но как орден мы можем действовать сообща и быть достойными титула Арджуны. Вместе мы будем непобедимы!"
 knights_of_the_sun_ideas:3 "Идеи зунистских рыцарей"
 knights_of_the_sun_ideas_start:3 "Традиции зунистских рыцарей"
 knights_of_the_sun_ideas_bonus:3 "Амбиции зунистских рыцарей"
 ZZZ_all_shall_praise_the_sun:3 "Да славят все Солнце"
 ZZZ_all_shall_praise_the_sun_desc:3 "СЛАВЬТЕ СОЛНЦЕ!"
 ZZZ_the_sword_of_zun:3 "Мечи Зуна"
 ZZZ_the_sword_of_zun_desc:3 "Наш орден - меч Зуна. Мы несём Его правосудие Его врагам и неколебимо защищаем Его народ."
 ZZZ_zun_the_lawgiver:3 "Зун Законодатель"
 ZZZ_zun_the_lawgiver_desc:3 "Все истинные законы людей исходят к нам от Зуна. Наш орден подчиняется велениям Зуна и правит по Его закону, под Его законом."
 ZZZ_zun_the_bringer_of_light:3 "Зун, несущий свет"
 ZZZ_zun_the_bringer_of_light_desc:3 "Зун даёт миру свет. Вместе с ним Он приносит и жизнь, и смерть. Наш орден глубоко понимает эту истину и принимает её. Наши рыцари помогают нуждающимся, неся жизнь, но если кто-то окажется настолько глуп, чтобы противиться истине Зуна, наши рыцари так же быстро принесут смерть."
 ZZZ_greatness_of_zun:3 "Слава Зуна"
 ZZZ_greatness_of_zun_desc:3 "Слава Зуна слепит всякого, кто пытается взглянуть на Него. Его слава пребудет вовеки, и мы, Его верные слуги, понесём Его славу миру."
 ZZZ_fire_of_zun:3 "Пламя Зуна"
 ZZZ_fire_of_zun_desc:3 "Времена изменились, и наши рыцари более не сражаются во славу Зуна мечом, щитом и копьём. Теперь мы используем ружья и пушки. Движимые огнём, самим даром Зуна, мы используем это оружие, чтобы очистить мир от еретиков и язычников согласно нашей священной миссии."
 ZZZ_fire_of_zun_naval:3 "Пламя Зуна на море"
 ZZZ_fire_of_zun_naval_desc:3 "Нашу миссию распространять свет Зуна не остановит и не может остановить какая-то вода! Мы возьмём с собой ружья и пушки и покажем язычникам мира свет Зуна как на море, так и на суше."
 haruriyyah_ideas:3 "Идеи харурийцев"
 haruriyyah_ideas_start:3 "Традиции харурийцев"
 haruriyyah_ideas_bonus:3 "Амбиции харурийцев"
 ZZZ_legacy_of_oman:3 "Наследие морей"
 ZZZ_legacy_of_oman_desc:3 "Наш народ издавна славился морской мощью. Даже когда мы не могли бросить вызов врагам на суше, мы всегда могли бросить им вызов на море. Мы никогда не забывали эту историю и не забудем свой флот!"
 ZZZ_for_the_faithful:3 "Ради верных"
 ZZZ_for_the_faithful_desc:3 "Мы - истинные последователи Корана. Именно наши предки поняли, что он означает, и отвергли третейский суд между Али и Муавией. Муавия был лжецом и ложным халифом, а Али отказался от своих притязаний, когда согласился на третейский суд вопреки словам Корана. Мы единственные, кто остался верен истинной вере. Мы должны использовать своё положение, чтобы донести понимание до других народов мира."
 ZZZ_converting_the_other:3 "Нет судьи, кроме Бога"
 ZZZ_converting_the_other_desc:3 "Мы суровы к тем, кто выступает против нас, но это не значит, что мы безжалостные тираны. Мы понимаем, что других с юных лет обманывали. Избавиться от такой лжи нелегко, это может занять годы, но мы не оставим своей миссии, пока каждый язычник и еретик не прозреет."
 ZZZ_nomadic_traditions:3 "Наследие кочевников"
 ZZZ_nomadic_traditions_desc:3 "Как и большинство мусульман, наша история начинается с группы преимущественно кочевых народов. Хотя мы давно оставили этот образ жизни, мы не забыли преподанных им уроков. Наш народ овладел искусством верховой езды на лошадях и верблюдах, которое мы с успехом использовали против врагов. Мы продолжим чтить предков и совершенствовать мастерство в седле."
 ZZZ_bring_the_big_guns:3 "Крупная полевая артиллерия"
 ZZZ_bring_the_big_guns_desc:3 "Исторически нас не всегда было много. Поэтому нам приходилось учиться обходиться малым. Теперь, с появлением пушек, мы снова видим способ обходиться малым. Ведь враги, погибшие, не дойдя до нас, не смогут убить наших братьев по оружию."
 ZZZ_use_ships_to_trade_and_propagate:3 "Торговля и проповедь любой ценой"
 ZZZ_use_ships_to_trade_and_propagate_desc:3 "Наша морская империя начала простираться довольно далеко. Мы встречаем всё больше народов, которые даже не слышали о Мухаммаде. Наши миссионеры, нередко путешествующие вместе с купцами, усердно трудятся, распространяя его слово. Мы должны удвоить усилия в распространении и торговли, и веры. Почти наверняка мы понесём при этом потери, но нас это не остановит!"
 ZZZ_the_true_followers:3 "Истинный путь"
 ZZZ_the_true_followers_desc:3 "Многие не понимают истинного пути. Ничего страшного: мы-то его знаем и никогда не забудем. Наша единственная верность - Корану и сунне Мухаммада. Слишком многие привязывают себя к таким вещам, как родословные или труды сомнительной подлинности. Мы доверяем Корану и тому, что доказано как истина. Только мы признаём истинную веру, несущую спасение."
 immortals_ideas:3 "Идеи Бессмертных"
 immortals_ideas_start:3 "Традиции Бессмертных"
 immortals_ideas_bonus:3 "Амбиции Бессмертных"
 ZZZ_era_of_conversion:3 "Непрерывное обращение"
 ZZZ_mission_to_the_unknown:3 "Миссия в неизвестность"
 ZZZ_mission_to_the_unknown_desc:3 "Сам святой Антоний был известен тем, что уходил в пустыню и в неизвестность. Он выдерживал условия, которые убили бы многих людей послабее. Мы делаем всё возможное, чтобы почтить его память, и наш орден всегда высоко ценил аскезу. Но мы - орден, и у нас есть миссия. Мы не можем просто исчезнуть в пустыне; нет, мы должны идти в неизвестность, чтобы нести слово Божие. Мы пойдём в неизвестность и принесём там Благую весть тем, кто ещё не слышал её."
 ZZZ_capacity_for_more:3 "Пополнить ряды"
 ZZZ_capacity_for_more_desc:3 "Как военный орден, мы обязаны защищать наших верных братьев и сестёр. Мы не сможем этого делать, если у нас не хватит солдат, чтобы защитить их и отбросить врагов. Мы должны перестроить свои силы и пересмотреть бюджет, чтобы дать больше возможностей тем, кто захочет присоединиться к нам и защищать орден и его подопечных."
 ZZZ_coptic_gold:3 "Золотой опыт"
 ZZZ_coptic_gold_desc:3 "Наш орден благословлён историей, связанной с золотом. Веками наш орден имел дело с металлом, о котором мечтают столь многие, а порой и сам добывал его. Но сами мы используем его лишь для самых простых нужд. Будучи аскетическим орденом, мы не предаёмся роскоши и излишествам. Поэтому мы лучше многих других государств знаем, как управлять потоком золота и прочих драгоценностей. Мы умеем сдерживать себя, а умеренность ведёт к лучшей экономике."
 ZZZ_order_in_the_ranks:3 "Порядок в рядах"
 ZZZ_order_in_the_ranks_desc:3 "Наше государство стало большим и могущественным, особенно для монашеского ордена. Наши ряды выросли, и набор лучше некуда, но мы не можем позволить, чтобы приток новобранцев погубил нашу дисциплину. Мы должны следить, чтобы программы подготовки по всей стране соблюдали строгие стандарты и порядки. Мы не можем позволить врагам застать нас врасплох!"
 spirit_guardians_ideas:3 "Идеи Хранителей духов"
 spirit_guardians_ideas_start:3 "Традиции Хранителей духов"
 spirit_guardians_ideas_bonus:3 "Амбиции Хранителей духов"
 ZZZ_guardians_of_the_people:3 "Защитники народа"
 ZZZ_guardians_of_the_people_desc:3 "Наш орден был создан, чтобы защищать три вещи: наши традиции, наш образ жизни и наш народ. Последнее зачастую важнее всего, ведь мы должны твёрдо противостоять иноземным захватчикам, которые хотят изменить наши традиции и образ жизни, а также перебить наш народ. Поэтому наша задача - быть оплотом, непоколебимым перед всеми чужими державами. Мы не уклонимся от врага, мы встретим его лицом к лицу."
 ZZZ_guardians_of_trade:3 "Защитники торговли"
 ZZZ_guardians_of_trade_desc:3 "Наши обязанности стражей не ограничиваются гробницами и святынями, которые охраняет наш орден. Мы также обязаны защищать всех, кто входит в нашу землю без дурных намерений. Это паломники, купцы и путники. Им мы предлагаем нашу защиту, обеспечивая их безопасность и средства к существованию. То, что это ещё и повышает наш общий торговый потенциал, - лишь побочный эффект."
 ZZZ_guardians_of_spirit:3 "Хранители духов"
 ZZZ_guardians_of_spirit_desc:3 "Наша защита священных мест и родовых захоронений никогда не дрогнет. Наши собственные духи были испытаны в суровых обрядах посвящения нашего ордена, и каждый его член твёрд сердцем. Мы принимаем, что наши товарищи могут пасть, исполняя долг, но остаёмся сильны, зная, что их духи укрепят наш собственный и даруют нам победу."
 ZZZ_guardians_of_the_arts:3 "Защитники искусств"
 ZZZ_guardians_of_the_arts_desc:3 "Наш орден понимает важность искусств для сохранения местных обычаев и традиций. Благодаря этому многие члены нашего ордена стали известными художниками, скульпторами и архитекторами. Мы всегда будем покровителями искусств, даже для жителей других стран. Все творческие умы могут посетить наш орден."
 ZZZ_guardians_of_industry:3 "Защитники промышленности"
 ZZZ_guardians_of_industry_desc:3 "Есть те, кто нападает на молодые предприятия и технологии, называя их ненужными и противоречащими местной традиции. Наш орден, однако, понимает, что перемены - неотъемлемая часть любой культуры, а отказ от них ведёт к застою, а не к величию. Важно сохранять суть традиции, а не оставаться неизменным вечно. Поэтому мы поощряем наш народ пробовать новое и осваивать разные специальности."
 ZZZ_guardians_of_the_seas:3 "Защитники моря"
 ZZZ_guardians_of_the_seas_desc:3 "Стремясь защитить свой народ любой ценой, мы не можем забывать о безбрежном океане. Наш народ плавает на кораблях в самые разные уголки земного шара. Точно так же и люди приезжают в нашу страну по самым разным причинам на кораблях. Мы не можем позволить, чтобы им грозили ужасы пиратства или иностранное вмешательство. Мы должны выйти в море, чтобы продолжить свою миссию защитников!"
 ZZZ_guardians_of_all:3 "Защитники всех"
 ZZZ_guardians_of_all_desc:3 "Священным долгом нашего ордена всегда была защита народа. По мере того как мир менялся, а мы расширялись, мы поняли, что и наш мандат необходимо расширить. Рабство, некогда почти безобидная практика, стало ужасным злом. Давно прошли дни временного рабства: рабы в современном мире обречены на пожизненное услужение, которое передаётся их детям. Как орден мы больше не можем мириться с этой практикой. Рабство должно закончиться, и наш орден должен признать достоинство всех народов, независимо от происхождения."
 sons_of_kaleva_ideas:3 "Идеи калевичей"
 sons_of_kaleva_ideas_start:3 "Традиции калевичей"
 sons_of_kaleva_ideas_bonus:3 "Амбиции калевичей Перуна"
 ZZZ_large_order:3 "Большой орден"
 ZZZ_large_order_desc:3 "Мы - военный орден. Само по себе это не необычно, но необычно количество земель под нашим контролем. Наш орден должен не только соблюдать обеты, но и управлять огромными пространствами подвластных земель. Правда, не все они обязательно населены, но расстояния между поселениями - само по себе испытание. К счастью, мы выработали эффективную систему управления нашими землями."
 ZZZ_kalevan_trade:3 "Управление торговлей"
 ZZZ_kalevan_trade_desc:3 "Возможно, наш орден и не в самой гуще событий, но наше расположение на удивление удобно, чтобы заставить купцов идти через нас, если они хотят добраться до других уголков мира. Поэтому наш орден имеет на удивление большое влияние на то, куда направляется торговля."
 ZZZ_cannon_hunters:3 "От луков к пушкам"
 ZZZ_cannon_hunters_desc:3 "Умение эффективно пользоваться луком - сложный навык: нужно тщательно целиться и учитывать такие вещи, как падение стрелы и скорость ветра. С пушками то же самое, только они больше, быстрее и лучше. Наш былой опыт с луками действительно пригодился, когда наше государство начало оснащаться ружьями и пушками."
 ZZZ_convert_the_masses:3 "Обратить массы"
 ZZZ_convert_the_masses_desc:3 "Возможно, это не наш главный приоритет, но обращение подданных-язычников и еретиков всё же должно быть тем, на чём сосредоточится наш орден. Обучив больше наших членов богословским спорам, мы сможем расширить свои усилия по обращению подданных в истинную веру."
 ZZZ_vast_peoples:3 "Множество народов"
 ZZZ_vast_peoples_desc:3 "Обширные владения нашего ордена дали нам доступ к множеству людей с различными верованиями и образом жизни. Более того, наш орден охотно принимает этих людей, если они готовы следовать нашим обетам и соблюдать их. Это дало нашему государству доступ к широкому спектру талантов, из которых мы можем выбирать при необходимости."
 ZZZ_kalevan_expansion:3 "Расширение в неизведанное"
 ZZZ_kalevan_expansion_desc:3 "Наша миссия нести веру всем, с кем мы соприкасаемся, не прекращается из-за того, что земли не исследованы или населены дикарями. Наш долг - нести истину в эти края, невзирая на опасность."
 ZZZ_take_down_the_walls:3 "Снесите эти стены"
 ZZZ_take_down_the_walls_desc:3 "Наше государство довольно сильно вкладывалось в тяжёлую артиллерию, и это прекрасно окупилось. По мере роста нашего ордена мы обнаружили, что большинство государств ещё не осознали всего потенциала пушек ни в битвах, ни в осадах. К несчастью для них, мы осознали."
 warriors_of_perun_ideas:3 "Идеи перунцев"
 warriors_of_perun_ideas_start:3 "Традиции перунцев"
 warriors_of_perun_ideas_bonus:3 "Амбиции перунцев"
 ZZZ_best_warriors:3 "Истинные воины"
 ZZZ_best_warriors_desc:3 "Наш орден знает, что на самом деле делает человека воином. Нас не сковывают ложные представления, которых придерживаются многие другие страны; наши воины признаны лучшими в мире, и мы знаем почему. Мы позаботимся, чтобы так оставалось и впредь."
 ZZZ_warriors_of_unity:3 "Воины единства"
 ZZZ_warriors_of_conversion:3 "Воины-жрецы"
 ZZZ_warriors_of_conversion_desc:3 "Члены нашего ордена - не просто солдаты. Каждый из них должен хорошо знать наше богословие и быть готов защищать свою веру не только в кровавых войнах, но и в войнах слов."
 ZZZ_warriors_of_unity:3 "Воины единства"
 ZZZ_warriors_of_unity_desc:3 "В единстве - сила, и наш орден хорошо это знает. Одну стрелу легко сломать, но связку почти невозможно. Вместе мы стоим и вместе падаем."
 ZZZ_warriors_read_books:3 "Учёные воины"
 ZZZ_warriors_read_books_desc:3 "Наш орден твёрдо убеждён, что воин, не читающий книг, - никудышный воин. Воин должен всегда стремиться к самосовершенствованию, не только физическому, но и умственному. Мы сделали приоритетом поощрение передачи знаний внутри нашей страны."
 ZZZ_seasonal_warriors:3 "Сезонный воин"
 ZZZ_seasonal_warriors_desc:3 "Времена года и календари нашей веры чрезвычайно важны, и каждый член нашего ордена должен знать, когда что делать. Это выходит за рамки религиозных праздников и торжеств, которые необходимо соблюдать: каждый воин должен выбрать ремесло и заниматься им. Для этого решающее значение имеет время: земледелец должен сажать определённые растения в разное время, купцы должны быть готовы к определённым сезонам, а животноводы - знать, когда у каждого животного наступает течка."
 ZZZ_one_nation:3 "Воины единообразия"
 ZZZ_one_nation_desc:3 "Мы - единая, нераздельная нация. Наш орден ценит единообразие, и мы принесём его нашему народу. Каждый будет соблюдать надлежащие обряды, все будут следовать расписанию, установленному для них священными календарями! Неважно, как далеко вы от центра нашей страны, вы всё равно часть нашей нации."
 ZZZ_warriors_in_unison:3 "Воины в унисон"
 ZZZ_warriors_in_unison_desc:3 "Наш орден - не сброд, мы одна из самых организованных и дисциплинированных сил в мире! Любой противник, желающий встретиться с мощью наших армий, должен быть готов сражаться до конца, ибо наши воины всегда наготове."
 zealots_ideas:3 "Идеи зелотов"
 zealots_ideas_start:3 "Традиции зелотов"
 zealots_ideas_bonus:3 "Амбиции зелотов"
 ZZZ_free_from_invaders:3 "Отпор захватчикам"
 ZZZ_free_from_invaders_desc:3 "Мы никогда не терпели и не будем терпеть захватчиков. Мы будем защищать свою землю до последнего ребёнка, и долг каждого еврея - сделать всё возможное, чтобы уничтожить всякого, кто попытается удержать то, что по праву принадлежит нам."
 ZZZ_our_own_zealot_destiny:3 "Наша собственная судьба"
 ZZZ_our_own_zealot_destiny_desc:3 "Слишком долго наш народ был вынужден трудиться на благо других. Хуже того, его преследовали за успех. Мы же будем вознаграждать тяжкий труд нашего народа; больше успех не будет награждаться предательством!"
 ZZZ_zealot_revolts:3 "Восстания зелотов"
 ZZZ_zealot_revolts_desc:3 "Мы знаем, каково это - жить под властью чужой державы и подвергаться гонениям лишь за то, кто мы есть. Мы не можем допустить, чтобы это случилось с другим народом! К счастью, мы кое-что смыслим в восстаниях и охотно поделимся этими знаниями с нашими угнетёнными соседями."
 ZZZ_protect_the_coasts:3 "Защитим наши берега"
 ZZZ_protect_the_coasts_desc:3 "Наш священный долг - защищать еврейский народ от иноземных захватчиков, чтобы больше никогда не было диаспоры. Мы не сможем этого делать, если не защитим свои берега от захватчиков с моря. Мы должны выйти в море и уничтожить тех, кто попытается высадиться на нашей священной земле!"
 ZZZ_jewish_foreign_contacts:3 "Связи за рубежом"
 ZZZ_jewish_foreign_contacts_desc:3 "При многих дворах мира есть евреи, которые нередко выполняют важные поручения для страны. К счастью, мы знаем их родственников и можем при необходимости связаться с ними и с их нанимателями. Это дало нам впечатляющий дипломатический корпус, который зачастую даже формально не находится в нашей стране!"
 ZZZ_zealot_purity:3 "Чистота дела"
 ZZZ_zealot_purity_desc:3 "Мы не можем позволить, чтобы наши нравы и традиции были подорваны. Мы всегда будем неуклонно сражаться с иноземными захватчиками, что бы они ни обрушили на нас! Мы не можем позволить слабым вождям оставаться у власти: они либо возьмутся за ум, либо останутся без должности."
 ZZZ_zealot_commerce:3 "Осторожная коммерция"
 ZZZ_zealot_commerce_desc:3 "Торгуя с зарубежными странами и собирая богатства собственной земли, мы должны следить, чтобы всё не вышло из-под контроля. Многие семьи нашей страны занимались банковским делом в прошлом, и потому мы знаем риски инфляции и плохой экономики. Мы сделаем всё возможное, чтобы избежать ситуаций, вынуждающих нас раздувать денежную массу, и будем неустанно работать, чтобы инфляция была как можно ниже."
 FAP_ideas:3 "Идеи фратичелли"
 FAP_ideas_start:3 "Традиции фратичелли"
 FAP_ideas_bonus:3 "Амбиции фратичелли"
 ZZZ_little_brethren:3 "Малые братья"
 ZZZ_little_brethren_desc:3 "Мы следуем учению святого Франциска Ассизского, соблюдаем строгие обеты бедности и помогаем всем нуждающимся. Эта верность порождает доверие и признание среди других государств."
 ZZZ_true_christians:3 "Истинные христиане"
 ZZZ_true_christians_desc:3 "Пока Церковь не была очищена, она долгое время пребывала во грехе, полная бессмысленной роскоши и алчности. Мы вернули Церковь к её истокам и сосредоточились на том, что действительно важно."
 ZZZ_defenders_of_the_faith:3 "Защита веры"
 ZZZ_defenders_of_the_faith_desc:3 "Как правило, мы избегаем насилия, предпочитая дипломатию. Однако наши соседи не всегда разделяют эту веру, и мы оказывались втянуты в войну, даже когда не желали её. Но когда нас вынуждают вступить в бой, мы сражаемся, твёрдо зная, что Господь на нашей стороне."
 ZZZ_beauty_in_simplicity:3 "Простота"
 ZZZ_beauty_in_simplicity_desc:3 "Мы не тратим время на громадные сооружения, господствующие над небом, и не платим безумных денег за керамику, витражи или гобелены. Места богослужения предназначены для восхваления величия Господа, а не величия Церкви. Наши здания функциональны и недороги, нам не нужно никого впечатлять."
 ZZZ_love_thy_neighbor:3 "Возлюби ближнего своего"
 ZZZ_love_thy_neighbor:3 "Господь заповедал нам любить друг друга. Нам не следует тратить время на споры о том, какой образ жизни лучше. Пока люди любят Господа всем сердцем и всей душой, неважно, как они проживают свои повседневные дни."
 ZZZ_a_loving_hand:3 "Любящая рука"
 ZZZ_a_loving_hand_desc:3 "Мы относимся к своим подданным как можно лучше, требуя с них лишь то, что они могут себе позволить. Другие государства могут смотреть на нас с недоверием, но у нас, похоже, никогда не бывает ни восстаний, ни проблем, свойственных другим. Возможно, этим недоверчивым правителям стоило бы больше учиться у Царя царей и меньше слушать своих алчных казначеев."
 ZZZ_spread_the_word:3 "Нести Благую весть"
 ZZZ_spread_the_word_desc:3 "Наш священный долг - нести слово Господне миру. Мы не успокоимся, пока весь мир не узнает о Его славе и сострадании. Все, кого можно спасти, должны быть спасены!"
 ASY_ideas:0 "Ассирийские идеи"
 ASY_ideas_start:0 "Ассирийские традиции"
 ASY_ideas_bonus:0 "Ассирийские амбиции"
 ZZZ_assyrian_bowmen:0 "Ассирийские лучники"
 ZZZ_assyrian_bowmen_desc:0 "Ассирийские лучники, знаменитые с древности и долго служившие в легионах чужеземных завоевателей, теперь сражаются за свою родину"
 ZZZ_forced_resttlement:0 "Принудительное переселение"
 ZZZ_forced_resttlement_desc:0 "Чтобы предотвратить восстания против нашей власти, нам следует вдохновиться примером предков и принудительно переселять покорённых врагов по всему нашему Королевству"
 ZZZ_banks_of_tigris:0 "Земля двух рек"
 ZZZ_banks_of_tigris_desc:0 "Великие реки, определяющие нашу землю, - Тигр и Евфрат - слишком долго оставались в забвении. Восстановим же великие ирригационные системы, первопроходцами которых были наши предки, и принесём богатство всем"
 ZZZ_learn_from_babylon:0 "Учиться у Вавилона"
 ZZZ_learn_from_babylon_desc:0 "Хотя иметь вассальные государства - дипломатическая необходимость, падение Ниневии от рук наших номинальных вассалов нельзя забывать никогда"
 ZZZ_rebuild_the_cities:0 "Отстроить города"
 ZZZ_rebuild_the_cities_desc:0 "Чтобы доказать, что мы не пережиток прошлого, жизненно важно модернизировать и восстановить наши древние города: Ниневия, Вавилон и Ашшур должны вновь восстать из пепла"
 ZZZ_restore_the_library_of_nineveh:0 "Восстановить Ниневийскую библиотеку"
 ZZZ_restore_the_library_of_nineveh_desc:0 "Наше наследие - это не только война, но также литература и высокое искусство. Вернём же всё это и восстановим всё, что было разграблено и украдено"
 ZZZ_nineveh_falls_no_more:0 "Четыре угла восстановлены"
 ZZZ_nineveh_falls_no_more_desc:0 "В древности считалось, что Месопотамия ограничена четырьмя углами, внутри которых заключён весь цивилизованный мир. Хотя мир за её пределами развивался в наше отсутствие, то, что мы здесь отстроили, бесценно, и мы больше никогда не падём."
 anatolian_beyliks_ideas:3 "Турецкие идеи"
 anatolian_beyliks_ideas_start:3 "Турецкие традиции"
 anatolian_beyliks_ideas_bonus:3 "Турецкие амбиции"
 ZZZ_era_of_conversion_desc:3 "Наш орден стремится исправить ошибки предков. Больше никогда мы не будем столь беспечны, чтобы не нести весть Зороастра массам. Мы должны нести его слово всем, кто готов слушать, начиная с собственного населения. Больше никогда какой-то пророк из захолустья не будет угрожать нашему образу жизни!"
 ZZZ_immortal_diaspora:3 "Преимущество неразрывной диаспоры"
 ZZZ_immortal_diaspora_desc:3 "Когда наших предков изгнали из родных домов в дальние края, они принесли с собой свою веру. Даже теперь, спустя сотни лет, они не утратили её. Несмотря на то что они чужаки в чужой стране, многие из наших рассеянных родичей стали богатыми купцами или важными чиновниками. Мы можем использовать эти связи, чтобы максимально расширить торговлю с землями, где живут наши родичи."
 ZZZ_expand_the_immortal_ranks:3 "Бесконечные ряды"
 ZZZ_expand_the_immortal_ranks_desc:3 "Хотя мы больше не ограничиваем себя ровно десятью тысячами человек, как когда-то, мы, возможно, отвергли слишком много потенциальных рекрутов. Все, кто желает вступить в наши ряды, должны хотя бы получить шанс доказать свою ценность. Когда в наших рядах больше людей, мы никогда не падём, ведь каждого павшего тут же заменит другой! Мы вечны, бессмертны, неотвратимы."
 ZZZ_expand_the_rites:3 "Вечные обряды"
 ZZZ_expand_the_rites_desc:3 "Мы весьма преуспели в том, чтобы убеждать других хотя бы выслушать наших проповедников. Но наш орден распространяет веру не так быстро, как мы думали. После пересмотра мы решили, что при небольшом перераспределении ресурсов мы могли бы проводить обряды посвящения по всей стране, а не сосредоточиваться на одной области за раз."
 ZZZ_immortal_sameness:3 "Бессмертное единообразие"
 ZZZ_immortal_sameness_desc:3 "Наш орден ценит единообразие не только среди своих членов, но и среди народа. Мы должны сделать всё возможное, чтобы донести наши традиции до подданных и показать им, насколько они превосходны."
 ZZZ_the_eternal_fires:3 "Вечные огни"
 ZZZ_the_eternal_fires_desc:3 "Наш орден хранит некоторые из вечных огней Зороастра, оберегаемые сотни лет."
 ZZZ_the_whites_of_their_eyes:3 "Бесконечный марш"
 ZZZ_the_whites_of_their_eyes_desc:3 "Наши люди знают свой долг. Солдаты гибнут на войне, это неизбежно. Когда солдат погибает, ты занимаешь его место - молча и без вопросов. Цепь командования останется ясной и непрерывной до последнего рядового. Наш орден идёт сквозь вражеский огонь, пока мы не увидим белки их глаз. Тогда, и только тогда мы откроем огонь в упор."
 knights_of_calatrava_ideas:3 "Идеи калатравцев"
 knights_of_calatrava_ideas_start:3 "Традиции калатравцев"
 knights_of_calatrava_ideas_bonus:3 "Амбиции калатравцев"
 ZZZ_calatravan_vows:3 "Цистерцианские обычаи"
 ZZZ_calatravan_vows_desc:3 "Помимо трёх религиозных обетов, наш орден соблюдает и строгие правила, идущие дальше. Все члены ордена должны хранить молчание в трапезной, дормитории и молельне; воздерживаться от пищи четыре дня в неделю, помимо нескольких постных дней в году; читать установленное число «Отче наш» в каждый час службы; спать в доспехах; носить в качестве парадного одеяния белую цистерцианскую мантию с алым крестом-лилией."
 ZZZ_calatravan_royal_intrigue:3 "Королевские интриги"
 ZZZ_calatravan_royal_intrigue_desc:3 "Наша власть и влияние не остались незамеченными могущественными семьями мира. Многие пытаются протолкнуться в наши ряды и назначить наших лидеров. Это постоянное вторжение в нашу автономию означает, что мы научились неплохо защищаться от чужих происков."
 ZZZ_calatravan_papal_favour:3 "Милость папы"
 ZZZ_calatravan_papal_favour_desc:3 "Наш орден давно поддерживает добрые отношения с Папой. Он признаёт наш священный долг и поддерживает и его, и нас."
 ZZZ_calatravan_aggression:3 "Наследие Реконкисты"
 ZZZ_calatravan_aggression_desc:3 "Наш орден сыграл основополагающую роль в давней цели изгнания мавров с Иберийского полуострова. Наш орден удерживал крепости, которые никто другой не хотел удерживать, наши войска возглавляли штурмы, на которые никто другой не осмеливался. Наши силы были одними из крупнейших и сильнейших в Европе, и мы этого не забыли."
 ZZZ_calatravan_rule:3 "Устав доброго христианина"
 ZZZ_calatravan_rule_desc:3 "Есть те, кто эксплуатирует своих крестьян, выжимая из них всё до последнего. Но мы, с нашей мягкой рукой и благочестивой заботой о бедных, умудряемся намного превзойти продуктивность этих корыстных тиранов. Мы доказали, что Бог вознаграждает тех, кто хорошо относится к своим подданным."
 ZZZ_light_to_heathens:3 "Несение света Христова"
 ZZZ_light_to_heathens_desc:3 "Когда мы идём на врагов, мы делаем это не из ненависти к ним, а из любви к Богу. Наш долг - нести Его слово, куда бы мы ни пришли, и распространять его как можно дальше."
 ZZZ_the_tireless_calatravans:3 "Неутомимые"
 ZZZ_the_tireless_calatravans_desc:3 "Наш орден сохранял дисциплину многие годы, пережив многие другие ордена, которые исчезли или поддались давлению светского мира. Наш же орден помнит свои корни, и мы никогда не уступим и никогда не сдадимся."
 knights_of_santiago_ideas:3 "Идеи сантьягцев"
 knights_of_santiago_ideas_start:3 "Традиции сантьягцев"
 knights_of_santiago_ideas_bonus:3 "Амбиции сантьягцев"
 ZZZ_cross_of_st_james:3 "Честь без пятна"
 ZZZ_cross_of_st_james_desc:3 "Мы стремимся воплощать добродетели святых, и наш орден показывает эту преданность через свои атрибуты. Наше знамя и плащ несут Крест Христов, а три лилии олицетворяют «Честь без пятна» - черту характера святого Иакова."
 ZZZ_canons_of_augustine:3 "Устав святого Августина"
 ZZZ_canons_of_augustine_desc:3 "В отличие от многих других военных духовных орденов, мы не следуем строгим правилам бенедиктинцев Ситo, а придерживаемся более мягкого устава святого Августина. Это дало нам двойную роль - и госпитальеров, и рыцарей военного ордена. Мы защищаем паломников, идущих к святыням, но также помогаем управлять многими приютами. Это, наряду с правом вступать в брак, создало нам превосходную репутацию мягкости и справедливости ко всем."
 ZZZ_galleys_of_santiago:3 "Галеры Сантьяго"
 ZZZ_galleys_of_santiago_desc:3 "Наша миссия нередко требует выходить в море. Однако многие не горят желанием добровольно идти на флот. Поэтому мы установили правило: все желающие вступить в орден должны провести не менее шести месяцев на галерах нашего ордена. Это не только решило проблему с моряками, но и дало нам запас опытных гребцов на случай нужды."
 ZZZ_santiago_encomienda:3 "Рыцарские энкомьенды"
 ZZZ_santiago_encomienda_desc:3 "Чтобы удовлетворять нужды нашего ордена, каждый рыцарь-командор получил энкомьенду - административный и экономический центр для своих владений. Через свои энкомьенды рыцари-командоры могут собирать доходы от налогов, пошлин и десятины. Каждый рыцарь-командор отвечал за вооружение себя, своих рыцарей и ополчения копейщиков на случай, когда он понадобится ордену."
 ZZZ_nobility_of_santiago:3 "Благородный орден"
 ZZZ_nobility_of_santiago_desc:3 "Исторически вступить в орден Сантьяго было относительно легко, но после середины XIII века это стало труднее. Кандидат, желавший вступить в орден, должен был доказать в четырёх последних поколениях, что он, его родители и деды были благородного происхождения по крови, а не по привилегии, и никогда не занимались ручным или промышленным трудом. Также претендент не мог происходить от евреев, мусульман, еретиков или обращённых в христианство, как бы далеко ни было это родство. Со временем король и Совет орденов отменили многие из этих требований."
 ZZZ_santiago_bullarium:3 "Буллы Сантьяго"
 ZZZ_santiago_bullarium_desc:3 "С момента основания Папа счёл нужным даровать нашему ордену множество милостей. Нашим членам с самого начала разрешалось вступать в брак, и вскоре мы получили все привилегии и изъятия других монашеских орденов."
 ZZZ_santiago_true_calling:3 "Наше истинное призвание"
 ZZZ_santiago_true_calling_desc:3 "Правда, мы военный орден и сражаемся, когда должны. Но это наименьший из наших долгов; гораздо важнее заботиться о больных, помогать бедным и нести миру слово Иисуса. Мы сражаемся мечами, когда необходимо, но предпочитаем сражаться словами."
 lords_of_the_sky_ideas:3 "Идеи Владык неба"
 lords_of_the_sky_ideas_start:3 "Традиции Владык неба"
 lords_of_the_sky_ideas_bonus:3 "Амбиции Владык неба"
 ZZZ_shock_and_awe:3 "Шок и трепет"
 ZZZ_shock_and_awe_desc:3 "Когда мы мчимся на врага, нет ни одного вражеского солдата, который не желал бы оказаться где угодно на земле, только не здесь. Мы бьём сильно, быстро и не отступаем. Все содрогнутся пред нашей мощью!"
 ZZZ_lords_of_the_caravan:3 "Владыки караванов"
 ZZZ_lords_of_the_caravan_desc:3 "Караваны движутся силой своих животных. А у нас как раз лучшие в мире лошади, которых веками тщательно разводили, чтобы довести до предела их силу и выносливость. Благодаря этому наше государство стало обязательным пунктом для многих караванов и начинающих купцов."
 ZZZ_horse_lords:3 "Владыки коней"
 ZZZ_horse_lords_desc:3 "Наш орден вышел из степей, и мы никогда не забывали своих истоков. Члены нашего ордена практически живут на лошадях, и нет ни одного, кто не умел бы стрелять из лука или рубить мечом с седла. Наших всадников по праву страшатся все народы мира, ведь мы берём стратегии тех, кто был до нас, и доводим их до совершенства."
 ZZZ_the_sprawling_sky:3 "Раскинувшееся небо"
 ZZZ_the_sprawling_sky_desc:3 "Мы всего лишь военный орден, но наше государство начало становиться столь же необъятным, как небо. К счастью, нам привычны такие проблемы. Нам не составит большого труда перераспределить административные возможности так, чтобы максимально усилить контроль, не растягивая себя сверх меры."
 ZZZ_or_else:3 "Страх отказа"
 ZZZ_or_else_desc:3 "Если враг примет наши великодушные условия мира, мы отнесёмся к нему с величайшей учтивостью. Враг, хорошо сражавшийся и сдавшийся, когда очевидно проиграл, заслуживает уважения. Но если кто-то совершит ошибку и откажется от наших условий, мы позаботимся, чтобы правитель и его государство пожалели об этом. Наш орден не терпит глупцов, не понимающих, что они проиграли. Если они не сложат меч, то мы сложим его за них, предпочтительно через их тело."
 ZZZ_lords_abroad:3 "Владыки торговли"
 ZZZ_lords_abroad_desc:3 "Хотя наше государство больше всего известно непревзойдёнными конями, это далеко не единственное, что оно может предложить. По мере того как всё больше государств узнавали об этом, спрос на наши товары вырос. Это создало огромные возможности для купцов и предпринимателей по всей стране. Даже некоторые члены нашего ордена втянулись в это дело!"
 ZZZ_modern_cavalry:3 "Современная кавалерия"
 ZZZ_modern_cavalry_desc:3 "Времена меняются, и мы не можем позволить себе отстать. Ружьё заменило лук во всех военных делах, кроме самых узких. Есть прорицатели, предрекающие гибель кавалерии, но мы знаем лучше. Нужно модернизировать кавалерию, чтобы она не отстала в этой гонке вооружений. Как наши предки овладели искусством стрельбы из луков с конской спины, так и мы овладеем искусством стрельбы из ружей с конской спины!"
 myrmidons_ideas:3 "Идеи мирмидонян"
 myrmidons_ideas_start:3 "Традиции мирмидонян"
 myrmidons_ideas_bonus:3 "Амбиции мирмидонян"
 ZZZ_legacy_of_the_legions:3 "Наследие легионеров"
 ZZZ_legacy_of_the_legions_desc:3 "Римские легионы совершили переворот в способах ведения войны. Наш орден берёт имя от храбрых воинов Ахилла, но организацию и дисциплину мы заимствуем у римских легионов."
 ZZZ_hellenic_exceptionalism:3 "Эллинская мысль"
 ZZZ_hellenic_exceptionalism_desc:3 "Не будет преувеличением сказать, что римляне и греки создали западную цивилизацию. Эта цивилизация стоит на плечах великих мыслителей Рима и Греции: от Сократа до Овидия великие люди античности учили, что разум всегда должен оставаться открытым. Наш орден принимает этот урок всерьёз и охотно приветствует новые идеи."
 ZZZ_mare_nostrum:3 "Mare Nostrum"
 ZZZ_mare_nostrum_desc:3 "Наш орден нельзя ограничить сушей. Подобно римлянам в Пунических войнах, мы должны выйти в море и утвердить своё господство и там."
 ZZZ_myrmidon_taxes:3 "Эффективный сбор налогов"
 ZZZ_myrmidon_taxes_desc:3 "Любое государство живёт на налоги своих граждан. Мы можем быть военным орденом, но эта истина верна и для нас, как для любого другого государства. Мы использовали уроки прошлого, чтобы создать крайне эффективную систему сбора налогов, которой завидуют наши соседи."
 ZZZ_myrmidon_ranks:3 "Реформы мирмидонян"
 ZZZ_myrmidon_ranks_desc:3 "Проверив силы нашего ордена, мы обнаружили, что упускаем огромное число потенциальных рекрутов из-за несовершенных стандартов и плохой подготовки вербовщиков. С учётом этих выводов мы реорганизовали нашу армию, чтобы лучше использовать своё положение и пополнять ряды."
 ZZZ_myrmidon_building:3 "Эллинская слава"
 ZZZ_myrmidon_building_desc:3 "Греки строили могучие храмы и статуи, которым завидовал мир. Римляне прокладывали дороги по всей империи и возводили сооружения, которые сегодня и представить трудно. Будучи хранителями этой истории, наш орден сделал приоритетом продолжение греческих и римских традиций строительства и развития, где только возможно."
 ZZZ_legacy_of_alexander:3 "Наследие Александра"
 ZZZ_legacy_of_alexander_desc:3 "Говоря о великих людях истории, нельзя не упомянуть Александра Великого, который разгромил всех, кто стоял на его пути, и построил империю, не превзойдённую по размеру до самих римлян. Наш орден гордится тем, что продолжает его традицию расширения, неся с собой цивилизацию!"
 order_of_saint_anthony_ideas:3 "Идеи святого Антония"
 order_of_saint_anthony_ideas_start:3 "Традиции святого Антония"
 order_of_saint_anthony_ideas_bonus:3 "Амбиции святого Антония"
 ZZZ_coptic_defenders:3 "Коптские защитники"
 ZZZ_coptic_defenders_desc:3 "Сотни лет наш орден был оплотом против вторжений мусульман. Мы одни защищали веру нашего народа, даже будучи отрезанными от братьев и сестёр на севере. В одиночку мы держались стойко и в одиночку продолжим держаться."
 ZZZ_go_far_copts:3 "Присутствие за рубежом"
 ZZZ_go_far_copts_desc:3 "Слухи о наших подвигах стали легендами даже в землях, далёких от наших. Когда наши купцы отправляются в путь, их всегда отводят в сторону и расспрашивают, правда ли то, что они слышали. Это привело к росту спроса на наших купцов. Даже если поначалу причина в наших рассказах, наши превосходные товары наверняка станут достаточной причиной, чтобы позволить нашим купцам остаться."
 ZZZ_order_in_every_town:3 "Капитул в каждом городе"
 ZZZ_order_in_every_town_desc:3 "Мы больше чем просто священный орден, мы государство, управляющее огромным числом народов. Это требует сотрудничества с местными властями и рассредоточения наших сил по стране. Основав капитульный дом в каждом городе, мы не только лучше управляем народом, но и обеспечиваем набор, необходимый для содержания стольких капитульных домов."
