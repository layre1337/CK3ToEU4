l_russian:
 HOLY_SITE_410_DESC:0 "Христианство пришло в Ирак в I веке благодаря апостолу Фоме, Мару Аддаю (Фаддею Эдесскому) и его ученикам Аггаю и Мари. Фома и Фаддей принадлежали к числу двенадцати апостолов."
 HOLY_SITE_535_DESC:0 "Известно, что кочинские евреи жили в Керале уже в I веке н. э., и арамееязычный иудей, такой как святой Фома из Галилеи, вполне мог тогда добраться до Кералы. Самым ранним известным источником, связывающим апостола с Индией, являются «Деяния Фомы», вероятно написанные в начале III века, возможно, в Эдессе."
 HOLY_SITE_445_DESC:0 "Между VI (553) и XI веками н. э. Мерв был центром восточносирийской митрополичьей провинции, сыгравшей ключевую роль в миссии несторианской церкви на восток по Шёлковому пути, в Туркестан и Китай. В 1221 году город открыл ворота захватчикам - монгольской орде; последовавшее разрушение оказалось катастрофическим. По свидетельствам хронистов, было истреблено всё население города (вместе с беженцами) - около миллиона человек."
 HOLY_SITE_2308_DESC:0 "Христианский собор состоялся в Эдессе уже в 197 году. В 232 году были написаны Сирийские деяния, якобы по случаю передачи эдесской церкви мощей апостола Фомы. Под властью Рима в Эдессе пострадало много мучеников: святые Шарбил и Барсамья при Декии; святые Гурия, Шамона, Габиб и другие при Диоклетиане. Христианские священники из Эдессы проповедовали в Восточной Месопотамии и Персии и основали первые церкви в державе Сасанидов. Аттила, епископ Эдесский, участвовал в Первом Никейском соборе (325)."
 HOLY_SITE_700_DESC:0 "Сианьская стела, также известная как Несторианская стела, свидетельствует, что Церковь Востока получила признание танского императора Тайцзуна благодаря усилиям христианского миссионера Алопена в 635 году. Согласно стеле, Алопен и его собратья-сирийские миссионеры прибыли в Китай из Дацинь (Восточной Римской империи) на девятом году правления Тайцзуна (635), привезя священные книги и образы. Стела была закопана в 845 году, вероятно, во время религиозных гонений, и вновь обнаружена лишь в 1625 году."
