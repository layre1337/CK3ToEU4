 ukko_desc:0 "Укко - важнейший бог финского язычества. Он бог грома и владыка небес."
 tapio_desc:0 "Тапио - бог охоты и владыка лесов."
 ahti_desc:0 "Ахти - владыка вод и бог рыболовства."
 mielikki_desc:0 "Миелики - богиня леса и охоты."
 akras_desc:0 "Акрас - бог земледелия и плодородия."
 tuoni_desc:0 "Туони - бог смерти и владыка подземного мира."
 perun_desc:0 "Перун - бог грома и верховный бог славянского пантеона."
 jarilo_desc:0 "Ярило - бог весны, плодородия и растительности."
 lada_desc:0 "Лада - богиня гармонии, любви и красоты."
 veles_desc:0 "Велес - бог земли, вод и подземного мира."
 svarog_desc:0 "Сварог - бог огня, которого иногда также называют богом кузнечного дела."
 svetovid_desc:0 "Четырёхглавый Световид - бог войны, плодородия и изобилия."
 perkunas_desc:0 "Перкунас - бог грома и неба, сын Диеваса."
 ausrine_desc:0 "Аушрине - богиня утренней звезды. Её часто связывают с красотой и юностью."
 saule_desc:0 "Сауле - богиня солнца. Её часто связывают с жизнью, плодородием и здоровьем."
 laima_desc:0 "Лайма - богиня удачи и судьбы. Она связана с деторождением, браком и смертью."
 gabija_desc:0 "Габия - богиня огня. Она же защитница дома и семьи."
 dievas_desc:0 "Диевас - верховный бог балтийской мифологии."
 tiwaz_desc:0 "Тиваз - бог войны и глава раннего германского пантеона."
 wodan_desc:0 "Водан, или Воданаз - бог поэтов, провидцев и магии. Его также связывают с охотой, войной и дарованием победы."
 dunar_desc:0 "Дунар, или Дунараз - бог грома и неба."
 frijjo_desc:0 "Фрийо - богиня любви и жена Водана."
 austro_desc:0 "Аустро - богиня зари и весны."
 fraujaz_desc:0 "Фраужаз - бог плодородия и процветания."
 amun_desc:0 "Амон - царь египетского пантеона, а также бог ветра."
 maat_desc:0 "Маат - богиня истины, равновесия, порядка и справедливости. Маат обеспечивает стабильность Египта."
 ra_desc:0 "Ра - бог солнца, связанный с соколом или ястребом."
 seth_desc:0 "Сет - бог беспорядка, насилия, хаоса и бурь."
 isis_desc:0 "Исида - идеальная мать и жена, защитница мёртвых и богиня детей."
 anubis_desc:0 "Анубис - шакалоголовый бог, связанный с мумификацией и загробной жизнью."
