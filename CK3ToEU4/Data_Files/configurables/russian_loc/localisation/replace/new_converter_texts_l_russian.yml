 west_african_pagan_reformed_cult:3 "Старейшинство"
 west_african_pagan_reformed_cult_desc:3 "Мы следуем путями наших сородичей, открывших нам высшие истины мироздания, и благодаря этому стали сильнее."
 tengri_cult:3 "Тенгри"
 tengri_cult_desc:3 "Мы следуем за Тенгри, владыкой неба и первым среди богов. Под его водительством мы овладели искусством верховой езды."
 baltic_cult:3 "Ромува"
 baltic_cult_desc:3 "Мы - защитники Пелкюнаса. Мы стоим твёрдо и непоколебимо во славу Диваса, Пелкюнаса и нашего народа. С их благословением мы никогда не ослабнем и не потерпим неудачи."
 finnish_cult:3 "Суоменуско"
 finnish_cult_desc:3 "Мы чтим животных нашей земли и умилостивляем их прародительниц, эмму, должными обрядами и ритуалами."
 slavic_cult:3 "Родноверие"
 slavic_cult_desc:3 "Мы верим в трёхъярусное мировое древо. Жертвы приносятся Перуну, Дажьбогу, Мокоши и Ладе, взирающим на древо сверху. Мы стараемся не забывать Велеса, который поддерживает всю конструкцию и заботится о мёртвых."
 zunist_cult:3 "Зунизм"
 zunist_cult_desc:3 "Мы следуем учению Зуна-Законодателя, который судит всех равно и справедливо. Нет ничего выше, чем быть справедливым, честным и добрым в глазах Зуна. Наш народ усердно трудится, чтобы соответствовать этим идеалам, а наши правители отвечают, если не оправдывают ожиданий Зуна."
 bon_cult:3 "Бон"
 bon_cult_desc:3 "Мы посвящаем себя молитве, усердию и преданности, чтобы воплотиться и достичь сутры, тантры и дзогчена. Наши дома укреплены защитой богов, для которых мы строим престолы в своих жилищах."
 hellenic_cult:3 "Эллинская"
 hellenic_cult_desc:3 "Мы чтим богов Олимпа и посвящаем себя тому, чтобы стать лучшими из людей."
 pagan_cult:3 "Паген"
 pagan_cult_desc:3 "Мы приняли тех, чьи верования отличаются от наших, переняли их обычаи и приносим жертвы их богам. Мы лишь стали сильнее."
 gnostic_cult:3 "Гностическая"
 gnostic_cult_desc:3 "Мы признаём, что материальный мир - ложное и ужасное творение, которым правит демиург. Мы ждём спасения от материального мира."
 yazidi_cult:3 "Езидская"
 yazidi_cult_desc:3 "Мы чтим Малак-Тавуса, первого из семи ангелов, спутника Адама, спасителя Авраама и избранного правителя Божьего. Через него мы обретаем спасение у Всевышнего."
 illyric_snake_cult:0 "Змей"
 illyric_snake_cult_desc:0 "Культ змея, традиционный для южных иллирийцев, несомненно, благословит нашу страну повышенным плодородием."
 illyric_sun_cult:0 "Солнце"
 illyric_sun_cult_desc:0 "Культ солнца, традиционный для северных иллирийцев, несомненно, вдохновит на преданность даже наименее набожных наших подданных."
 illyric_horseman_cult:0 "Всадник"
 illyric_horseman_cult_desc:0 "Контакты с фракийцами принесли нам культ Фракийского всадника, великого охотника, чьё мастерство верховой езды стало легендой. Поклонение ему, несомненно, вдохновит и наших собственных всадников."
 canaanite_cult:0 "Танит"
 canaanite_cult_desc:0 "Мы следуем богине Танит, чьё благословение принесёт дождь нашим посевам, защитит наших воинов в бою и обеспечит плодовитость нашим женщинам."
 kemetism_cult:0 "Ра"
 kemetism_cult_desc:0 "Наш правитель - прямой представитель бога Ра. Следуя за правителем и подчиняясь ему беспрекословно, мы исполним божественную волю Ра и обеспечим его благословение нашему народу."
 druidic_cult:0 "Друидическая"
 druidic_cult_desc:0 "Мы следуем таинственным учениям друидов, чьи законы хранят порядок и приносят нашей державе милость богов."
 ajivika_cult:0 "Аджива"
 ajivika_cult_desc:0 "Мы приняли нияти - веру в то, что жизнь предопределена судьбой. Ни боги, которым мы поклоняемся, ни наши поступки, благие или злые, никогда не изменят будущее и не повлияют на нашу конечную участь, ибо свободной воли не существует."
 ZZZ_enhanced_desi:3 "Деси"
 ZZZ_enhanced_desi_desc:3 "Деси - богиня изобилия. Её идолов широко используют как предметы поклонения, и ей повсеместно приносят жертвы."
 ZZZ_enhanced_parn:3 "Парн"
 ZZZ_enhanced_parn_desc:3 "Парн - бог удачи и царской славы."
 ZZZ_enhanced_nanaiya:3 "Нанайя"
 ZZZ_enhanced_nanaiya_desc:3 "Нанайя Чувственная - четырёхрукая богиня любви и наслаждения."
 ZZZ_enhanced_weshparkar:3 "Вешпаркар"
 ZZZ_enhanced_weshparkar_desc:3 "Вешпаркар - бог ветра."
 ZZZ_enhanced_wishaghn:3 "Вишагн"
 ZZZ_enhanced_wishaghn_desc:3 "Вишагн - бог победы."
 ZZZ_enhanced_zurvan:3 "Зурван"
 ZZZ_enhanced_zurvan_desc:3 "Зурван - бог знания и царь богов."
 ZZZ_enhanced_unreformed_religion:3 "Нереформированное язычество"
 desc_ZZZ_enhanced_unreformed_religion:3 "Эта держава исповедует нереформированную языческую религию. Из-за этого обращения затруднены, пока она не сможет реформировать свою веру."
 fraticelli_rome:3 "Оккупация Рима"
 desc_fraticelli_rome:3 "Оккупация Рима фратичеллами не могла вызвать ничего, кроме всеобщего возмущения."
 fraticelli_subjugation:3 "Подчинение папства"
 desc_fraticelli_subjugation:3 "Мы подчинили земли папства. Это вредит нашей репутации в глазах других верных фратичеллов."
 west_african_pagan_reformed_migration_into_ZZZ:3 "Усилия по реформации"
 desc_west_african_pagan_reformed_migration_into_ZZZ:3 "Некоторые слои общества хотят перемен в нашем обществе, как в религиозной, так и в административной сфере."
 ZZZ_baltic_pagan_migration_into_africa:3 "Переселение ромувцев"
 desc_ZZZ_baltic_pagan_migration_into_africa:3 "Большое число верующих Ромувы переселилось в эту провинцию. В благодарность они неустанно трудились над укреплением обороны державы [Root.GetName]."
 ZZZ_enhanced_poachers:3 "Бесконтрольные браконьеры"
 desc_ZZZ_enhanced_poachers:3 "В державе [Root.GetName] свирепствуют браконьеры и охотники, убивающие ради забавы. Это привело к росту чёрного рынка и возмущению населения, видящего бездействие власти."
 ZZZ_enhanced_animal_boom:3 "Рост популяции животных"
 desc_ZZZ_enhanced_animal_boom:3 "Численность животных в державе [Root.GetName] резко выросла, обеспечив обилие пищи и продуктов животного происхождения."
 ZZZ_finnish_pagan_migration_into_africa:3 "Переселение последователей суоменуско"
 desc_ZZZ_finnish_pagan_migration_into_africa:3 "Большое число последователей суоменуско переселилось в эту провинцию. Они обещали усердно трудиться на благо нашей державы в знак благодарности."
 ZZZ_slavic_pagan_migration_into_africa:3 "Славянское переселение"
 desc_ZZZ_slavic_pagan_migration_into_africa:3 "Большое число славянских верующих переселилось в эту провинцию. Они создали местные ополчения, и на удивление много их юношей вступило в армию, а если верить рассказам, то и несколько женщин пытались сделать то же самое!"
 ZZZ_tengri_pagan_migration_into_africa:3 "Переселение последователей Тенгри"
 desc_ZZZ_tengri_pagan_migration_into_africa:3 "Большое число последователей Тенгри переселилось в эту провинцию. Их всадники оказались прекрасным приобретением для державы."
 ZZZ_zunist_pagan_migration_into_africa:3 "Переселение зунистов"
 desc_ZZZ_zunist_pagan_migration_into_africa:3 "Большое число зунистов переселилось в эту провинцию. Они обещали защищать державу [Root.GetName] до смерти."
 ZZZ_enhanced_mighty_temple_being_built:3 "Строительство великого храма"
 desc_ZZZ_enhanced_mighty_temple_being_built:3 "В [Root.GetCapitalName] ведётся строительство великого храма богов."
 ZZZ_hellenic_pagan_migration_into_africa:3 "Эллинское переселение"
 desc_ZZZ_hellenic_pagan_migration_into_africa:3 "Большое число эллинских верующих переселилось в эту провинцию. Они обещали помочь лучше управлять державой [Root.GetName]."
 ZZZ_bon_pagan_migration_into_africa:3 "Переселение последователей бон"
 desc_ZZZ_bon_pagan_migration_into_africa:3 "Большое число последователей бон переселилось в эту провинцию. Они обещали усердно трудиться и не создавать проблем."
 ZZZ_spreading_of_reformed_pagan_rituals:3 "Ритуалы религии «$RELIGION$»"
 desc_ZZZ_spreading_of_reformed_pagan_rituals_title:3 "Эта держава приступила к серьёзным и согласованным усилиям по распространению ритуалов религии «$RELIGION$» среди населения."
 ZZZ_enhanced_mighty_temple:3 "Великий храм"
 desc_ZZZ_enhanced_mighty_temple:3 "Здесь стоит великий храм богов, сравнимый с Пантеоном или Парфеноном."
 ZZZ_enhanced_zoro_mecca:3 "Завоевание Мекки"
 desc_ZZZ_enhanced_zoro_mecca:3 "Мусульманские захватчики изгнали нас с наших земель. Наши древние храмы были осквернены, а вечные огни Заратустры погашены, но теперь мы отомщены. [Root.GetCapitalName], священный город ислама, находится под нашей властью."
 ZZZ_enhanced_hellenic_rome:3 "Отвоевание Рима"
 desc_ZZZ_enhanced_hellenic_rome:3 "Давным-давно христианские язычники довели нас почти до полного исчезновения, но мы выстояли и с помощью богов вернули Рим и отомстили за гибель империи."
 ZZZ_defend_the_motherland_baltic_cult:3 "Защита традиции"
 desc_ZZZ_defend_the_motherland_baltic_cult:3 "Как последователи Диваса и Пелкюнаса мы обязаны стойко защищать наши земли и образ жизни."
 ZZZ_enhanced_pet_lion:3 "Ручной лев"
 desc_ZZZ_enhanced_pet_lion:3 "У королевской семьи есть ручной лев, которого лично усмирили в борьбе."
 ZZZ_enhanced_good_horses:3 "Хорошие лошади"
 desc_ZZZ_enhanced_good_horses:3 "Поголовье лошадей этой державы необычайно высокого качества. Возможно, их улучшили сами боги?"
 ZZZ_enhanced_poor_horses:3 "Плохие лошади"
 desc_ZZZ_enhanced_poor_horses:3 "Поголовье лошадей этой державы столь плохо, что остаётся лишь предположить, что какой-то бог невзлюбил её."
 ZZZ_enhanced_white_stallion:3 "[ZZZ_enhanced_white_stallion_name]"
 desc_ZZZ_enhanced_white_stallion:3 "Королевская семья державы [Root.GetName] владеет великолепным белым жеребцом по имени [ZZZ_enhanced_white_stallion_name], быстрее ветра и сильнее льва. Он не позволяет ездить на себе никому, кроме членов королевской семьи."
 string_ZZZ_shadowfax:3 "Shadowfax"
 string_ZZZ_atrax:3 "Atrax"
 string_ZZZ_bree:3 "Bree"
 string_ZZZ_unnamed:3 "Белый жеребец"
 ZZZ_tengri_pagan_migration_into_africa2:3 "Переселенцы-всадники Тенгри"
 desc_ZZZ_tengri_pagan_migration_into_africa2:3 "Переселившиеся всадники Тенгри поступили к нам на службу. Они принесли с собой передовое искусство верховой езды и новые военные приёмы."
 ZZZ_bad_omens:3 "Дурные знамения"
 desc_ZZZ_bad_omens:3 "Эта держава получила неблагоприятные знамения относительно грядущих конфликтов."
 ZZZ_good_omens:3 "Добрые знамения"
 desc_ZZZ_good_omens:3 "Эта держава получила благоприятные знамения относительно грядущих конфликтов."
 ZZZ_great_omens:3 "Великие знамения"
 desc_ZZZ_great_omens:3 "Эта держава получила великие знамения относительно грядущих конфликтов."
 ZZZ_incredible_omens:3 "Невероятные знамения"
 desc_ZZZ_increedible_omens:3 "Эта держава получила знамения, гарантирующие победу во всех грядущих конфликтах."
