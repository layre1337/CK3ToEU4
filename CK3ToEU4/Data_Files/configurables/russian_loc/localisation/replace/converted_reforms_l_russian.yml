l_russian:
 ottoman_government:3 "Правление падишаха"
 ottoman_government_desc:3 "Правление падишаха во многом неотделимо от царского дома. Гарем гарантирует, что у падишаха, или «Государя-повелителя», никогда не будет недостатка в наследниках."
 english_monarchy:3 "Хартийная монархия"
 english_monarchy_desc:3 "Хартийная монархия - это представительная монархия, в которой монарх регулярно созывает парламент. Она основана на привилегиях, закреплённых в хартии, подписанной монархом и его вассалами."
 mamluk_government:3 "Правление черкесских рабов"
 mamluk_government_desc:3 "Это государство когда-то было захвачено черкесскими воинами-рабами и поддерживает своё существование за счёт постоянного ввоза черкесских рабов-солдат."
 indian_sultanate_reform:3 "Дхармический султанат"
 indian_sultanate_reform_desc:3 "Правящим мусульманским меньшинством султанам пришлось развить и расширить традиционные исламские представления о царской власти. Оставаясь исламскими государствами, они распространили статус зимми, традиционно относившийся к иудеям и христианам, на дхармические религии."
 prussian_monarchy:3 "Стратократическая монархия"
 prussian_monarchy_desc:3 "Монархическая форма правления, которую можно описать скорее как армию с государством, а не государство с армией."
 prussian_republic_reform:3 "Стратократическая администрация"
 prussian_republic_reform_desc:3 "Стратократической республикой правят не продажные олигархи и не воля невежественных масс, а самые искусные и проверенные в деле военачальники. Расширение и защита границ - главные задачи государства.\n\nОтключает выборы."
 prussian_republic:3 "Стратократическая администрация"
 prussian_republic_desc:3 "Стратократической республикой правят не продажные олигархи и не воля невежественных масс, а самые искусные и проверенные в деле военачальники. Расширение и защита границ - главные задачи государства.\n\nОтключает выборы."
 prussian_theocratic_reform_desc:0 "Чего стоит вера, если её нельзя защитить? Истинный слуга Божий принимает бой так же охотно, как проповедь и молитву. Наше стратократическое правление построено по этому принципу: военное дело здесь столь же важно, как и сама религия."
 mughal_government:3 "Система дивана"
 mughal_government_desc:3 "Если наша династия и усвоила за века что-то одно, так это то, что нужно уметь приспосабливаться к местному населению в землях, куда мы расширяемся. Будем учиться у тех, кого завоёвываем, чтобы наша империя могла расти и дальше."
 federal_republic:3 "Федеративная республика"
 federal_republic_desc:3 "Федеративная республика - это федерация штатов, каждый из которых обладает собственной независимостью и правительством, во главе с президентом, правящим четыре года после избрания."
 austrian_archduchy_reform:3 "Имперское эрцгерцогство"
 austrian_archduchy_reform_desc:3 "Хотя имперское эрцгерцогство устроено подобно феодальной монархии, оно стоит на ступень выше прочих герцогств. Благодаря долгому опыту управления самыми разными подданными и умелому устройству династических дел в свою пользу эрцгерцоги выработали эффективную систему управления своими землями и сохранения их единства."
 austrian_archduchy:3 "Имперское эрцгерцогство"
 austrian_archduchy_desc:3 "Хотя имперское эрцгерцогство устроено подобно феодальной монархии, оно стоит на ступень выше прочих герцогств. Благодаря долгому опыту управления самыми разными подданными и умелому устройству династических дел в свою пользу эрцгерцоги выработали эффективную систему управления своими землями и сохранения их единства."
 shaka_regime:0 "Стратократическое племя"
 shaka_regime_legacy:0 "Стратократическое племя"
 shaka_regime_desc:0 "Племенная монархия, ориентированная на военное господство над другими племенами и милитаризацию государства."
 shaka_regime_legacy_desc:0 "Племенная монархия, ориентированная на военное господство над другими племенами и милитаризацию государства."
