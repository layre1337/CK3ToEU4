 arianism: "Арианство"
 arianism_religion_desc:0 "Арианство - нетринитарное течение христианства, утверждающее, что Иисус Христос есть Сын Божий, сотворённый Богом-Отцом, отличный от Отца и потому подчинённый Ему. Учение Ария было осуждено как ересь на Первом Никейском соборе в 325 году."
 pagan_religion_religion_desc:3 "С начала истории и Европа, и Ближний Восток были домом для бесчисленных языческих религий и культов, не связанных с авраамическими верами."
 bon_religion_desc:3 "Бон - древняя коренная религия Тибета, существовавшая до буддизма. По своей природе она шаманистская и анимистическая, с множеством божеств. После появления буддизма в Тибете Бон заимствовал многие его элементы."
 west_african_pagan_religion_desc:3 "Западноафриканская религия объединяет многие разнородные языческие верования племён Африки южнее Сахары. Преобладают культ предков, анимизм и тотемистический шаманизм, но есть и разнообразные пантеоны богов."
 norse_pagan_religion_desc:3 "Древняя германская система верований включает большой пантеон богов во главе с мудрым богом-воином Одином (или Воданом), правящим всеми ветвями мирового древа Иггдрасиль. Два других главных бога - Тор (Тунар), друг людей, и Фрейр, бог плодородия."
 slavic_pagan_religion_desc:3 "Славянское язычество многобожно; главный бог - Перун, бог грома и молний. К другим важным божествам относятся Велес, бог подземного мира, Сварог, Ярило и Свантевит."
 baltic_pagan_religion_desc:3 "Балтийское язычество многобожно, пантеон возглавляет Диевс, бог неба. К другим главным богам относятся Перкунас, бог грома и молний, Сауле, богиня Солнца и плодородия, Даугава и Менесс."
 finnish_pagan_religion_desc:3 "Финское язычество разнообразно и сильно различается у разных племён и в разных землях. Оно почитает множество богов, среди которых Укко/Перкеле, Куу, а на востоке - Мастор-Ава, богиня Земли."
 tengri_pagan_religion_desc:3 "Тенгрианство - религия степных народов Евразии, особенно тюркских и монгольских кочевников. Главный бог - Тенгри, бог-творец, правящий небесами."
 zun_pagan_religion_desc:3 "Зун, Податель Справедливости, - бог солнца, которому первоначально поклонялась династия Зунбилов в Афганистане. Зун воплощает мудрость, силу, огонь и свет, прогоняющий ночь."
 pagan_religion_religion_desc:3 "С начала истории и Европа, и Ближний Восток были домом для бесчисленных языческих религий и культов, не связанных с авраамическими верами."
 aztec_pagan_religion_desc:3 "В ацтекской религии миф о сотворении мира построен на жертве: даже боги жертвовали собой, чтобы солнце продолжало движение. Это отражено в многочисленных праздниках и обрядах, предполагающих человеческие жертвоприношения в огромных масштабах. Главные боги - Уицилопочтли, бог войны и человеческих жертв, Тлалок, бог грома и дождя, Шиутекутли, бог огня, Шипе-Тотек, «наш Господь Освежёванный», и Кецалькоатль, бог мудрости."
 west_african_pagan_reformed_religion_desc:3 "Реформированная африканская религия - это слияние многих народных верований с единой Священной книгой, содержащей миф о сотворении мира, главы о духах, басни о тотемных животных и богах."
 baltic_pagan_reformed_religion_desc:3 "У реформированной балтийской веры есть Священная книга с мифом о сотворении мира, главами о богах и книгой пророчеств. Церковь также располагает единой литургией и стройной церковной иерархией во главе с верховным жрецом Диевса."
 finnish_pagan_reformed_religion_desc:3 "У реформированной финской веры есть Священная книга с мифом о сотворении мира, главами о богах и книгой заклинаний и таинств. Церковь также располагает единой литургией и стройной церковной иерархией во главе с верховным жрецом Укко."
 slavic_pagan_reformed_religion_desc:3 "У реформированной славянской веры есть Священная книга с мифом о сотворении мира, главами о богах и книгой пророчеств. Церковь также располагает единой литургией и стройной церковной иерархией во главе с верховным жрецом Перуна."
 zun_pagan_reformed_religion_desc:3 "Зун, Бог солнца и Податель Справедливости, воплощает мудрость, силу, огонь и свет, прогоняющий ночь. У реформированной веры Зуна есть Священная книга, излагающая, среди прочего, мифы о сотворении мира и догматы церкви, а также единая литургия и стройная церковная иерархия во главе с верховным жрецом."
 hellenic_pagan_religion_desc:3 "Эллинская религия многобожна, её пантеон включает двенадцать великих богов, среди которых Юпитер, Марс, Меркурий, Венера, Минерва и Веста. Она возникла в Древней Греции и после завоеваний Александра Македонского и Римской империи стала господствующей религией Средиземноморья вплоть до возвышения Христианского мира."
 hellenic_pagan_reformed_religion_desc:3 "Эллинская религия многобожна, её пантеон включает двенадцать великих богов, среди которых Юпитер, Марс, Меркурий, Венера, Минерва и Веста. Она возникла в Древней Греции и после завоеваний Александра Македонского и Римской империи стала господствующей религией Средиземноморья вплоть до возвышения Христианского мира."
 jain_religion_desc:3 "Джайнизм - религия невероятной древности, выросшая из аскетической традиции шраманов Индии в противовес жрецам-брахманам и кастовой системе. Главный принцип джайнизма - ахимса, ненасилие, толкуемое радикальнее, чем в любой другой религии."
 cathar_religion_desc:3 "Ересь катаров, или альбигойцев, отвергает исповедь, святость духовенства и Папы. У них есть лишь одно таинство - консоламентум, - снимающее грех и превращающее верующего в катарского «Совершенного»."
 fraticelli_religion_desc:3 "Фратичелли, или «Меньшие братья», - католическая ересь, возникшая в монашеском ордене францисканцев. Они привержены бедности и аскетизму, особенно для духовенства. Еретики-фратичелли яростно выступают против богатства Церкви и показной роскоши."
 waldensian_religion_desc:3 "Вальденсы, поначалу реформаторское движение внутри католической церкви, - еретики-антиклерикалы, призывающие вернуться к обетам бедности. Они выступают против смертной казни и полагают, что таинства могут совершать и миряне."
 lollard_religion_desc:3 "Еретики-лолларды выступают против того, что считают порчей внутри католической церкви. Как и многие католические ереси, они ненавидят богатство и пышность духовенства и призывают вернуться к более изначальной форме христианства."
 monophysite_religion_desc:3 "Монофизитство - ранняя христианская ересь, согласно которой у Христа была лишь одна природа. Это противоположно несторианской позиции, по которой у Христа две раздельные природы - божественная и человеческая."
 bogomilist_religion_desc:3 "Богомильство - изначально православная христианская ересь с гностическими элементами, полностью отвергающая церковную иерархию и призывающая вернуться к раннему христианству. Богомилы верят, что мир сотворил злой демиург - Дьявол."
 monothelite_religion_desc:3 "Монофелитство - христологическое учение, объявленное ересью в 681 году. Монофелиты пытались развить миафизитскую и монофизитскую позицию о единой природе Христа, утверждая, что у него есть и человеческая, и божественная природа, но лишь единая воля. Номинальный глава монофелитской церкви - монофелитский патриарх Антиохийский."
 iconoclast_religion_desc:3 "Иконоборческая ересь несколькими волнами сотрясала Византийскую империю. Иконоборцы считают, что священные изображения, в особенности иконы и изображения святых, - форма идолопоклонства и должны быть запрещены. В пору расцвета иконоборцы уничтожили бесчисленное множество таких украшений и икон, порой даже по призыву императоров-иконоборцев."
 paulician_religion_desc:3 "Павликианство - христианская гностическая ересь, подвергшаяся влиянию манихейства и возникшая в Армении."
 nestorian_religion_desc:3 "Несторианство - раннее христианское течение, согласно которому у Христа две раздельные природы - божественная и человеческая. Это противоположно монофизитской позиции, по которой у Христа лишь одна природа. Номинальный глава несторианской церкви - Патриарх Востока."
 messalian_religion_desc:3 "Мессалиане, или евхиты («Молящиеся»), - еретическая христианская секта, возникшая в Месопотамии под влиянием дуалистических вер, таких как зороастризм. Мессалиане верят, что Бога можно воспринять плотскими чувствами и что такое восприятие необходимо для достижения совершенства. Каждый человек рождается с внутренним демоном, и изгнать его может лишь жаркая молитва. Они также верят, что Люцифер - старший сын Бога и сила добра, а кровосмешение священно, так как его практиковали дети Адама и Евы. У них нет формальных обрядов и строгой церковной иерархии."
 zikri_religion_desc:3 "Зикри - последователи имама Ахар Заман Хазрата Сайида Мухаммада Джаунпури (Имама Махди)."
 yazidi_religion_desc:3 "Езиды верят, что Бог создал мир и поручил его семи ангелам, главный из которых - Ангел-Павлин, Малак-Тавус, или Шайтан, существо, которое христиане и мусульмане обычно отождествляют с сатаной."
 kharijite_religion_desc:3 "Хариджиты - течение ислама, подвергшееся маргинализации и гонениям уже в начале VII века. Они считают, что любой нераскаявшийся грешник - кафир, и отвергают представление о непогрешимости халифов."
 druze_religion_desc:3 "Религия друзов возникла в исмаилитской ветви шиитского ислама, но помимо авраамических религий включает много черт гностицизма и неоплатонизма."
 hurufi_religion_desc:3 "Хуруфизм - мистическая, каббалистическая суфийская секта в исламе."
 qarmatian_religion_desc:3 "Карматы - неортодоксальное ответвление шиитского ислама, сочетающее элементы зороастризма. Они отвергают общепринятое преемство шиитских правителей и паломничество хаджа."
 samaritan_faith_religion_desc:3 "Самаритянство - авраамическая религия, близкая к иудаизму. Самаритяне утверждают, что их вера - это истинная религия древних израильтян до Вавилонского плена, сохранённая теми, кто остался в Земле Израиля, тогда как иудаизм, по их словам, - родственная, но изменённая и исправленная религия."
 karaite_faith_religion_desc:3 "Караимский иудаизм - иудейское движение, отличающееся признанием одного лишь Танаха высшим законодательным авторитетом в иудейском религиозном праве и богословии. Этим он отличается от основного течения раввинистического иудаизма. Караимы считают, что все божественные заповеди, данные Богом Моисею, записаны в письменной Торе, без Устного закона и дополнительных толкований."
 khurmazta_religion_desc:3 "Хурмазта (Зарвана) - синкретическая форма зороастризма, распространённая среди согдийцев. Она смешивает зороастризм с индуизмом, буддизмом и разными языческими религиями. Помимо Хурмазты, второстепенным божествам, таким как Вешпаркар, бог ветра, поклоняются и приносят дары, обычно в виде небольших статуй."
 mazdaki_religion_desc:3 "Маздак был зороастрийским жрецом, объявившим себя пророком Ахура-Мазды. Он пытался реформировать религию, добавив в неё гностические элементы, и выступал за общность имущества и программы социальной помощи."
 manichean_religion_desc:3 "Манихейство - гностическая религия, включающая элементы христианства, зороастризма, буддизма и гностицизма."
 adamites:0 "Адамиты"
 adamites_religion_desc:0 "Адамиты, поначалу ранняя христианская секта позднеримской эпохи в Северной Африке, печально известны попытками восстановить Рай на земле: они ходили нагими и не считали себя ответственными ни за добро, ни за зло."
 adoptianist:0 "Адопцианство"
 adoptianist_religion_desc:0 "Иберийская ветвь адопцианизма уходит корнями в самостоятельное мышление в архиепископстве Толедо и окрестных епархиях, североафриканский пуританизм прошлых веков и нескольких чрезвычайно харизматичных еретиков начала IX века. Несмотря на многообразие форм, от утончённейших до откровенно грубых, объединяющим догматическим моментом остаётся сомнение в вечной божественности Сына."
 insular_celtic:0 "Островное"
 insular_celtic_religion_desc:0 "Островное кельтское христианство немного отличается от католичества, но недостаточно, чтобы выражаться игровыми механиками, помимо красивого названия."
 bosnian_church:0 "Крстяне"
 bosnian_church_religion_desc:0 "Давно забытые и католиками, и православными, крстяне боснийского нагорья терпимее своих более известных соотечественников, но лишены чёткой структуры. Сохраняя многие архаичные элементы христианства, они нередко встречают презрение единоверцев - если о них вообще помнят."
 masmudi:0 "Масмуди"
 masmudi_religion_desc:0 "Реформаторское течение ислама, возникшее среди берберских племён Северной Африки; последователи движения альмохадов считали себя унитариями и проповедовали учение об очищенном единобожии."
 mutazila:0 "Кадарийя"
 mutazila_religion_desc:0 "Рационалистическая школа богословия, утверждающая, что Коран не сосуществует с Богом вечно, поскольку Бог должен был предшествовать собственному слову."
 quranist:0 "Коранизм"
 quranist_religion_desc:0 "Буквалистское толкование ислама, подчёркивающее, что Коран - единственный источник божественной мудрости и должен исполняться буквально, без учёта хадисов и фетв."
 alawite:0 "Алавизм"
 alawite_religion_desc:0 "Религиозное учение алавитов тайное, а Коран - лишь один из их священных текстов. Помимо веры в преемство имамов через Али, алавиты верят в перевоплощение и в то, что все существа - звёзды, изгнанные с небес, которые теперь должны вновь заслужить своё место, проживая череду добродетельных и верных жизней."
 yazidism: "Езидизм"
 harmonized_yazidism:0 "Согласие с езидскими верами"
 desc_harmonized_yazidism:0 "Мы включили все езидские веры в наше государство и национальный дух."
 meshefaresism:0 "Мешефаресизм"
 meshefaresism_religion_desc:0 "Мешефаресисты - последователи Чёрной книги, рассказывающей, как Господь сошёл с Чёрной горы и сотворил мир."
 kitebacilweism:0 "Китебаджильвеизм"
 kitebacilweism_religion_desc:0 "Китебаджильвеисты - последователи Книги Откровения, повествующей о величии Хведе."
 HOLY_SITE_411_DESC:0 "В Мосуле находится Лалиш - горная долина и храм в Ниневии. Это самый священный храм езидов. Здесь расположена гробница шейха Ади ибн Мусафира, центральной фигуры езидской веры."
 HOLY_SITE_385_DESC:0 "Мекка известна как священное место ислама. Её контроль для верующих езидов стал бы доказательством того, что молиться следует в сторону Лалиша, а не Мекки."
 HOLY_SITE_379_DESC:0 "Как авраамическая вера, езиды почитают Иерусалим священным городом, к которому следует относиться с величайшим уважением и заботой."
 HOLY_SITE_4326_DESC:0 "Один из древнейших и славнейших городов мира, Нишапур был столицей не одной великой империи и источал престиж и могущество из самого своего средоточия."
 HOLY_SITE_430_DESC:0 "Говорят, что здесь находилось место погребения трёх волхвов, и Бушер важен не только стратегически, но и богословски."
 zurvanism:0 "Зурванизм"
 zurvanism_religion_desc:0 "Зурванисты верят, что Ахура-Мазда и Ангро-Майнью были равными, но противоположными близнецами, рождёнными Зурваном, Творцом всего сущего. Зурванизм делает особый упор на помощь Ахура-Мазде в искоренении зла и лжи."
 gayomarthianism:0 "Гайомартианство"
 gayomarthianism_religion_desc:0 "Исходя из мысли, что Ахура-Мазда силой своих помыслов случайно создал злых духов, гайомартиане отвергают непогрешимость Господа Мудрости и вместо этого подчёркивают обрядовую практику, чтобы познавать Истину в общении с Ахура-Маздой."
 khurramism:0 "Хуррамизм"
 khurramism_religion_desc:0 "В мире Света и Тьмы несправедливых правителей необходимо свергать во имя добра. Хуррамиты верят, что через таких пророков, как Маздак, Мухаммад и Абу Муслим, божественное рождается в человечестве и однажды вернётся, чтобы повести его как Мессия."
 gnostic: "Гностицизм"
 gnostic_religion_desc: "Гностицизм - собрание различных религиозных теорий, в основном построенных на дуализме и идее, что материальный мир есть плод Зла."
 harmonized_gnostic:0 "Согласие с гностическими верами"
 desc_harmonized_gnostic:0 "Мы включили все гностические веры в наше государство и национальный дух."
 mandeaism:0 "Мандеизм"
 mandeaism_religion_desc:0 "Мандеи ведут свой род от Адама, а величайшим своим пророком считают Иоанна Крестителя. Мир состоит из света и тьмы, и со временем все смертные души будут судимы - достойны ли они вернуться к вечному свету."
 valentinianism:0 "Валентинианство"
 valentinianism_religion_desc:0 "Отец, изначальный творец, - глубина всякого знания и путь к истинному пониманию, гнозису. Обретение знания улучшает мир, и когда мир сообща освободится от материального невежества, он вернётся в своё духовное, естественное состояние."
 sethianism:0 "Сифианство"
 sethianism_religion_desc:0 "Неведомый Бог излил всё сущее в совершенную Плерому, наполненную благодатными эонами, первым из которых был Барбело, Мать-Отец.\nПорча привела к появлению Ялдабаофа, укравшего частицу божественности и создавшего материальный мир. Однако, создавая человечество, он случайно наделил его своей украденной искрой божественности. Ялдабаоф вечно будет пытаться вернуть себе власть, а человечество должно стремиться вернуться к Барбело и Неведомому Богу."
 priscillianism:0 "Присцилианство"
 priscillianism_religion_desc:0 "Существуют два царства, Света и Тьмы. Человеческим душам надлежало победить Царство Тьмы, но они пали и оказались в ловушке материального мира. Среди людей были Двенадцать Патриархов Света, не сумевшие одолеть Тьму, так как были разделены между телом и душой. Поэтому Бог послал на землю Спасителя, и Его смерть вновь открыла путь к освобождению человеческих духов."
 cainitism:0 "Каинизм"
 cainitism_religion_desc:0 "Каин был первой жертвой Зла Демиурга, создателя всей физической материи. Поскольку материя и тела злы, тела должны быть осквернены и уничтожены греховностью, чтобы освободить истинную человеческую душу внутри."
 kushitism_pagan:1 "Кушитская вера"
 kushitism_pagan_religion_desc:0 "Почитание древних богов здесь по-прежнему сильно, как и почитание границы между жизнью и смертью."
 kushitism_pagan_reformed:0 "Реформированная кушитская вера"
 kushitism_pagan_reformed_religion_desc:0 "Возрождённая кушитская вера восходит своей историей на тысячи лет к древним египетским империям."
 magyar_pagan:2 "Уральская вера"
 magyar_pagan_religion_desc:1 "В этой вере каждого талтоша, или жреца, боги избирают ещё до его рождения. Наделённые нечеловеческой силой, мудростью и способностями, уральцы поручают талтошам защищать их общины и вести их к процветанию."
 magyar_pagan_reformed:0 "Реформированная уральская вера"
 magyar_pagan_reformed_religion_desc:0 "Объединённые общей верой, последователи реформированной уральской церкви верят в талтошей, или жрецов, избираемых богами ещё до рождения. Наделённые нечеловеческой силой, мудростью и способностями, уральцы поручают талтошам защищать их общины и вести их к процветанию."
 siberian_pagan:0 "Турумизм"
 siberian_pagan_religion_desc:0 "Турумисты верят в горизонтальный мир, где люди и звери живут кланами, связанными союзом или местью. Охота - основа равновесия между отнятием и даянием жизни, а со смертью все души плывут вниз по течению, чтобы переродиться в клане, где жили прежде."
 siberian_pagan_reformed:0 "Реформированный турумизм"
 siberian_pagan_reformed_religion_desc:0 "Турумистская церковь проповедует горизонтальный мир, где люди и звери живут кланами, связанными союзом или местью. Для турумистов равновесие жизни и смерти крайне важно, а напрасная охота считается великим грехом. Они верят, что со смертью все души плывут вниз по течению, чтобы переродиться в клане, где жили прежде."
 harmonized_confucian:0 "Согласие с конфуцианской философией"
 desc_harmonized_confucian:0 "Мы включили все конфуцианские идеалы в наше государство и национальный дух."
 harmonized_other_eastern:0 "Согласие с восточными верами"
 desc_harmonized_other_eastern:0 "Мы включили все восточные веры в наше государство и национальный дух."
 canaanite: "Ханаанская вера"
 canaanite_religion_desc: "Ханаанская религия многобожна и почитает множество богов и их ипостасей. Баал считается верховным божеством в сложной иерархии младших богов, которым часто поклонялись в святилищах на горах и холмах."
 druidism: "Друидизм"
 druidism_religion_desc: "Друиды были для кельтов особым общественным сословием. Часто выступая судьями и законодателями, они также определяли местные религиозные обычаи и верования."
 kemetism: "Кеметизм"
 kemetism_religion_desc: "История коренной египетской религии уходит в глубь тысячелетий. Многобожная вера, поклонение Ра, Атуму, Сехмет и другим, выражает глубокое благоговение перед основами природного мира."
 mardukism: "Мардукизм"
 mardukism_religion_desc: "История халдейского пантеона уходит в глубь тысячелетий. Поклоняясь таким богам, как Ану, Энки и Нанна, приверженцы халдейской религии возводят величественные храмы в честь избранного бога."
 ajivika: "Аджива"
 nuragic_pagan: "Нурагическая вера"
 nuragic_pagan_religion_desc:0 "Нурагическая вера уходит в бронзовый век Корсики и Сардинии. Наполненная культами животных и колодцев, она строится вокруг генотеистической веры в Бога-Отца, известного под многими именами, включая Сардо, Сид Аддир и другие."
 hurrian_pagan: "Хурритская вера"
 hurrian_pagan_religion_desc:0 "Хурриты поклонялись множеству богов, заимствованных из разных культур Ближнего Востока. Главными богами хурритского пантеона были Тешуб, могучий бог погоды, и его супруга Хебат, богиня-мать. Особый разряд почитаемых хурритами фигур составляли так называемые сарены - обожествлённые цари и герои."
 illyric_pagan: "Иллирийская вера"
 illyric_pagan_religion_desc:0 "Иллирийские народы верили в особый иллирийский пантеон с влиянием италийского и эллинского. У иллирийцев не было единого верховного бога, они поклонялись множеству местных божеств. Были у них и два важных культа: культ Солнца у пеонийских иллирийцев и культ Змея у южных иллирийцев."
 hattian_pagan: "Хаттская вера"
 hattian_pagan_religion_desc:0 "Поистине древняя вера: элементы хаттской религии возникли тысячи лет назад, ещё в каменном веке. Хаттские верующие живут в согласии с природными циклами времён года и самой Земли: Богине-Матери готовят и подносят дары и возлияния, чтобы поля оставались плодородными, а небесные бедствия не обрушились на землю."
 germanic_pagan:0 "Фирнсиду"
 anglo_pagan:0 "Осгелеафе"
 cybelene:0 "Кибелианство"
 zamolxism:0 "Залмоксианство"
 mithraism:0 "Митраизм"
 arab_pagan:0 "Ватания"
 armenian_pagan:0 "Хетанизм"
 caucasian_pagan:0 "Цармартоба"
 iberian_pagan:0 "Иберийская вера"
 scythian_pagan:0 "Скифская вера"
 briton_pagan:0 "Бриттская вера"
 gallic_pagan:0 "Галльская вера"
 gaelic_pagan:0 "Гэльская вера"
 celtiberian_pagan:0 "Кельтиберская вера"
 atenism:0 "Атонизм"
 germanic_pagan_religion_desc:0 "Исконная религия германских народов Северной и Центральной Европы, германское язычество объединяет несколько вер со значительными региональными различиями. Общие ключевые темы - ритуальные жертвоприношения, могущественные жрицы и строгий кодекс чести."
 anglo_pagan_religion_desc:0 "Англосаксонское язычество - многобожная система верований, сосредоточенная на божествах, известных как эсе. Самым заметным из них, вероятно, был Водан; среди других видных богов - Тунор и Тив. Верили и во множество иных сверхъестественных существ, населявших землю, включая эльфов, никоров и драконов."
 cybelene_religion_desc:0 "Фригийский культ Кибелы связан с доисторическим поклонением Богине-Матери. Развиваясь тысячелетиями, культ Кибелы нередко выводил своё родство от мифических фигур и героев, а религиозная практика включала почитание идолов."
 zamolxism_religion_desc:0 "Был ли Залмоксис первоначально пророком или богом - неизвестно. Однако даки и геты почитают Залмоксиса как божественное существо, приписывая ему множество чудес."
 mithraism_religion_desc:0 "Хотя греческий Митра вдохновлён иранским поклонением зороастрийскому божеству Митре, он связан с новой и самобытной образностью, популярной в имперской римской армии. У почитателей была сложная система из семи степеней посвящения и совместные ритуальные трапезы."
 arab_pagan_religion_desc:0 "Религия Аравии представляла собой многобожную смесь божеств, ипостасей и демонов, которым поклонялись в отдельных местностях и анклавах региона. В некоторых местах Аллаха, Бога-Творца, в тот период могли почитать как главу пантеона."
 armenian_pagan_religion_desc:0 "Халдский пантеон - религия, выросшая из урартской культуры много веков назад. Это в основном многобожная вера, главный бог которой, Халди, почитался как бог-воин."
 caucasian_pagan_religion_desc:0 "Пантеон Кавказской Иберии, возможно связанный с соседними анатолийскими религиями, возглавлял бог Армаз."
 iberian_pagan_religion_desc:0 "По сути гибридная многобожная религия, иберийские обряды включают почитание духов животных и культ предков. Иберы поклонялись различным эллинским и финикийским богам, а также местным божествам, таким как Бетатун или Атаэцина."
 scythian_pagan_religion_desc:0 "Эта пантеистическая вера, возникшая в скифских землях, почитала семь главных богов, часто отождествляемых с греческими. Сохраняются элементы более ранней многобожной народной религии скифов, а также обычай жертвоприношения лошадей и погребений с колесницами, схожий с кельтским."
 briton_pagan_religion_desc:0 "Кельты Британии поклонялись всему в природе; в целом это был спокойный и миролюбивый народ, но, будучи доведённым, он мог быть свиреп в бою, часто сражаясь совершенно нагим, если не считать сложных татуировок."
 gallic_pagan_religion_desc:0 "Галлы были гордым и могучим народом Западной и Центральной Европы; подобно своим соседям на Британских островах, они находили умиротворение в природе и поклонялись всему в природном мире."
 gaelic_pagan_religion_desc:0 "Гэлы следовали пантеону, схожему с пантеоном их соседей-кельтов, и поклонялись всему в природном мире; друиды и барды пользуются в гэльской культуре великим почётом."
 celtiberian_pagan_religion_desc:0 "Кельтские племена Иберии были загадочным народом, во многом утраченным для истории. Из немногого известного следует, что они очень похожи на галлов в культурном отношении и следовали схожему пантеону."
 atenism_religion_desc:0 "В отличие от многобожной кеметистской религии, атонизм - единобожная религия, сосредоточенная на поклонении одному лишь солнечному диску Атону. В отличие от кеметизма, атонисты отрицают существование других богов и прямо запрещают поклонение им."
 aztec_pagan:0 "Ацтекская вера"
 pagan_religion_reformed:0 "Неоязычество"
 harranism:0 "Харранизм"
 barghawata:0 "Баргавата"
 barghawata_religion_desc:0 "Сильно изменённая и берберизированная форма ислама, смешанная с традиционной берберской мифологией, основанная самопровозглашённым махди и пророком Салихом ибн Тарифом."
