l_russian:
 plati_ck_new_flavor.EVTNAME1: "Духовенство державы [Root.GetName]"
 plati_ck_new_flavor.EVTDESC1: "Хазарский каганат был известен религиозным разнообразием: в его пределах мирно уживались самые разные верования. Поначалу хазары исповедовали традиционный тюркский шаманизм, но со временем приняли и другие религии, в том числе иудаизм, христианство и ислам. Положение духовенства в Хазарском каганате менялось в зависимости от веры правящей верхушки. Если хазарские правители следовали иудаизму, то важные религиозные должности занимали иудейские наставники и учёные. Эти люди играли значительную роль в формировании религиозных обычаев и сохранении традиций иудейской общины каганата. С наступлением нового столетия наш [Root.Monarch.GetTitle] решил вновь пересмотреть положение священства в державе [Root.GetName]."
 plati_ck_new_flavor.EVTOPTA1: "Раввины будут помогать [Root.Monarch.GetTitle]."
 plati_ck_new_flavor.EVTOPTB1: "Воля племён выше воли любого жреца или шамана."
 plati_ck_new_flavor_enables_rabbis_tooltip: "§TОткрывает сословие духовенства§!"
 plati_ck_new_flavor_ignores_rabbis_tooltip: "Племена останутся единственным господствующим сословием, пока хазары не реформируют своё правительство"
 plati_ck_new_flavor.EVTNAME2: "Народный проповедник"
 plati_ck_new_flavor.EVTDESC2: "Харизматичный священник завоевал сердца жителей провинции [plati_ck_flavor_new_popular_priest_province.GetName]. Его мудрость, обаяние и глубокая связь с духами природы сделали его почитаемой фигурой, к которой идут за советом и в духовных, и в мирских делах. К несчастью, его проповеди сеют непослушание и неверность и подрывают авторитет: [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Особенно громко он говорит о дурном обращении с духовенством державы [Root.GetAdjective] и утверждает, что [Root.Monarch.GetTitle] отринул заветы предков и позорит верующих религии [Root.Religion.GetName]!"
 plati_ck_new_flavor.EVTOPTA2: "Послать щедрое пожертвование в его храм."
 plati_ck_new_flavor.EVTOPTB2: "Устроить публичную казнь."
 plati_ck_new_flavor.EVTOPTC2: "Если он любим народом культуры [plati_ck_flavor_new_popular_priest_province.Culture.GetName], [Root.Monarch.GetTitle] стерпит его дерзость."
 plati_ck_new_flavor_modifier_popular_priest: "Ревностный проповедник"
 plati_ck_new_flavor.EVTNAME3: "Тарханская система"
 plati_ck_new_flavor.EVTDESC3: "Тарханская система была особой административной и военной системой ротации в Хазарском каганате. Она играла важнейшую роль в управлении и стабильности каганата: позволяла разным знатным родам делить власть и не давала ей сосредоточиться в руках одного человека или одной группировки. Тарханская система служила механизмом сдержек и противовесов внутри правительства. Она не позволяла какому-либо одному роду стать чрезмерно могущественным. Ротация давала разным знатным семьям возможность участвовать в управлении, что снижало вероятность внутренних конфликтов. Однако тарханская система также способствовала децентрализации власти в Хазарском каганате. Она допускала региональную автономию и помогала сохранять верность знатных родов центральной власти кагана."
 plati_ck_new_flavor.EVTOPTA3: "Прекрасный институт, укрепляющий державу [Root.GetName]."
 plati_ck_new_flavor.EVTOPTB3: "Устаревший и бесполезный - распустить Совет тарханов."
 plati_ck_new_flavor_modifier_tarkhan: "Тарханская система"
 desc_plati_ck_new_flavor_modifier_tarkhan: "Высшим органом принятия решений в хазарском правительстве является Совет тарханов. Его составляют главы видных знатных родов; сообща они принимают важные решения, дают советы кагану и обсуждают дела государства."
 plati_ck_new_flavor.EVTNAME4: "Старейшинство"
 plati_ck_new_flavor.EVTDESC4: "Система старейшин у балтских племён была формой правления, опиравшейся на мудрость, опыт и наставления уважаемых старейшин общины. Она была распространена среди балтских племён, населявших Прибалтику в Северной Европе, включая территории нынешних Латвии, Литвы и часть Эстонии, в древности и в Средние века. Главной обязанностью старейшин было советовать племенному вождю или предводителю. Они давали наставления по самым разным вопросам: внутренним спорам, племенным обычаям, разрешению конфликтов и отношениям с соседними племенами. Старейшины также играли важную роль в поддержании обычного права и традиций племени. Они хранили знания предков, передавая устные предания и исторические сказания, которые формировали культурную самобытность общины."
 plati_ck_new_flavor.EVTOPTA4: "Прекрасный институт, укрепляющий державу [Root.GetName]."
 plati_ck_new_flavor.EVTOPTB4: "Устаревший и бесполезный - упразднить старейшинство."
 plati_ck_new_flavor_modifier_eldership: "Совет старейшин"
 desc_plati_ck_new_flavor_modifier_eldership: "Система старейшин у балтских племён была формой правления, основанной на коллективной мудрости и опыте пожилых членов общины. Она способствовала согласию, единству и чувству общей самобытности племён, а также помогала сохранять их культурное наследие и традиции."
 plati_ck_new_flavor.EVTNAME5: "Межрелигиозный диалог"
 plati_ck_new_flavor.EVTDESC5: "По мере развития нашей космополитической политики мы находим единомышленников: учёные державы [plati_ck_flavor_new_humanist_christian_country.GetAdjective] охотно переписываются с философами державы [Root.GetAdjective] и обмениваются гуманистическими идеями. Эта растущая межгосударственная приязнь начинает влиять на политику: дипломаты считают, что мы можем использовать это научное любопытство и укрепить отношения с [plati_ck_flavor_new_humanist_christian_country.Religion.GetName] [plati_ck_flavor_new_humanist_christian_country.Monarch.GetTitle] державы [plati_ck_flavor_new_humanist_christian_country.GetName]. Как бы кощунственно это ни звучало для некоторых, это явный признак зарождающегося примирения язычников и христиан Европы."
 plati_ck_new_flavor.EVTOPTA5: "Да будет так."
 plati_ck_new_flavor.EVTOPTB5: "Нам следует держаться подальше от правителей религии [plati_ck_flavor_new_humanist_christian_country.Religion.GetName]."
 plati_ck_new_flavor.EVTOPTC5: "Эта связь может и должна стать ещё крепче."
 plati_ck_new_flavor_modifier_exchange_of_faiths_ideas: "Межрелигиозный диалог"
 desc_plati_ck_new_flavor_modifier_exchange_of_faiths_ideas: "Межрелигиозный диалог - это конструктивная и уважительная беседа между людьми или представителями разных религиозных или духовных традиций. Его главная цель - способствовать взаимопониманию, развивать сотрудничество и преодолевать пропасть между различными системами верований. В ходе межрелигиозного диалога участники делятся своими взглядами, убеждениями и ценностями, стремясь найти общую почву и области взаимного уважения."
 plati_ck_new_flavor.EVTNAME6: "Межрелигиозный диалог"
 plati_ck_new_flavor.EVTDESC6: "По мере развития нашей космополитической политики мы находим единомышленников: учёные державы [plati_ck_flavor_new_humanist_pagan_country.GetAdjective] охотно переписываются с философами державы [Root.GetAdjective] и обмениваются гуманистическими идеями. Эта растущая межгосударственная приязнь начинает влиять на политику: дипломаты считают, что мы можем использовать это научное любопытство и укрепить отношения с [plati_ck_flavor_new_humanist_pagan_country.Religion.GetName] [plati_ck_flavor_new_humanist_pagan_country.Monarch.GetTitle] державы [plati_ck_flavor_new_humanist_pagan_country.GetName]. Как бы кощунственно это ни звучало для некоторых, это явный признак зарождающегося примирения язычников и христиан Европы."
 plati_ck_new_flavor.EVTOPTA6: "Да будет так."
 plati_ck_new_flavor.EVTOPTB6: "Нам следует держаться подальше от правителей религии [plati_ck_flavor_new_humanist_pagan_country.Religion.GetName]."
 plati_ck_new_flavor.EVTOPTC6: "Эта связь может и должна стать ещё крепче."
 plati_ck_new_flavor.EVTNAME7: "Повелители коней и их боги"
 plati_ck_new_flavor.EVTDESC7: "[plati_ck_flavor_new_tengri_nomad_country.Monarch.GetTitle] державы [plati_ck_flavor_new_tengri_nomad_country.GetName] известен блистательным двором, где уживаются разные веры и культуры. И хотя [plati_ck_flavor_new_tengri_nomad_country.Monarch.GetTitle] придерживается синкретических взглядов на религию, главной верой державы [plati_ck_flavor_new_tengri_nomad_country.GetAdjective] остаётся тенгрианство - шаманская религия, возникшая далеко от земель культуры [Root.Culture.GetName]. Грозная сила, держава [plati_ck_flavor_new_tengri_nomad_country.GetName] по-прежнему претендует на господство в регионе, и это вызывает всё больший интерес у языческих правителей Европы: какова же вера народов, завоевавших огромные земли и заставивших христиан и мусульман дрожать от страха? Возможно, нам стоит поучиться у тех, кто исповедует тенгрианство?"
 plati_ck_new_flavor.EVTOPTA7: "Отправим к ним собственную религиозную делегацию!"
 plati_ck_new_flavor.EVTOPTB7: "Быть может, у них найдутся лишние богословы?"
 plati_ck_new_flavor.EVTOPTC7: "Тенгри станет нашим новым верховным божеством!"
 plati_ck_new_flavor.EVTOPTD7: "Это чепуха."
 plati_ck_new_flavor.EVTNAME8: "[plati_ck_flavor_new_byzantium_country.GetName] в [GetYear] году"
 plati_ck_new_flavor.EVTDESC8: "[plati_ck_flavor_new_byzantium_country.GetName] под властью [plati_ck_flavor_new_byzantium_country.Monarch.GetTitle] [plati_ck_flavor_new_byzantium_country.Monarch.GetName] остаётся грозной региональной силой. Держава глубоко укоренена в вере [plati_ck_flavor_new_byzantium_country.Religion.GetName], а [plati_ck_flavor_new_byzantium_country.Monarch.GetTitle] считается защитником веры и земным представителем Бога; церковь играет значительную роль в политике и обществе, способствуя сплочённости и самобытности: [plati_ck_flavor_new_byzantium_country.GovernmentName]. Армия державы [plati_ck_flavor_new_byzantium_country.GetAdjective], славящаяся хорошо обученными и дисциплинированными воинами, играет решающую роль в сохранении региональной мощи: [plati_ck_flavor_new_byzantium_country.GovernmentName]. Передовая военная тактика и оборонительные укрепления не раз помогали защитить границы от внешних угроз. Несмотря на кажущуюся почти непобедимой, держава [plati_ck_flavor_new_byzantium_country.GetName] сталкивается со множеством трудностей: борьба за власть внутри страны, политические интриги и финансовые затруднения - главные опасности для государства. Тем не менее правители державы [plati_ck_flavor_new_byzantium_country.GetAdjective] располагают мощным и стабильным государством и, без сомнения, сыграют центральную роль в мировых событиях грядущих столетий."
 plati_ck_new_flavor.EVTOPTA8: "[plati_ck_flavor_new_byzantium_country.Capital.GetCapitalName] живёт..."
 plati_ck_new_flavor.EVTNAME9: "[plati_ck_flavor_new_great_power_nomadic_country.GetName] в [GetYear] году"
 plati_ck_new_flavor.EVTDESC9: "[plati_ck_flavor_new_great_power_nomadic_country.GetName] - региональная держава, господствующая над обширной территорией и прочно закрепившаяся в Европе. Основа её военной мощи - грозная и искусная конница: воины державы [plati_ck_flavor_new_great_power_nomadic_country.GetAdjective] славятся меткой стрельбой из лука, мастерством верховой езды и тактическим блеском на войне. Выгодное положение Орды позволяет ей контролировать главные торговые пути между Европой и Азией, что даёт значительное экономическое влияние и доступ к ценным товарам и ресурсам обоих континентов. Господство державы [plati_ck_flavor_new_great_power_nomadic_country.GetAdjective] оставило глубокий след в культурах покорённых земель: хотя правящая верхушка сохранила традиции культуры [plati_ck_flavor_new_great_power_nomadic_country.Culture.GetName], многие черты местных культур и обычаев завоёванных территорий повлияли на образ жизни державы [plati_ck_flavor_new_great_power_nomadic_country.GetAdjective] и смешались с ним. Если [plati_ck_flavor_new_great_power_nomadic_country.GetName] не падёт жертвой соперничества между правящими ханами и давления других поднимающихся держав, Европа может вновь услышать громовой топот всадников державы [plati_ck_flavor_new_great_power_nomadic_country.GetAdjective] - регион во власти [plati_ck_flavor_new_great_power_nomadic_country.Monarch.GetTitle] [plati_ck_flavor_new_great_power_nomadic_country.Monarch.GetName]."
 plati_ck_new_flavor.EVTOPTA9: "Бойтесь [plati_ck_flavor_new_great_power_nomadic_country.Monarch.GetTitle] в [plati_ck_flavor_new_great_power_nomadic_country.Capital.GetCapitalName]..."
 plati_ck_new_flavor.EVTNAME10: "[Root.GovernmentName] державы [Root.GetName]"
 plati_ck_new_flavor.EVTDESC10: "На престол взошёл дальновидный [Root.Monarch.GetTitle] со смелой мечтой преобразовать монархию державы [Root.GetAdjective] в иное политическое образование, способное приспособиться к приближающимся ветрам перемен. При поддержке совета мудрых советников [Root.Monarch.GetTitle] готовится изменить правление так, чтобы сохранить ценности традиции и в то же время принять эффективные, пусть и не современные, идеалы управления. Обещания единства, стабильности и возвращения к славному прошлому нации вселяют новую надежду в народ культуры [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTA10: "Сильная знать - залог стабильности державы [Root.GetName]."
 plati_ck_new_flavor.EVTOPTB10: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] должен править безраздельно."
 plati_ck_new_flavor.EVTOPTC10: "Эрцгерцогство - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTD10: "Повелитель франков должен приспосабливаться к краю, которым правит."
 plati_ck_new_flavor.EVTOPTE10: "Византийское самодержавие - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTF10: "Таништри - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTG10: "Португальская монархия - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTH10: "Священная имперская монархия - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTI10: "Монархия с штатгальтером - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTU10: "Сейм - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTV10: "Норвежская монархия - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTP10: "Датское архикоролевство - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTR10: "Кальмарская уния - памятник культуре и изобретательности народа [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTN10: "Необходимо оградить державу от появления деспотов и тиранов."
 plati_ck_new_flavor.EVTOPTM10: "Икта - памятник культуре народа [Root.Culture.GetName] и вере [Root.Religion.GetName]."
 plati_ck_new_flavor.EVTOPTQ10: "Верховное королевство - памятник объединению державы [Root.GetName]."
 plati_ck_new_flavor.EVTOPTL10: "Пиратское государство - поистине самая совершенная и прочная форма правления."
 plati_ck_new_flavor.EVTOPTX10: "...но в конце концов прихоти одного [Root.Monarch.GetTitle] не должны менять вековой порядок."
 plati_ck_new_flavor.EVTNAME11: "Андалусское управление"
 plati_ck_new_flavor.EVTDESC11: "Хотя общество Аль-Андалуса и было мусульманским, оно славилось религиозной терпимостью, особенно в первые столетия. Немусульманские общины, такие как христиане и иудеи, могли исповедовать свои религии и получали определённую автономию. Эта политика, известная как «конвивенсия», способствовала созданию многокультурного и интеллектуально живого общества. Исламские правители Аль-Андалуса включили в своё управление элементы местной вестготской и римской культур, приспособив существующие административные практики и инфраструктуру. Поскольку [Root.GetAdjective] [Root.Monarch.GetTitle] правит культурно и религиозно разнородными землями, введение андалусской культуры и системы управления остаётся весьма заманчивой идеей."
 plati_ck_new_flavor.EVTOPTA11: "Что ж, примем её."
 plati_ck_new_flavor.EVTOPTB11: "Нынешняя система предпочтительнее."
 plati_ck_new_flavor.EVTNAME12: "Сыновья Карла Великого"
 plati_ck_new_flavor.EVTDESC12: "Династия Каролингов оказала огромное влияние на Западную Европу в годы своего правления, особенно при Карле Великом: созданная им империя сыграла решающую роль в объединении раздробленного региона и заложила основы средневекового политического порядка. Несмотря на первоначальное единство, Каролингская империя после смерти Карла Великого распалась из-за внутренних конфликтов, разногласий между наследниками и внешнего давления. Влияние династии Каролингов было огромным: она определила политический, религиозный и культурный облик Западной Европы раннего Средневековья. Хотя империя Каролингов не уцелела в целости, её влияние и наследие сыграли важнейшую роль в формировании последовавшей за ней средневековой европейской цивилизации. Теперь, когда держава [Root.GetName] вступает в новое столетие, [Root.Monarch.GetTitle] [Root.Monarch.GetName], чей род восходит к самому Карлу Великому, не может не думать, что эпоха паладинов и рыцарей без страха и упрёка подходит к концу - быть может, пора выковать новое политическое образование?"
 plati_ck_new_flavor.EVTOPTA12: "Примем итальянскую самобытность."
 plati_ck_new_flavor.EVTOPTB12: "Примем французскую самобытность."
 PLATI_DEFAULT_FRANCE_NAME: "Франция"
 PLATI_DEFAULT_FRANCE_NAME_ADJ: "французская"
 plati_ck_new_flavor.EVTOPTC12: "Примем германскую самобытность."
 PLATI_DEFAULT_GERMANY_NAME: "Германия"
 PLATI_DEFAULT_GERMANY_NAME_ADJ: "германская"
 plati_ck_new_flavor.EVTOPTD12: "Пусть праздные умы считают нас пережитком - держава [Root.GetName] будет править ещё тысячу лет!"
 plati_ck_new_flavor.EVTNAME13: "[plati_ck_flavor_new_persia_country.Monarch.Dynasty.GetName], [plati_ck_flavor_new_persia_country.GetName] в [GetYear] году"
 plati_ck_new_flavor.EVTDESC13: "В разные эпохи правительство державы [plati_ck_flavor_new_persia_country.GetAdjective] отличалось сочетанием централизованной власти, региональной автономии и культурных влияний, что отражало сложную и многообразную историю державы [plati_ck_flavor_new_persia_country.GetName]. К [GetYear] году династия [plati_ck_flavor_new_persia_country.Monarch.Dynasty.GetName] восстановила власть державы [plati_ck_flavor_new_persia_country.GetAdjective] в регионе и создала централизованную администрацию, во главе которой стоит [plati_ck_flavor_new_persia_country.Monarch.GetTitle]. [plati_ck_flavor_new_persia_country.Monarch.Dynasty.GetName] - приверженцы религии [plati_ck_flavor_new_persia_country.Religion.GetName] и представители культуры [plati_ck_flavor_new_persia_country.Culture.GetName], и их правление знаменует значительное возрождение религии [plati_ck_flavor_new_persia_country.Religion.GetName] в державе [plati_ck_flavor_new_persia_country.GetName]. [plati_ck_flavor_new_persia_country.Monarch.GetTitle] обладает и светской, и духовной властью как глава государства и глава веры [plati_ck_flavor_new_persia_country.Religion.GetName]. Духовенство играет заметную роль в правительстве, советуя [plati_ck_flavor_new_persia_country.Monarch.GetTitle] и влияя на государственную политику. [plati_ck_flavor_new_persia_country.Monarch.GetTitle] [plati_ck_flavor_new_persia_country.Monarch.GetName] - один из самых влиятельных правителей Азии, в его распоряжении мощная армия и богатое государство ([plati_ck_flavor_new_persia_country.GovernmentName]), которых более чем достаточно, чтобы превратить державу [plati_ck_flavor_new_persia_country.GetAdjective] в региональную гегемонию."
 plati_ck_new_flavor.EVTOPTA13: "От Ахеменидов до [plati_ck_flavor_new_persia_country.Monarch.Dynasty.GetName]..."
 plati_ck_new_flavor.EVTNAME14: "[plati_ck_flavor_new_andalusia_country.GetName] в [GetYear] году"
 plati_ck_new_flavor.EVTDESC14: "Закалённое в сражениях Иберийской борьбы государство [plati_ck_flavor_new_andalusia_country.GetName] ([plati_ck_flavor_new_andalusia_country.GovernmentName]), объединённое под властью династии [plati_ck_flavor_new_andalusia_country.Monarch.Dynasty.GetName], держит в руках грозную военную силу с давней традицией борьбы за распространение веры [plati_ck_flavor_new_andalusia_country.Religion.GetName] - у державы [plati_ck_flavor_new_andalusia_country.GetName] поистине большие возможности для дальнейшей экспансии вглубь Европы. Однако под руководством [plati_ck_flavor_new_andalusia_country.Monarch.GetTitle] [plati_ck_flavor_new_andalusia_country.Monarch.GetName] держава [plati_ck_flavor_new_andalusia_country.GetName] обнаруживает задатки для больших скачков в кораблестроении и мореплавании, отправляясь в экспедиции далеко за мыс Бохадор на юге. В поисках золота и пряностей моряки державы [plati_ck_flavor_new_andalusia_country.GetAdjective] вот-вот начнут плавания по всему земному шару - у державы [plati_ck_flavor_new_andalusia_country.GetName] есть удобный выход к Атлантическому океану и новым торговым путям, открывающимся на западе и юго-востоке."
 plati_ck_new_flavor.EVTOPTA14: "Куда первым делом обратятся армии державы [plati_ck_flavor_new_andalusia_country.GetAdjective]?"
 plati_ck_new_flavor.EVTNAME15: "Маджлис ад-Зимма"
 plati_ck_new_flavor.EVTDESC15: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] взошёл на престол в пору, омрачённую сложным устройством общества, когда сословие зимми не могло найти своего законного места среди правящей элиты религии [Root.Religion.GetName]. Спустя долгое время после исламских походов в Европу их возможности во многих сферах жизни оставались ограниченными, что мешало их вкладу в рост и процветание: [Root.GovernmentName]. [Root.Monarch.GetTitle] [Root.Monarch.GetName] поощрял назначение советников из числа зимми на влиятельные административные должности. Последним административным новшеством стало учреждение Маджлис ад-Зимма - отдельного совещательного совета, занимающегося вопросами иных вероисповеданий, идей и институтов. Этот новаторский шаг должен был привнести в структуру управления разнообразные взгляды и опыт, дополнительно усилить общину зимми и показать её ценный вклад в рост и процветание: [Root.GovernmentName]. Когда реформы пустили корни и расцвели, некогда оттеснённое на обочину сословие зимми начало процветать, внося значительный вклад в прогресс султаната. Экономика султаната пошла в гору, торговля расцвела, культурный обмен заиграл новыми красками, обогатив жизнь всех жителей. К [GetYear] году возникшая атмосфера терпимости и сотрудничества стала маяком надежды, привлекая людей отовсюду, кто искал общество, построенное на принципах справедливости и религиозного равенства."
 plati_ck_new_flavor.EVTOPTA15: "Провести реформы."
 plati_ck_new_flavor.EVTOPTB15: "Отвергнуть эти идеи."
 plati_ck_new_flavor_modifier_reforms_for_dhimmis: "Маджлис ад-Зимма"
 desc_plati_ck_new_flavor_modifier_reforms_for_dhimmis: "Отдельный совещательный совет, занимающийся вопросами иных вероисповеданий, идей и институтов."
 plati_ck_new_flavor.EVTNAME16: "Реформы: [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 plati_ck_new_flavor.EVTDESC16: "Взойдя на престол, [Root.Monarch.GetTitle] [Root.Monarch.GetName] отважно взялся превратить державу [Root.GetName] в современное и могущественное государство, порвав с традиционными нормами и переняв европейские технологии и институты. Вдохновлённый современными европейскими идеалами, [Root.Monarch.GetTitle] [Root.Monarch.GetName] стремился вырваться из оков традиционализма и принять принципы разума, науки и прогресса. Он считал, что, учась у технологического и административного мастерства Запада, держава [Root.GetName] сможет остаться значимым игроком на мировой арене. Самой примечательной чертой модернизаторского порыва [Root.Monarch.GetTitle] [Root.Monarch.GetName] стал его энтузиазм в отношении европейских технологий. Понимая, что Европа постепенно затмевает Азию в технике, он поставил во главу угла приобретение и усвоение передовых европейских изобретений и знаний. Для и без того новаторского государства ([Root.GovernmentName]) эти реформы оказались полезными, хотя и вызвали массовые социальные волнения и поставили державу [Root.GetAdjective] на грань гражданской войны."
 plati_ck_new_flavor.EVTOPTA16: "Мы модернизируем державу [Root.GetName], не поступаясь догматами религии [Root.Religion.GetName]!"
 plati_ck_new_flavor.EVTOPTB16: "Анатолийская школа мысли больше подходит культуре [Root.Culture.GetName]."
 plati_ck_new_flavor.EVTOPTC16: "Отвергнуть эти нелепые затеи."
 plati_ck_new_flavor.EVTNAME17: "Великая война: [Root.GetAdjective] - [plati_ck_flavor_new_the_again_byzantines.GetAdjective], [GetYear] год"
 plati_ck_new_flavor.EVTDESC17: "Держава [plati_ck_flavor_new_the_again_byzantines.GetName] продолжает набирать силу, а честолюбие и жажда завоеваний ([plati_ck_flavor_new_the_again_byzantines.Monarch.GetTitle] [plati_ck_flavor_new_the_again_byzantines.Monarch.GetName]) остаются неутолёнными. Мало-помалу разгорается соперничество между [plati_ck_flavor_new_the_again_byzantines.Monarch.GetTitle] и [Root.Monarch.GetTitle] [Root.Monarch.GetName] - правителем могучей державы [Root.GetName]. Пока две силы борются за влияние в регионе, подданным державы [Root.GetAdjective] становится ясно: Византия не рухнет в ближайшее время и весьма успешно справляется с внутренней борьбой за власть. Более того, [plati_ck_flavor_new_the_again_byzantines.Monarch.GetName] показал себя способным правителем: он преобразует вековое государство ([plati_ck_flavor_new_the_again_byzantines.GovernmentName]) в менее архаичное, модернизирует армию и проводит целую череду реформ. Теперь [Root.Monarch.GetTitle] [Root.Monarch.GetName] должен выбирать между двумя неизбежностями: гегемония державы [plati_ck_flavor_new_the_again_byzantines.GetAdjective] или война с ней. Если [Root.Monarch.GetSheHe] выберет второе, найдётся немало других великих держав, жаждущих увидеть её сломленной. Антивизантийская коалиция остаётся заманчивой возможностью."
 plati_ck_new_flavor.EVTOPTA17: "Мы должны сразить Двуглавого орла, пока не поздно!"
 plati_ck_new_flavor_byzantium_accepted_coalition_tooltip: "§TКаждая великая держава Европы и Ближнего Востока, не состоящая в союзе с Византией, вступит в нашу наступательную войну против Византийской империи.§! Этот вариант перестанет быть доступным через 50 лет."
 plati_ck_new_flavor.EVTOPTB17: "С византийцами разберёмся позже."
 plati_ck_new_flavor_byzantium_refused_coalition_tooltip: "§RУ нас больше не будет возможности создать такую коалицию.§!"
 plati_ck_byzantine_coalition_title:0 "Антивизантийская коалиция"
 plati_ck_byzantine_coalition_desc:0 "§TКаждая великая держава Европы и Ближнего Востока, не состоящая в союзе с Византией, вступит в нашу наступательную войну против Византийской империи.§!"
 plati_ck_new_flavor.EVTNAME18: "Великая держава вступает в коалицию"
 plati_ck_new_flavor.EVTDESC18: "[plati_ck_flavor_new_country_fighting_byzantines.GetName] объявила войну византийцам! Сошлись две великие державы! Это наш шанс избавиться от этой порфироносной занозы в нашем боку!"
 plati_ck_new_flavor.EVTOPTA18: "Roma Delenda Est!"
 plati_ck_new_flavor.EVTOPTB18: "Эта война нас не касается."
 plati_ck_new_flavor.EVTNAME19: "Отношения религий [plati_ck_flavor_new_muslim_zoroastrian_country.Religion.GetName] и [Root.Religion.GetName]"
 plati_ck_new_flavor.EVTDESC19: "Отношения зороастрийцев и мусульман в Средние века знали периоды терпимости, сосуществования и защиты религиозных меньшинств, а также времена дискриминации, преследований и насильственных обращений. Положение сильно зависело от политической обстановки и склонностей правящих сил в разные эпохи и регионы. После смерти пророка Мухаммеда в 632 году исламский Праведный халифат быстро расширил свои владения военными завоеваниями. В это время области, прежде находившиеся под властью зороастрийцев, например Персия, перешли под власть мусульман. Со временем обращение с зороастрийцами менялось в зависимости от отношения отдельных правителей и местных властей. В одни эпохи и регионы зороастрийцы пользовались относительной терпимостью и могли продолжать свои обряды почти без вмешательства. В других случаях им приходилось сталкиваться с преследованиями и насильственным обращением в ислам. К [GetYear] году, несмотря на попытки мусульман подчинить зороастрийцев, возникло сильное независимое государство ([Root.GovernmentName]) религии [Root.Religion.GetName] и культуры [Root.Culture.GetName]. Остаётся много соперников иной веры, и важнейший из них - [plati_ck_flavor_new_muslim_zoroastrian_country.Religion.GetName] [plati_ck_flavor_new_muslim_zoroastrian_country.GetAdjective] государство ([plati_ck_flavor_new_muslim_zoroastrian_country.GovernmentName]) под властью [plati_ck_flavor_new_muslim_zoroastrian_country.Monarch.GetTitle] [plati_ck_flavor_new_muslim_zoroastrian_country.Monarch.GetName]. Однако [Root.Monarch.GetTitle] [Root.Monarch.GetName] - осторожный и рассудительный правитель, понимающий, к чему ведут религиозная ненависть и соперничество. Быть может, пора пересмотреть отношения между двумя великими державами?"
 plati_ck_new_flavor.EVTOPTA19: "Исключено, державы [plati_ck_flavor_new_muslim_zoroastrian_country.GetAdjective] - наши враги!"
 plati_ck_new_flavor.EVTOPTB19: "Чтобы иметь будущее, нужно отпустить прошлое."
 plati_ck_new_flavor.EVTOPTD19: "У нас общая история, общие враги, общее будущее - мы должны держаться вместе."
 plati_ck_new_flavor.EVTOPTC19: "Лучше сохранить статус-кво."
 plati_ck_new_flavor.EVTNAME20: "Наследник, подражающий предку"
 plati_ck_new_flavor.EVTDESC20: "[Root.Heir.GetName] - многообещающий наследник: [Root.Heir.GetSheHe] проявил заметный интерес к изучению истории державы [Root.GetAdjective], читает о великих деяниях культуры [Root.Culture.GetName] и о своих далёких предках и с жадностью слушает рассказы сказителей и хранителей традиций культуры [Root.Culture.GetName]. Похоже, его интерес не только научный: как истинный последователь религии [Root.Religion.GetName], [Root.Heir.GetName] хочет почтить предков и стремится быть на них похожим. Подражание - искреннейшая форма лести, и его предшественник, [Root.Monarch.GetTitle] [Root.Monarch.GetName], должен направить этот юный ум к идеализации величайших правителей рода [Root.Dynasty.GetName]!"
 plati_ck_new_flavor.EVTOPTA20: "В нашем роду были великие управители и законодатели!"
 plati_ck_new_flavor.EVTOPTB20: "В роду [Root.Dynasty.GetName] было немало харизматичных лидеров!"
 plati_ck_new_flavor.EVTOPTC20: "Наши предки были гордыми воинами!"
 plati_ck_new_flavor.EVTOPTD20: "[Root.Heir.GetTitle] [Root.Heir.GetName] должен выковать свой собственный характер."
 plati_ck_new_flavor.EVTNAME21: "Латинская империя"
 plati_ck_new_flavor.EVTDESC21: "То, что прежде было оплотом восточной православной церкви, ныне затмил католический [Root.GovernmentName] под властью благочестивого [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Как свидетельство религиозного превосходства, государство [Root.GetAdjective] многие провозглашают Защитником веры и Поборником католицизма, оберегающим христианскую Европу и от язычников, и от еретиков. Быть может, нам стоит использовать этот ревностный пыл, направить в это русло свою политику и стать настоящим католическим крестоносным государством ([Root.GovernmentName])?"
 plati_ck_new_flavor.EVTOPTA21: "Так угодно Богу!"
 plati_ck_new_flavor.EVTOPTB21: "Это чепуха."
 plati_ck_new_flavor.EVTNAME22: "Язычники за океаном"
 plati_ck_new_flavor.EVTDESC22: "Открытие Америки существенно повлияло на отношение к язычеству в Европе, особенно в связи со встречами с коренными народами и их религиозными верованиями. Общение с коренным населением Америки бросило вызов европейским взглядам на религию и вызвало разные реакции и сдвиги в отношении к язычеству. Открытие Америки и знакомство с религиями коренных народов побудили некоторых европейских мыслителей пересмотреть идею религиозного плюрализма и религиозной терпимости. Знакомство с многообразием религиозных практик поставило под сомнение представление об исключительности христианства как единственно истинной веры. Некоторые учёные начали отстаивать более широкий взгляд на религиозные верования, признавая потенциальную ценность других традиций и поддерживая диалог между культурами. Для европейских языческих государств, таких как [Root.GetName], это означало меньшую стигматизацию и новые возможности для диалога и сотрудничества - как дома, так и за океаном."
 plati_ck_new_flavor.EVTOPTA22: "Любопытно."
 plati_ck_new_flavor_modifier_colonialism_instituion: "Культурный релятивизм"
 desc_plati_ck_new_flavor_modifier_colonialism_instituion: "Открытие Америки расширило европейские горизонты и познакомило европейцев с более широким кругом религиозных верований и практик. Это знакомство побудило к размышлениям о природе религии, религиозной терпимости и культурном разнообразии. Хотя оно и не привело к полноценному возрождению древних языческих философий, оно способствовало более широкому пониманию религии и её места в мире."
 plati_ck_new_flavor.EVTNAME23: "Языческая мысль и Просвещение"
 plati_ck_new_flavor.EVTDESC23: "Многие мыслители эпохи Просвещения часто выступали за религиозную терпимость и принятие разных верований. Это более широкое отношение к религиозному плюрализму распространилось и на признание древних языческих верований частью исторического и культурного наследия человечества. И если в христианской Европе такое признание было лишь данью прошлому, то в некоторых европейских государствах его восприняли как призыв к возрождению языческого поклонения: древние, архаичные традиции возвращались и смешивались с новыми, более прогрессивными идеями. Так или иначе, Просвещение способствовало более широкому пониманию религиозного разнообразия и светскому, рациональному подходу к философии и духовности."
 plati_ck_new_flavor.EVTOPTA23: "Любопытно."
 plati_ck_new_flavor.EVTNAME24: "Религия [Root.Religion.GetName] и мировая торговля"
 plati_ck_new_flavor.EVTDESC24: "Мировая торговля способствовала культурному обмену между языческими обществами и купцами из разных стран. Этот обмен приводил к распространению знаний, идей и религиозных верований. Языческие общества получили возможность узнавать о чертах других культур и перенимать их, обогащая собственные культурные практики. Через торговлю предметами культуры и товарами они также знакомились с разными художественными стилями и архитектурными решениями. Это знакомство могло повлиять на их собственные способы художественного выражения и строительные практики. При всей пользе, сдвиг мысли в сторону глобализации торговли имел для языческих обществ экологические последствия: спрос на определённые ресурсы мог приводить к чрезмерной эксплуатации природных богатств, вырубке лесов и разрушению природных святилищ и священных рощ. Часто этому способствовали сдвиги в расстановке сил внутри языческих обществ и между ними - те, кто контролировал торговые пути или выступал посредником, могли получить экономическое и политическое влияние и ставить денежную выгоду выше сохранения традиций."
 plati_ck_new_flavor.EVTOPTA24: "Любопытно."
 plati_ck_new_flavor.EVTNAME25: "Столица Европы"
 plati_ck_new_flavor.EVTDESC25: "В XV веке [Root.Capital.GetCapitalName], вероятно, был крупнейшим городом Европы. В этот период [Root.Capital.GetCapitalName] служил столицей державы [Root.GetName]. Богатство города привлекало купцов, ремесленников и торговцев из разных уголков мира, что придавало ему разнообразный и космополитичный характер. Процветание державы [Root.GetName] в этот период отчасти объяснялось экономической мощью города [Root.Capital.GetCapitalName]. Политическая сила и стабильность города [Root.Capital.GetCapitalName] имели решающее значение для судьбы нации [Root.GetAdjective] - город стал центром учёности и привлекал учёных со всей Европы, что привело к основанию знаменитых учебных заведений, а культурный расцвет города [Root.Capital.GetCapitalName] повлиял на искусство, литературу и архитектуру, оставив долгий след в европейской культуре эпохи Возрождения."
 plati_ck_new_flavor.EVTOPTA25: "Поистине город, достойный зависти!"
 plati_ck_new_flavor.EVTOPTB25: "[Root.Capital.GetCapitalName] должен стать производственным лидером Европы!"
 plati_ck_new_flavor.EVTOPTC25: "[Root.Capital.GetCapitalName] должен стать торговым центром Европы!"
 plati_ck_new_flavor_modifier_province_capital_of_europe_generic: "Столица Европы"
 plati_ck_new_flavor_modifier_province_capital_of_europe_economic: "Экономическая столица Европы"
 plati_ck_new_flavor_modifier_province_capital_of_europe_trade: "Торговая столица Европы"
 plati_ck_new_flavor.EVTNAME26: "Pax Romana Aeternum"
 plati_ck_new_flavor.EVTDESC26: "Римляне - культура, достигшая совершенства в архитектуре, инженерном деле и градостроительстве; они возводили великолепные сооружения, такие как Колизей, Пантеон, акведуки, мосты и дороги, которые изумляют людей и сегодня. Римское искусство находилось под сильным влиянием греческого, но развило собственный уникальный стиль, особенно в реалистичных портретах и затейливых мозаиках. Обширная сеть дорог и судоходных рек Римской империи облегчала торговлю и коммерцию, связывая разные провинции и позволяя перемещать товары и ресурсы. Особую роль играло Средиземное море как морской торговый путь. В целом культурный и экономический расцвет Римской империи в эпоху Pax Romana оставил долгий след в мире, определив облик искусства, архитектуры, языка, права и многих других сторон европейской цивилизации. Средние века не были добры к государству ([Root.GovernmentName]): многие силы желали либо заполучить его титул, либо полного краха этого великого государства. В конечном счёте им это не удалось, и теперь, когда Рим вступает в XV век, остаётся лишь один вопрос: найдётся ли кто-то, кто сможет преградить путь славному расширению Рима?"
 plati_ck_new_flavor.EVTOPTA26: "A nulla vi Roma vinci potest."
 plati_ck_new_flavor.EVTOPTB26: "Festina lente."
