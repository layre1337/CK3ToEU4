l_russian:
 norse_cultural_ideas: "Идеи норманнов"
 norse_cultural_ideas_start: "Традиции норманнов"
 norse_cultural_ideas_bonus: "Амбиции норманнов"
 norse_viking_fury: "Ярость викингов"
 norse_viking_fury_desc: "Целые века Европа трепетала перед нашими набегами. Эпоха викингов далеко не окончена!"
 norse_conquerors: "Завоеватели"
 norse_conquerors_desc: "Многие наши предки, взявшиеся за меч и покорившие чужие земли, оседали там и постепенно растворялись среди местных жителей, порождая новые культуры. Для нас это обычное дело."
 norse_sea_identity: "Закалённые мореходы"
 norse_sea_identity_desc: "Викинги-мореплаватели регулярно пересекали Северную Атлантику от Скандинавии и Британии до Исландии, имея лишь простые навигационные приспособления и не имея компаса, несмотря на постоянные сильные штормы. Эти путешествия закалили наших моряков и облегчат им будущие приключения."
 norse_vinlandsaga: "Сага о Винланде"
 norse_vinlandsaga_desc: "Саги не лгут! Винланд лежит за холодным морем и ждёт, когда мы там поселимся!"
 norse_settle_homeland: "Освоение родины"
 norse_settle_homeland_desc: "Слишком долго наше богатство зиждилось на чужом богатстве, а точнее, на его грабеже. Хотя суровый климат и география и располагают к жизни набегами, возможно, нам стоит подумать и о собственном росте."
 norse_meritocracy: "Областные законоговорители"
 norse_meritocracy_desc: "Традиция законоговорителей уже некоторое время приходит в упадок. Однако по мере роста нашей империи необходимо учредить областных знатоков права, которые будут следить за порядком и правосудием."
 norse_regional_subjects: "Тонкая империя"
 norse_regional_subjects_desc: "Непосредственно управлять провинциями, оторванными от метрополии, непросто. Продолжая расширять влияние за морями, мы должны тщательно выстроить управление этими землями, чтобы обеспечить и верность, и контроль."
 iberian_muslim_cultural_ideas: "Идеи иберийских мусульман"
 iberian_muslim_cultural_ideas_start: "Традиции иберийских мусульман"
 iberian_muslim_cultural_ideas_bonus: "Амбиции иберийских мусульман"
 iberian_al_andalus: "Аль-Андалус"
 iberian_al_andalus_desc: "Почти тысячелетие мусульманские и христианские короли вели бесконечные войны за Иберию. Наша стойкость и непоколебимая убеждённость придали нам сил, чтобы выдержать эти испытания и противостоять постыдной 'Реконкисте'."
 iberian_bastion_of_thought: "Оплот мысли"
 iberian_bastion_of_thought_desc: "Андалусия может гордиться одними из величайших умов Средневековья. Пока другие короли были слишком заняты мелкими притязаниями и стычками, андалусские правители покровительствовали учёным, писателям и философам, и мы продолжим эту великую традицию."
 iberian_andalusian_architecture: "Андалусская архитектура"
 iberian_andalusian_architecture_desc: "И Альгамбра, и многие алькасары служили замками-дворцами для множества андалусских султанов. Во многом они сочетали природную красоту местности со строениями и садами, созданными и обставленными лучшими мусульманскими, еврейскими и даже христианскими мастерами и ремесленниками края. Эти архитектурные чудеса свидетельствуют о нашем величии."
 iberian_secure_african_ports: "Надёжные африканские порты"
 iberian_secure_african_ports_desc: "По мере того как наше внимание всё дальше уходит за пределы Европы, мы должны обеспечить наличие множества гаваней и безопасных пунктов снабжения для будущих плаваний."
 iberian_slave_trade: "Монополия на африканскую работорговлю"
 iberian_slave_trade_desc: "Находясь в стратегически выгодном положении вблизи африканских центров работорговли, мы должны добиться, чтобы вся такая торговля велась только под нашим надзором. Разумеется, главным образом для защиты уммы и зимми."
 iberian_further_into_america: "Новый Андалус"
 iberian_further_into_america_desc: "Религиозные конфликты и фанатичное безумие всё сильнее ослабляют христианский мир, и многие христиане бегут в Новый Свет, надеясь избежать религиозных преследований. Разумеется, наши милостивые правители примут их в недавно основанных колониях с распростёртыми объятиями."
 iberian_global_caliphate: "Всемирный халифат"
 iberian_global_caliphate_desc: "Многие называли себя преемниками славной империи Пророка, но лишь немногие достигли такого величия, как Андалусия. Имея обширные владения как за морем, так и на родине, мы создали стабильное и могущественное государство, достойное чести Пророка."
 latgalian_cultural_ideas: "Идеи латгалов"
 latgalian_cultural_ideas_start: "Традиции латгалов"
 latgalian_cultural_ideas_bonus: "Амбиции латгалов"
 latgalian_forests_and_swamps: "Леса и болота"
 latgalian_forests_and_swamps_desc: "В отличие от южных земель, здешние солдаты сталкиваются с множеством препятствий: лесами, болотами и неровной местностью. К счастью, наши полководцы приспособились к такой местности."
 latgalian_festival_feast_tradition: "Праздники и пиршества"
 latgalian_festival_feast_tradition_desc: "Летнее и зимнее солнцестояния, обряды плодородия и другие праздники по-прежнему широко распространены в нашей культуре. Наш народ гордится этой древней традицией."
 latgalian_religious_pragmatism: "Религиозный прагматизм"
 latgalian_religious_pragmatism_desc: "Здешняя география как нельзя лучше способствует смешению вер: и языческие, и христианские учения часто сталкиваются среди нашего населения, и это постоянное кипение идей сформировало довольно космополитичный взгляд на веру."
 latgalian_river_daugava: "Даугава"
 latgalian_river_daugava_desc: "Река, играющая центральную роль в нашей экономике. Любая торговля, идущая по ней, приносит нам огромную выгоду."
 latgalian_riflemen: "Латышские стрелки"
 latgalian_riflemen_desc: "Вначале это было войско, сформированное добровольцами, желавшими защитить свою родину, но оно выросло в элитную силу нашей армии. С тех пор их подвиги стали неиссякаемым источником вдохновения для латышского искусства и литературы."
 latgalian_hillforts: "Городища"
 latgalian_hillforts_desc: "Латгальские городища, как правило, входили в комплекс, состоявший из главной крепости, поселения вокруг неё, одного или нескольких могильников и расположенных поблизости ритуальных мест. Хотя они были гораздо слабее западных замков, их преимуществом было более дешёвое содержание."
 latgalian_atmoda: "Атмода"
 latgalian_atmoda_desc: "Наш народ пережил национальное пробуждение! Расцвет литературы, поэзии и идей, направленных на сохранение нашей культуры, породил множество учёных, гордящихся своими корнями!"
 latin_muslim_cultural_ideas: "Идеи латинских мусульман"
 latin_muslim_cultural_ideas_start: "Традиции латинских мусульман"
 latin_muslim_cultural_ideas_bonus: "Амбиции латинских мусульман"
 latin_glorious_conquests: "Затмить Рим"
 latin_glorious_conquests_desc: "Завоевания халифата отзываются эхом по сей день. Край, который когда-то считался сердцем католического мира, теперь находится под властью мусульман. Верьте во что хотите, но такое влияние достойно уважения."
 latin_ancient_knowledge: "Сохранение древних текстов"
 latin_ancient_knowledge_desc: "Отсталости христиан почти нет предела. Достижения древности, такие как Колизей, разобраны по кирпичику, римские акведуки заброшены, а многие древние тексты приходят в упадок. Именно нам предстоит сохранить и изучить эту древнюю культуру (или то, что от неё осталось). Даже имя 'Аристотель' - это арабский перевод."
 latin_christian_statesmen: "Привлечение христианских государственных мужей"
 latin_christian_statesmen_desc: "Не все христиане невежественны и неграмотны. Многие из них - превосходные советники и управленцы. Такие люди займут и должности в нашем правительстве."
 latin_christian_condottieri: "Контракты с кондотьерами"
 latin_christian_condottieri_desc: "Итальянским наёмникам мало дела до того, что их наниматели - мусульмане. Пока мы платим, они сражаются за нас. И мы позаботимся о том, чтобы они получали достаточно."
 latin_rival_andalusian_architecture: "Приглашение мавританских зодчих"
 latin_rival_andalusian_architecture_desc: "Андалусской архитектуре завидует весь мир. Почему вся слава должна достаться им? Итальянские мусульмане тоже расцветут в этой области!"
 latin_mediterranean_authority: "Власть над Средиземноморьем"
 latin_mediterranean_authority_desc: "Защита торговли со временем выросла в грозную военно-морскую силу. Теперь эта морская традиция определяет нас."
 latin_victory_through_mercy: "Победа через милосердие"
 latin_victory_through_mercy_desc: "Наш контроль над этой землёй, скорее всего, был бы невозможен без нашего благожелательного отношения к людям Писания. Со временем мы лишь укрепили эту связь терпимости и уважения, объединяющую нас друг с другом."
