 jewish_tribal_cultural_ideas_start:0 "Традиции колен Израилевых"
 jewish_tribal_cultural_ideas_bonus:0 "Амбиции колен Израилевых"
 jewish_tribal_people_of_exile:0 "Народ изгнания"
 jewish_tribal_people_of_exile_desc:0 "И буду найден вами, говорит Господь, и возвращу пленников ваших, и соберу вас из всех народов и из всех мест, куда Я изгнал вас, говорит Господь, и возвращу вас на место, откуда переселил вас."
 jewish_tribal_religious_toleration:0 "Религиозная терпимость"
 jewish_tribal_religious_toleration_desc:0 "Человечество произошло от одного человека, Адама, чтобы показать величие Бога. Когда человек чеканит монеты на прессе, каждая монета одинакова. Но когда Царь царей, Святой, благословен Он, создаёт людей по образу Адама, ни один не похож на другого."
 jewish_tribal_diaspora:0 "Диаспора"
 jewish_tribal_diaspora_desc:0 "Так говорит Господь Бог: вот, Я возьму сынов Израилевых из среды народов, куда они ушли, и соберу их отовсюду, и приведу их в землю их. И сделаю их одним народом в той земле, на горах Израилевых."
 jewish_tribal_chosen_people:0 "Избранный народ"
 jewish_tribal_chosen_people_desc:0 "Ты народ святой у Господа Бога твоего; тебя избрал Господь Бог твой, чтобы ты был Его собственным народом из всех народов, которые на земле."
 jewish_tribal_influential_rabbi:0 "Влияние раввинов"
 jewish_tribal_influential_rabbi_desc:0 "По закону, которому они научат тебя, и по суду, который они скажут тебе, поступай; не уклоняйся (ло тасур) от того, что они объявят тебе, ни направо, ни налево."
 jewish_tribal_banking:0 "Еврейское банковское дело"
 jewish_tribal_banking_desc:0 "Если ты дашь в заём деньги народу Моему, бедному, который живёт у тебя, не притесняй его, как ростовщик."
 jewish_tribal_new_jerusalem:0 "Новый Иерусалим"
 jewish_tribal_new_jerusalem_desc:0 "Светом для народов, чтобы спасение Господа дошло до края земли."
