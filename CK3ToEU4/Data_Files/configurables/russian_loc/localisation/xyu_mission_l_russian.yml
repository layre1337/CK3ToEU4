l_russian:
 ck_eu_baltic_missions_1_task_1_title:0 "Вера, что объединяет"
 ck_eu_baltic_missions_1_task_1_desc:0 "Каким бы богам мы ни поклонялись, мы должны видеть сородичей в тех, кто разделяет нашу веру, и укреплять священную связь между нами."
 ck_eu_baltic_missions_1_task_2_title:0 "Демонстрация силы"
 ck_eu_baltic_missions_1_task_2_desc:0 "Обстоятельства вновь вынудили нас взяться за клинки. Нынешние тяготы могут вознести наше государство к новым высотам. В конце концов, война нам не в новинку."
 ck_eu_baltic_missions_1_task_3_title:0 "Мощь на Балтике"
 ck_eu_baltic_missions_1_task_3_desc:0 "Со времён римлян нас, балтов, считали низшим народом, даже менее достойным внимания, чем варвары. Пора заявить о себе и показать, как ошибочно это суждение."
 ck_eu_baltic_missions_1_task_4_title:0 "Укротить воевод"
 ck_eu_baltic_missions_1_task_4_desc:0 "Гордыня даже самого захудалого вождя может стать серьёзной помехой при создании великого государства. Милостью или суровыми мерами мы должны добиться, чтобы прихоти знати не омрачили наше светлое будущее."
 ck_eu_baltic_missions_1_task_5_title:0 "Вопрос государственного устройства"
 ck_eu_baltic_missions_1_task_5_desc:0 "Наши предки веками жили племенами, и теперь мы вновь стоим на перепутье: будет ли [Root.GetName] управляться королём или же республикой? Столь непростой вопрос нельзя оставлять без ответа. "

 ck_eu_europagan_missions_1_task_1_title:0 "Военная добыча"
 ck_eu_europagan_missions_1_task_1_desc:0 "Наши предки прославились на весь мир грозными набегами и принесли в [Root.GetName] несметные богатства. Почтим же их память подобающим образом."
 ck_eu_europagan_missions_1_task_2_title:0 "Флот налётчиков"
 ck_eu_europagan_missions_1_task_2_desc:0 "Нередко щедрая добыча ждёт нас среди беспощадных ветров и грохочущих волн. Зачем вторгаться во владения врага, если можно забрать его богатства в море?"
 ck_eu_europagan_missions_1_task_3_title:0 "Вложения в родные земли"
 ck_eu_europagan_missions_1_task_3_desc:0 "Какие бы богатства мы ни привозили домой, хороший [Root.Monarch.GetTitle] должен заботиться и о росте собственных земель. Быть может, при должном управлении мы сделаем [Root.GetName] богатой и самодостаточной державой?"
 ck_eu_europagan_missions_1_task_4_title:0 "Религиозный прагматизм"
 ck_eu_europagan_missions_1_task_4_desc:0 "Сила религии [Root.Religion.GetName] - в её гибкости. Богов, которым поклоняется наш народ, наверное, сотни, если не тысячи. Мы стали терпимее к чужим божествам и даже к чужим идеям. Выслушаем же так называемых «еретиков» и изучим, чему они учат."
 ck_eu_europagan_missions_1_task_5_title:0 "Языческая ярость"
 ck_eu_europagan_missions_1_task_5_desc:0 "Многие могущественные короли возвысились и оправдывали свои зверства против язычников «божественным правом», дарованным им их жестоким богом. Преподадим же им урок истинного богословия."

 ck_eu_norse_missions_1_task_1_title:0 "Наследие викингов"
 ck_eu_norse_missions_1_task_1_desc:0 "Этим мы известны, и это мы делаем лучше всего."
 ck_eu_norse_missions_1_task_2_title:0 "Сага о Винланде"
 ck_eu_norse_missions_1_task_2_desc:0 "Наконец-то мы прочно обосновались в Новом Свете! Теперь нас не остановят никакие скрелинги!"
 ck_eu_norse_missions_1_task_3_title:0 "Империя Северного моря"
 ck_eu_norse_missions_1_task_3_desc:0 "Наша морская мощь позволит нам создать могучую империю в этих холодных водах. Это стремление так и не удавалось осуществить до сих пор."
 ck_eu_norse_missions_1_task_4_title:0 "Господство на Балтике"
 ck_eu_norse_missions_1_task_4_desc:0 "Германцы, славяне и даже мелкие балты продолжают тщетно пытаться упрочить своё положение крупных торговцев на Балтийском море. К их сожалению, у этой торговой зоны уже есть властелин - [Root.GetName]!"
 ck_eu_norse_missions_1_task_5_title:0 "Непревзойдённая корабельная промышленность"
 ck_eu_norse_missions_1_task_5_desc:0 "Похоже, спрос на корабельные припасы будет только расти. Мы должны обеспечить себя достаточным количеством этих ресурсов, чтобы с их помощью упрочить своё богатство и влияние."

 ck_eu_euromuslim_missions_1_task_1_title:0 "Ахль аз-зимма"
 ck_eu_euromuslim_missions_1_task_1_desc:0 "Межрелигиозным диалогом и великодушием мы поможем заблудшим христианам и иудеям принять свет Аллаха. А пока они не сделают этого, мы можем перенять великую мудрость, накопленную ими за время их «заблуждения»."
 ck_eu_euromuslim_missions_1_task_2_title:0 "Меч ислама"
 ck_eu_euromuslim_missions_1_task_2_desc:0 "Умма страдает от внешних угроз и нашествий неверных. Мы должны вмешаться!"
 ck_eu_euromuslim_missions_1_task_3_title:0 "Возродить Золотой век"
 ck_eu_euromuslim_missions_1_task_3_desc:0 "Многие считают, что Золотой век ислама миновал, но мы - живое доказательство того, что расцвет наук и искусств не прекращался. Напротив, он продолжает крепнуть и процветать в [Root.GetName]!"
 ck_eu_euromuslim_missions_1_task_4_title:0 "Хранители Рима"
 ck_eu_euromuslim_missions_1_task_4_desc:0 "Почти всё Средневековье благородный город Рим пребывал в отвратительном упадке, а древние памятники разбирались по кирпичику. Христиане явно показали свою неспособность управлять этими некогда великолепными землями. Положим конец этому невежеству и сохраним то, что осталось от наследия Рима!"
 ck_eu_euromuslim_missions_1_task_5_title:0 "Путь Ибн Баттуты"
 ck_eu_euromuslim_missions_1_task_5_desc:0 "Многие отважные и образованные путешественники и учёные побывали в дальних землях, запечатлев культуру и жизнь невероятно разных народов. Это открыло и новые торговые возможности, усилив обмен товарами и технологиями между Андалусом, Египтом, Персией и Индией. Отправим же смелых и дерзких купцов навстречу их собственным приключениям! "

 ck_eu_jewish_missions_1_task_1_title:0 "Восстановить Израиль"
 ck_eu_jewish_missions_1_task_1_desc:0 "Еврей больше не будет подчиняться языческому владыке! У нас есть собственное государство, и скоро мы вернём себе наш Дом!"
 ck_eu_jewish_missions_1_task_2_title:0 "Третий Храм"
 ck_eu_jewish_missions_1_task_2_desc:0 "Теперь, когда Иудея наконец вернулась в наши руки, первостепенной задачей становится строительство Третьего Храма! В прошлом уже были попытки осуществить это начинание, более или менее успешные, но под мудрым руководством [Root.Monarch.GetTitle] [Root.Monarch.GetName] эта мечта наконец сбудется!"
 ck_eu_jewish_missions_1_task_3_title:0 "Первосвященство"
 ck_eu_jewish_missions_1_task_3_desc:0 "Наконец-то должность первосвященника занята, а первосвященство восстановлено.\n\nКак и у еврейских жрецов древности, от Коэн Гадоля традиционно требовалось происхождение от Аарона, старшего брата Моисея. Из-за нехватки подходящих кандидатов это требование отменено, но новый первосвященник по-прежнему пользуется уважением еврейских религиозных общин."
 ck_eu_jewish_missions_1_task_4_title:0 "Еврейская диаспора"
 ck_eu_jewish_missions_1_task_4_desc:0 "Наш народ рассеян по всему миру. Мы должны построить для него новый дом и приветствовать его здесь!"
 ck_eu_jewish_missions_1_task_5_title:0 "Могучие воины Давида"
 ck_eu_jewish_missions_1_task_5_desc:0 "Прежде чем явится Мессия, мы должны собрать могучую армию, чтобы он повёл нас к процветанию! Как у Давида было тридцать семь могучих воинов, так и у Мессии будет сильнейшее войско в мире!"

 ck_eu_zoroastrian_missions_1_task_1_title:0 "Восходящее пламя"
 ck_eu_zoroastrian_missions_1_task_1_desc:0 "Благодаря удаче и божественной милости нам удалось взять под контроль одно из священных мест нашей веры. Это придаст нам столь необходимый подъём в грядущих сражениях."
 ck_eu_zoroastrian_missions_1_task_2_title:0 "Хранители огня"
 ck_eu_zoroastrian_missions_1_task_2_desc:0 "Слишком долго наши святыни оскверняла дерзость иноверцев. Мы должны положить этому конец!"
 ck_eu_zoroastrian_missions_1_task_3_title:0 "Восстановить Персию"
 ck_eu_zoroastrian_missions_1_task_3_desc:0 "Персия была и всегда будет зороастрийской по духу. Даже ислам на этой земле был искажён и переделан. Наш менталитет и пламенная душа противостоят чужим верам!"
 ck_eu_zoroastrian_missions_1_task_4_title:0 "Возродить империю"
 ck_eu_zoroastrian_missions_1_task_4_desc:0 "То, что казалось дерзкой реваншистской борьбой, обернулось восстановлением зороастрийского государства. Поистине, славный подвиг."
 ck_eu_zoroastrian_missions_1_task_5_title:0 "Завоевания Кира"
 ck_eu_zoroastrian_missions_1_task_5_desc:0 "Наши устремления распространяются как лесной пожар. У нас есть дух и сила продолжить завоевания, и мы это сделаем!"
