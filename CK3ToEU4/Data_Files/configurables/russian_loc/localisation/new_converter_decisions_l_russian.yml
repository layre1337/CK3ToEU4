 ZZZ_enhanced_reform_african_title:3 "Принять религиозные реформы"
 ZZZ_enhanced_reform_african_desc:3 "Нам показали, что старые порядки не всегда лучшие. Можно меняться вместе со временем и при этом сохранять своё наследие и достоинство. Кому-то это придётся не по нраву, но мы должны ввести наших шаманов в новую эпоху и принять реформы, так хорошо послужившие другим."
 ZZZ_spreading_of_reformed_pagan_rituals_title:3 "Распространение обрядов $RELIGION$"
 ZZZ_spreading_of_reformed_pagan_rituals_desc:3 "Для обращения в веру $RELIGION$ ничего не требуется: каждый вправе сам совершать свои религиозные обряды. Пока вы исполняете положенные обряды, вас считают истинным последователем. Будем побуждать всё больше подданных узнавать о наших обычаях, чтобы они хотя бы начали им следовать."
 ZZZ_remove_elective_challenge_title:3 "Бросить вызов знати"
 ZZZ_remove_elective_challenge_desc:3 "Слишком долго знать тормозила развитие нашей страны бесконечными интригами. Времена выборных монархий прошли столетия назад, и если мы будем бездействовать, соседи превратят и нашу страну в пережиток прошлого!"
 ZZZ_remove_elective_final_title:3 "Праздновать победу над знатью"
 ZZZ_remove_elective_final_desc:3 "Мы одержали верх над мелкой знатью, которая мешала прогрессу нашего государства. Теперь мы можем вести страну вперёд, не опасаясь их вмешательства!"
 institute_the_societas_jesu_FAP_title:3 "Учредить Общество Иисуса"
 institute_the_societas_jesu_FAP_desc:3 "Его Святейшество одобрил новый миссионерский орден, называемый Обществом Иисуса. Однако без поддержки короны он не сможет процветать. Поддержим ли мы иезуитов?"
 secularization_of_christian_theocracy_FAP_title:3 "Секуляризация"
 secularization_of_christian_theocracy_FAP_desc:3 "[Root.Monarch.GetTitle] - славный титул, но пора встать на собственные ноги и использовать наше влияние в этом государстве, чтобы создать нечто более прочное. Сколь бы набожным ни было наше государство, нам следует закрепить эти земли за собственными потомками, а не рисковать назначением неспособного преемника."
 statue_in_restraint_of_appeals_FAP_title:3 "Принять Статут об ограничении апелляций"
 statue_in_restraint_of_appeals_FAP_desc:3 "Официально низложить авторитет Папы и возвести короля в высшую судебную инстанцию во всех религиозных вопросах."
 revoke_restraint_of_appeals_FAP_title:3 "Отменить ограничение апелляций"
 revoke_restraint_of_appeals_FAP_desc:3 "Отменить принятый ранее закон, наделявший короля высшей судебной властью во всех религиозных вопросах, и вернуть эти права Папе."
 move_capital_to_rome_FAP_title:3 "Перенести столицу в Рим"
 move_capital_to_rome_FAP_desc:3 "Область и город Рим наконец возвращены Папскому государству. Пришло время восстановить Святой Престол."
 join_the_counter_reformation_FAP_title:3 "Принять Контрреформацию"
 join_the_counter_reformation_FAP_desc:3 "Его Святейшество Папа призвал приложить могучие усилия против протестантского движения. С помощью недавно основанного ордена иезуитов мы искореним эти гнусные ереси. Помимо большего числа более эффективных миссионеров, протестантству и реформатской вере будет труднее распространяться в нашем государстве. (Если мы когда-либо выберем национальные идеи '§YЭкуменизм§W' или '§YСвобода, равенство, братство§W', этот бонус будет утрачен.)"
 secularization_of_protestant_theocracy_EXTRA_title:3 "Секуляризация"
 secularization_of_protestant_theocracy_EXTRA_desc:3 "С разрывом связей с Римом мы больше не входим в большую христианскую иерархию. Возможно, верующим будет служить монарх не хуже, чем [Root.Monarch.GetTitle]?"
 test_act_EXTRA_title:3 "Принять Акт о присяге"
 test_act_EXTRA_desc:3 "Запретить всем, кто не состоит в государственной церкви, занимать военные и гражданские должности и оставить эту привилегию лишь тем, кто принял причастие по надлежащим обрядам нашей национальной церкви."
 dissolution_of_the_monasteries_EXTRA_title:3 "Принять Акт о роспуске монастырей"
 dissolution_of_the_monasteries_EXTRA_desc:3 "Усилить контроль и власть монарха, разрешив конфискацию любого церковного имущества с годовым доходом ниже определённого значения."
 popery_act_EXTRA_title:3 "Принять Акт о папизме"
 popery_act_EXTRA_desc:3 "Принять меры к ослаблению влияния католиков, предлагая деньги всякому, кто готов свидетельствовать против католического священника или епископа, пойманного за совершением богослужения."
 trade_propagation_convert_to_islam_EXTRA_title:3 "Принять Ислам как государственную религию"
 trade_propagation_convert_to_islam_EXTRA_desc:3 "Ислам всё больше становится господствующей религией и в правительстве, и среди наших подданных, и среди знати. Пора присоединиться к общине верных."
 restrict_government_offices_EXTRA_title:3 "Поощрять обращение в иудаизм"
 restrict_government_offices_EXTRA_desc:3 "Ограничим все важные должности в центральном, местном и военном управлении членами истинной веры, а для всех низших чиновников обеспечим бесплатное обучение законам Талмуда и Шулхан Аруха. Так мы породим и желание, и готовность обратиться."
 tengri_yellow_shamanism_EXTRA_title:3 "Жёлтый шаманизм"
 tengri_yellow_shamanism_EXTRA_desc:3 "Со времён Великих ханов многие наши подданные следуют буддизму Ваджраяны, и хотя мы сожалеем, что они отошли от чистой веры нашего народа, было бы неразумно отвергать их. Вместо этого подчеркнём синкретические черты нашей веры, заимствуем некоторые обряды Ваджраяны и включим этих буддистов в нашу общину."
 tengri_black_shamanism_EXTRA_title:3 "Чёрный шаманизм"
 tengri_black_shamanism_EXTRA_desc:3 "Буддизм распространяется среди последователей веры наших предков с тревожной быстротой. Хотя некоторые из наших предков приняли эту веру, теперь она опасно теснит истинную веру Тенгри и загрязняет обычаи наших подданных буддийскими веяниями. Мы должны решительно отвергнуть такие представления и вместо этого распространять среди своего народа истинные и чистые обычаи предков."
 tengri_expel_the_khojas_EXTRA_title:3 "Изгнать ходжей"
 tengri_expel_the_khojas_EXTRA_desc:3 "Со временем влияние ходжи и его потомков в нашей стране стало опасно сильным. Теперь, когда они лишились доверия нашего правителя, мы можем силой изгнать их из наших земель и избежать будущих раздоров."
 zoroastrian_rites_of_admission_EXTRA_title:3 "Обряд посвящения"
 zoroastrian_rites_of_admission_EXTRA_desc:3 "В отличие от некоторых религий, наша не пытается навязываться несведущим детям. Посвящение в зороастризм должен проходить тот, кто достаточно взрослый, чтобы понимать его смысл. Тем не менее многое можно сделать, чтобы привлечь тех, кто не видит ценности нашей веры."
 zoroastrian_royal_fires_EXTRA_title:3 "Возжечь царские огни"
 zoroastrian_royal_fires_EXTRA_desc:3 "Из всех храмов огня нашей веры самым почитаемым является легенда о трёх огнях, зажжённых самим Заратустрой. Однако они давно утрачены, ведь наша вера веками приходила в упадок, и места древних огней ныне неизвестны. Огонь нельзя создать заново, но мы можем попытаться найти места этих храмов и зажечь новые огни в знак возвышения нашей зороастрийской империи."
 zoroastrian_diaspora_EXTRA_title:3 "Зороастрийская диаспора"
 zoroastrian_diaspora_EXTRA_desc:3 "В суровые годы гонений в Персии многие покинули родные дома и расселились за границей. «Киса-йи Санджан» рассказывает о тех, кто совершил долгий и тяжкий путь, чтобы поселиться в Гуджарате, зажечь новые огни и начать всё заново. Эти мужчины и женщины, известные своим трудолюбием, процветают на новой родине. Наши усилия сделать зороастризм единственной религией большинства в наших границах позволят нам воссоединиться с этими братьями и сёстрами на чужбине."
 animism_ritual_education_EXTRA_title:3 "Обрядовое просвещение"
 animism_ritual_education_EXTRA_desc:3 "Вера в то, что в мире есть лишь одно божественное существо, ужасное заблуждение, которое, похоже, распространено повсюду. Мы должны стремиться просветить наших бедных подданных об истинной природе вещей, об устройстве мира и о множестве духов, которые его населяют."
 shamanism_wondering_shamans_EXTRA_title:3 "Странствующие шаманы"
 shamanism_wondering_shamans_EXTRA_desc:3 "Мы стали править землями далеко за пределами нашей веры, и множество язычников ищет у нас наставления. Отправим наших шаманов распространять нашу веру и учить тех из новых подданных, кто способен сам стать шаманом."
 spreading_of_norse_rituals_EXTRA_title:0 "Распространение обрядов $RELIGION$"
 spreading_of_norse_rituals_EXTRA_desc:0 "Для обращения в веру $RELIGION$ ничего не требуется: каждый вправе сам совершать свои религиозные обряды. Пока вы чтите асов (Одина, Тора, Фрейю и Снотру), вас считают последователем Асатру. Будем побуждать всё больше подданных узнавать о наших богах, чтобы они хотя бы начали им поклоняться."
 armenia_nation_EXTRA_title:3 "Королевство Армения"
 armenia_nation_EXTRA_desc:3 "Королевство Армения некогда господствовало на Кавказе. Но время было неласково к нашим предкам: соседние империи увидели слабость в наших внутренних разногласиях и воспользовались ею, чтобы покорить наш народ. Изгоним же захватчиков и восстановим Королевство и Церковь Армении."
 restore_byzantine_empire_EXTRA_title:3 "Восстановить Византийскую империю"
 restore_byzantine_empire_EXTRA_desc:3 "Славной Византийской империи больше нет, но пока в Константинополе остаются греки, есть надежда на возрождение. Мы можем занять её место по духу, но не можем принять её имя, пока не докажем, что достойны этого..."
 institute_prussian_monarchy_EXTRA_title:3 "Учредить прусскую монархию"
 institute_prussian_monarchy_EXTRA_desc:3 "Наша монархия должна вновь воплощать прусские добродетели и протестантские идеалы!"
 form_kingdom_of_prussia_EXTRA_title:3 "Основать Королевство Пруссия"
 form_kingdom_of_prussia_EXTRA_desc:3 "В Империи есть лишь один король - король Богемии. При этом наши земли в Пруссии не входят в историческую часть Империи, так объявим себя королём в Пруссии, чтобы подчеркнуть наше более высокое положение по сравнению с прочими курфюрстами."
 prussian_nation_EXTRA_title:3 "Преобразоваться в Пруссию"
 prussian_nation_EXTRA_desc:3 "Эпоха рыцарей-крестоносцев стремительно уходит. Придёт время, когда нам уже не будет выгоды держаться за атрибуты монашеского ордена. К тому же великий магистр куда охотнее стал бы герцогом... или королём. Преобразовавшись в светское государство, мы оживим наше управление и завоюем уважение соседей."
 prussian_nation_general_EXTRA_title:3 "Преобразоваться в Пруссию"
 prussian_nation_general_EXTRA_desc:3 "Земли, некогда завоёванные и онемеченные Тевтонским орденом, всегда будут нуждаться в защите от алчных соседей. Если Орден не справится с этим долгом, мы можем занять его место и начать новую эпоху процветания и прусской дисциплины."
 ruthenian_nation_EXTRA_title:3 "Вернуть наследие Руси"
 ruthenian_nation_EXTRA_desc:3 "Много веков назад земля Руси была объединена под единым знаменем и управлялась из легендарного города Киева. Но затем с великой степи пришли монгольские орды, грабя и сжигая всё на своём пути. Они разрушили наши кремли, города пали один за другим, и даже сам Киев не избежал этой участи. В ужасе наш народ бежал с равнин Руси на север, в леса и глушь земли, которую мы ныне зовём Россией.\nТеперь на севере поднимается новый, дерзкий город. Он притягивает к себе мелкие государства вокруг, и его правитель мечтает о новой Руси. О Руси с центром в Москве, а не в Киеве.\nОднако мы, русичи, не уйдём молча на страницы истории. Мы не позволим пришельцам и самозванцам присвоить наследие наших отцов. Киев вновь поднимется, и мы вернём ему былую славу и великолепие. Так же будет и с Русью."
 russian_nation_EXTRA_title:3 "Основать Российское государство"
 russian_nation_EXTRA_desc:3 "Завоеваниями и дипломатией Россия сумела превратиться из простого поселения в господствующее княжество. После нескольких восточных походов монгольские орды наконец усмирены, и возникает централизованное Российское государство под верховной властью царя. Влияние Западной Европы помогает нам модернизировать и преобразовать страну, а западное образование входит в обиход."
 capital_in_belgrade_EXTRA_title:3 "Перенести столицу в Белград"
 capital_in_belgrade_EXTRA_desc:3 "Белград занимает ключевую оборонную и экономическую позицию на Балканах и некогда был столицей Сербии. Сделаем этот великий город нашей столицей вновь и вернём ему былую славу!"
 steppe_horde_reform_EXTRA_title:3 "Реформировать правительство"
 steppe_horde_reform_EXTRA_desc:3 "Многие годы более развитые соседи смеялись над нашей отсталой формой правления. Но больше нет: с сегодняшнего дня наш великий вождь - король!"
 form_manchu_dynasty_EXTRA_title:0 "Династия Цин"
 form_manchu_dynasty_EXTRA_desc:0 "Мы взяли Северную столицу и разбили ложных императоров. Срединное государство должно объединиться под маньчжурским знаменем. Наша династия будет править тысячу лет!"
 pagan_conversion_to_gnostic_title:3 "Принять гностицизм"
 pagan_conversion_to_gnostic_desc:3 "Принять гностицизм"
 pagan_conversion_to_gnostic_tooltip:3 "[Root.GetName] примет гностическую веру, которой следуют его подданные, в качестве новой государственной религии."
 pagan_conversion_to_yazidi_title:3 "Принять езидизм"
 pagan_conversion_to_yazidi_desc:3 "Принять езидизм"
